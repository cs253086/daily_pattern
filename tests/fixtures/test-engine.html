<!doctype html>
<!--
  Minimal contract-conformant engine used ONLY for testing the render pipeline.
  This is NOT the Bloom engine. It implements the documented interface so that
  src/render.js can be exercised without the real artwork file.
-->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const int = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const flt = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = int('width', 1920);
  const H = int('height', 1080);
  const FPS = int('fps', 24);
  const DURATION = int('duration', 3600);
  const SEED = int('seed', 1);
  const SPEED = flt('speed', 1);

  const canvas = document.getElementById('c');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Mulberry32 seeded PRNG.
  let s = (SEED >>> 0) || 1;
  function rnd() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const hue0 = Math.floor(rnd() * 360);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function drawFrame(f) {
    const t = (f / FPS) * SPEED;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const cx = W / 2, cy = H / 2;
    const r = Math.min(W, H) * 0.3;
    for (let i = 0; i < 8; i++) {
      const a = t * 0.7 + (i / 8) * Math.PI * 2;
      const x = cx + Math.cos(a) * r * (0.5 + 0.5 * Math.sin(t * 0.3 + i));
      const y = cy + Math.sin(a * 1.3) * r * (0.5 + 0.5 * Math.cos(t * 0.2 + i));
      const hue = (hue0 + i * 30 + t * 10) % 360;
      ctx.fillStyle = `hsl(${hue}, 90%, 55%)`;
      ctx.beginPath();
      ctx.arc(x, y, Math.min(W, H) * 0.04, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  window.advanceFrame = function () {
    drawFrame(window.currentFrame);
    window.currentFrame++;
  };
  window.advanceFrames = function (n) {
    for (let i = 0; i < n; i++) window.advanceFrame();
  };

  // Paint a base frame and signal readiness.
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  window.READY = true;
})();
</script>
</body>
</html>
