name: Daily Screensaver

on:
  schedule:
    # 09:00 UTC every day. GitHub cron can be delayed under load; this is fine
    # for a daily upload. Adjust as you like (https://crontab.guru).
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Render duration in seconds (3600=1 hour; needs a VERIFIED channel, else YouTube rejects >15min uploads)'
        required: false
        default: '3600'
      dry_run:
        description: 'Render only, do not upload (true/false)'
        required: false
        default: 'false'
      seed:
        description: 'Override seed (blank = derive from date)'
        required: false
        default: ''

# Never run two daily renders at once.
concurrency:
  group: daily-screensaver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    # Stay well under the 6-hour hard limit on a free runner.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Optional: NASA API key for the "image of the day" palette (curated
          # engines get recoloured from that day's Astronomy Picture of the Day).
          # Blank falls back to DEMO_KEY. Set IMAGE_PALETTE=0 to disable entirely.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          IMAGE_PALETTE: ${{ vars.IMAGE_PALETTE }}
          # Default 3600s (1 hour). REQUIRES a verified YouTube channel —
          # unverified channels reject uploads >15 min ("Processing abandoned:
          # Video is too long"). Override via repo variable RENDER_DURATION
          # (e.g. set 840 for 14-min while the channel is still unverified).
          DURATION: ${{ github.event.inputs.duration || vars.RENDER_DURATION || '3600' }}
          SEED: ${{ github.event.inputs.seed || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node src/index.js

      # Keep the day's Gemini-generated engine (and the thumbnail) for Phase 3
      # prompt tuning. Runs on success and failure. continue-on-error is set
      # so a hit-storage-quota error here doesn't mark a successful upload run
      # as failed. Retention dropped to 7 days to stay under the private repo's
      # 500MB cap month over month.
      - name: Save generated engine + thumbnail
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ github.run_id }}
          path: |
            engines/auto/*.html
            engines/auto/*.raw.txt
            output/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload render artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: render-debug-${{ github.run_id }}
          path: |
            output/*.mp4
          if-no-files-found: ignore
          retention-days: 2
