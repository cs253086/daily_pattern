name: Daily Screensaver

on:
  schedule:
    # 09:00 UTC every day. GitHub cron can be delayed under load; this is fine
    # for a daily upload. Adjust as you like (https://crontab.guru).
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Render duration in seconds (3600=1 hour; needs a VERIFIED channel, else YouTube rejects >15min uploads)'
        required: false
        default: '3600'
      dry_run:
        description: 'Render only, do not upload (true/false)'
        required: false
        default: 'false'
      seed:
        description: 'Override seed (blank = derive from date)'
        required: false
        default: ''

# Never run two daily renders at once.
concurrency:
  group: daily-screensaver
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    # Stay well under the 6-hour hard limit on a free runner.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Optional: "image of the day" (src/imageSources.js) drives BOTH
          # Gemini's daily creative theme and curated-engine recolouring.
          # Rotates across four CC0/no-attribution-required sources so it's
          # not just space imagery -- NASA APOD (falls back to DEMO_KEY if
          # NASA_API_KEY is blank), Pixabay, The Met Open Access (keyless),
          # and Smithsonian Open Access. Each source is independently
          # optional and non-fatal: a missing key just means that source is
          # skipped on its turn in the rotation (the others still get used
          # on their own days). Set IMAGE_PALETTE=0 to disable the whole
          # feature.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          IMAGE_PALETTE: ${{ vars.IMAGE_PALETTE }}
          # Background music: a real license-free track fetched from
          # Freesound.org (src/stockMusic.js), restricted to CC0-licensed
          # results only (no attribution required). Requires a free API key
          # from https://freesound.org/apiv2/apply/ -- without it, music is
          # skipped and the video ships silent (non-fatal). ON by default
          # (user request, 2026-08-17; switched from procedurally-generated
          # to real fetched CC0 tracks, 2026-08-19). Set repo variable
          # MUSIC=0 to disable entirely if ever needed again.
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MUSIC: ${{ vars.MUSIC }}
          # Default 3600s (1 hour). REQUIRES a verified YouTube channel —
          # unverified channels reject uploads >15 min ("Processing abandoned:
          # Video is too long"). Override via repo variable RENDER_DURATION
          # (e.g. set 840 for 14-min while the channel is still unverified).
          DURATION: ${{ github.event.inputs.duration || vars.RENDER_DURATION || '3600' }}
          SEED: ${{ github.event.inputs.seed || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node src/index.js

      # curatedOr() (src/index.js) writes state/engine-rotation.json, and
      # dailyImage() (src/imageSources.js) writes
      # state/image-source-rotation.json, whenever each makes a pick, so
      # both the curated-engine pool and the daily image-source choice
      # (NASA APOD / Pixabay / Met / Smithsonian) round-robin (no repeats
      # until the whole pool has cycled) instead of relying on a date-hash
      # pick that can coincidentally repeat or cluster similar choices on
      # nearby dates. Gemini's theme itself no longer uses any separate
      # rotation state (2026-08-29): it's derived fresh each day from
      # whichever image the rotation above picked (imageThemeHint() in
      # src/generate.js), which is different content every day by
      # construction, so there's no list to persist a cursor into.
      # Separately, promoteToCuratedPool() (src/index.js) copies today's
      # approved Gemini engine into engines/manual/ so the curated pool
      # itself grows over time. `git add state/` (not individual filenames)
      # picks up all of these -- and any future state file under state/ --
      # automatically. Persist back to the repo so the next run sees them.
      # Runs even if the render/upload step failed, since the rotation
      # decisions and any promotion happen before render -- an unrelated
      # later failure (e.g. an upload error) doesn't reflect on an engine
      # that already passed the same quality gate used for today's actual
      # video. [skip ci] avoids re-triggering any push-based workflow.
      #
      # Skipped on dry_run (2026-08-28 fix): a manual dry_run=true dispatch
      # is explicitly a throwaway test, but curatedOr()'s round-robin cursor
      # (and now dailyImage()'s) is advanced as a side effect of just
      # CHOOSING an engine/image, regardless of dry_run -- so without this
      # guard, every test dispatch was silently consuming a real "don't
      # repeat until the bucket cycles" slot from production rotation state.
      # Confirmed happening for real: a dry_run test run committed
      # state/engine-rotation.json, moving the live 3D-bucket cursor to
      # solids3d, which then genuinely was that bucket's next real pick.
      # github.event.inputs is empty for schedule-triggered runs, so this
      # only ever skips manual dry_run dispatches, never the real daily
      # cron or a manual non-dry-run run.
      - name: Persist rotation state and promoted engines
        if: always() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain state/ engines/manual/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/ engines/manual/
            git commit -m "chore: update rotation state / promoted engines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No rotation state or promoted engine to commit."
          fi

      # Keep the day's Gemini-generated engine (and the thumbnail) for Phase 3
      # prompt tuning. Runs on success and failure. continue-on-error is set
      # so a hit-storage-quota error here doesn't mark a successful upload run
      # as failed. Retention dropped to 7 days to stay under the private repo's
      # 500MB cap month over month.
      - name: Save generated engine + thumbnail
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ github.run_id }}
          path: |
            engines/auto/*.html
            engines/auto/*.raw.txt
            output/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload render artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: render-debug-${{ github.run_id }}
          path: |
            output/*.mp4
          if-no-files-found: ignore
          retention-days: 2
