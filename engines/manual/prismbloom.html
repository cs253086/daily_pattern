<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prism Bloom — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated dense engine: many glowing, nested polygons packed across the
// whole frame in three depth layers. Each layer counter-rotates and breathes
// on its own rate, so the glow is always moving across the composition.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. The canvas clears to opaque black every
// frame, so nothing accumulates across frames.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const hueBase = rand(0, 360);
  const HUE_STEPS = [0, 40, 95, 150, 200, 250, 290, 320];

  // Three depth layers: near (large, bright, fast), mid, far (small, dim, slow).
  const LAYERS = [
    { scale: 1.00, cells: 7, alpha: 1.00, rate: 0.30, sway: 0.010 },
    { scale: 0.70, cells: 11, alpha: 0.75, rate: 0.22, sway: 0.016 },
    { scale: 0.46, cells: 17, alpha: 0.55, rate: 0.16, sway: 0.022 },
  ];

  const layers = LAYERS.map((L, li) => {
    const cols = Math.max(3, Math.round(L.cells * DENSITY * (W / H) ** 0.5));
    const rows = Math.max(2, Math.round(cols * H / W));
    const cw = W / cols, ch = H / rows;
    const items = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const jx = rand(-0.18, 0.18) * cw, jy = rand(-0.18, 0.18) * ch;
        items.push({
          x: (c + 0.5) * cw + jx,
          y: (r + 0.5) * ch + jy,
          R: Math.min(cw, ch) * rand(0.42, 0.62) * L.scale,
          sides: 3 + Math.floor(rng() * 6),
          rot0: rand(0, Math.PI * 2),
          rate: sgn() * rand(0.25, 0.7),
          pulseRate: sgn() * rand(0.5, 1.2),
          pulsePhase: rand(0, Math.PI * 2),
          hue: (hueBase + HUE_STEPS[Math.floor(rng() * HUE_STEPS.length)] + rand(-15, 15) + 360) % 360,
          width: rand(1.2, 2.4) * L.scale + 0.6,
          inner: rand(0.45, 0.6),
        });
      }
    }
    return { cfg: L, items, cx: W / 2, cy: H / 2, dir: li % 2 === 0 ? 1 : -1, phase: rand(0, Math.PI * 2) };
  });

  window.currentFrame = 0;
  window.TOTAL_FRAMES = Math.round(DURATION * FPS);

  function polygon(x, y, R, sides, rot, scale) {
    ctx.beginPath();
    for (let k = 0; k <= sides; k++) {
      const a = rot + (k / sides) * Math.PI * 2;
      const px = x + Math.cos(a) * R * scale;
      const py = y + Math.sin(a) * R * scale;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function strokeGlow(x, y, R, sides, rot, scale, hue, width, alpha) {
    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.10 * alpha})`;
    ctx.lineWidth = width * 6;
    polygon(x, y, R, sides, rot, scale);
    ctx.strokeStyle = `hsla(${hue}, 100%, 66%, ${0.32 * alpha})`;
    ctx.lineWidth = width * 2.4;
    polygon(x, y, R, sides, rot, scale);
    ctx.strokeStyle = `hsla(${hue}, 100%, 82%, ${0.95 * alpha})`;
    ctx.lineWidth = width;
    polygon(x, y, R, sides, rot, scale);
  }

  function renderFrame() {
    const t = window.currentFrame / FPS * SPEED;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const layer of layers) {
      const L = layer.cfg;
      const ox = Math.sin(2 * Math.PI * (layer.phase + 0.03 * t)) * W * L.sway;
      const oy = Math.cos(2 * Math.PI * (layer.phase + 0.02 * t)) * H * L.sway;
      for (const it of layer.items) {
        const x = it.x + ox, y = it.y + oy;
        const rot = it.rot0 + layer.dir * it.rate * t * L.rate * 4;
        const pulse = 1 + 0.16 * Math.sin(2 * Math.PI * it.pulseRate * 0.1 * t + it.pulsePhase);
        strokeGlow(x, y, it.R * pulse, it.sides, rot, 1, it.hue, it.width, L.alpha);
        strokeGlow(x, y, it.R * pulse, it.sides, -rot * 1.5, it.inner, (it.hue + 40) % 360, it.width * 0.7, L.alpha * 0.8);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
