<!DOCTYPE html>
<html>
<head>
    <meta name="pattern-name" content="Orbital Stream Swirl">
    <title>Orbital Stream Swirl</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- Setup ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const urlParams = new URLSearchParams(window.location.search);

        const getParam = (name, defaultValue, type = 'float') => {
            const value = urlParams.get(name);
            if (value === null) return defaultValue;
            return type === 'int' ? parseInt(value) : parseFloat(value);
        };

        const seed = getParam('seed', 20261115, 'int');
        const width = getParam('width', 1920, 'int');
        const height = getParam('height', 1080, 'int');
        const fps = getParam('fps', 24, 'int');
        const duration = getParam('duration', 3600, 'int');
        const speed = getParam('speed', 1.0);
        const density = getParam('density', 1.0);
        const cycleSec = getParam('cycleSec', 90.0); // Mandatory hard reset timer

        canvas.width = width;
        canvas.height = height;

        window.TOTAL_FRAMES = Math.round(duration * fps);
        window.currentFrame = 0;

        const dt = 1 / fps;

        // --- PRNG (Mulberry32) ---
        let prng_state = seed;
        function mulberry32() {
            prng_state |= 0;
            prng_state = prng_state + 0x6D2B79F5 | 0;
            let t = Math.imul(prng_state ^ prng_state >>> 15, 1 | prng_state);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) | 0;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        function rand(min, max) {
            return min + (max - min) * mulberry32();
        }

        function randInt(min, max) {
            return Math.floor(rand(min, max + 1));
        }

        function randSign() {
            return mulberry32() > 0.5 ? 1 : -1;
        }

        // --- Color Palette ---
        let paletteHues;
        let paletteBaseLightness = 50; // HSL lightness between 35% and 70%
        let paletteSaturation = 90;   // HSL saturation between 75% and 100%

        function generatePalette() {
            paletteHues = [];
            let startHue = rand(0, 360);
            let numHues = randInt(3, 5); // 3-5 distinct hues

            // Inspired by NASA photo: blue with hints of red tones
            // Aim for blues, purples, and some reds/pinks
            const baseHue = rand(200, 260); // Base blue-purple hue
            paletteHues.push(baseHue);

            // Add complementary or analogous hues
            for (let i = 1; i < numHues; i++) {
                let offset = randSign() * rand(40, 90); // Spread at least 40-60 degrees apart
                paletteHues.push((baseHue + offset + 360) % 360);
            }

            // Ensure one hue is potentially reddish (e.g., 330-30 range)
            if (mulberry32() < 0.7) { // High chance for a reddish accent
                let redHue = rand(330, 30); // Wrapped around for red
                if (redHue < 0) redHue += 360;
                paletteHues.push(redHue);
                numHues++;
            }
        }

        function getHSLColor(hue, saturation, lightness, alpha) {
            return `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
        }

        // --- Core Structures ---
        const centerX = width / 2;
        const centerY = height / 2;
        const maxRadius = Math.min(width, height) / 2 * 0.9;

        const NUM_LAYERS = randInt(3, 5);
        const RINGS_PER_LAYER = randInt(2, 4);
        const ORBITERS_PER_RING = randInt(5, 10);

        let layers = [];

        function initLayers() {
            layers = [];
            for (let i = 0; i < NUM_LAYERS; i++) {
                let layer = {
                    baseRadius: maxRadius * (i + 1) / (NUM_LAYERS + 1),
                    rotationRate: randSign() * rand(0.3, 0.8) * speed, // radians per second
                    rings: []
                };

                for (let j = 0; j < RINGS_PER_LAYER; j++) {
                    let ring = {
                        relativeRadius: rand(0.1, 0.3), // Relative to layer.baseRadius
                        orbitSpeed: randSign() * rand(0.5, 1.2) * speed, // radians per second
                        orbiters: []
                    };

                    for (let k = 0; k < ORBITERS_PER_RING; k++) {
                        let orbiter = {
                            angleOffset: rand(0, Math.PI * 2),
                            size: rand(5, 15) * density,
                            pulseRate: rand(0.5, 1.5) * speed, // cycles per second
                            pulseMagnitude: rand(0.3, 0.7),
                            hueIndex: randInt(0, paletteHues.length - 1),
                            swirlOffsetAngle: rand(0, Math.PI * 2),
                            swirlSpeed: randSign() * rand(0.8, 1.8) * speed
                        };
                        ring.orbiters.push(orbiter);
                    }
                    layer.rings.push(ring);
                }
                layers.push(layer);
            }
        }

        // --- Evolution ---
        let morphStartTime = 0;
        let morphDuration = cycleSec / 2; // Morph over half the cycle
        let targetLayers = [];

        function createTargetLayers() {
            targetLayers = [];
            for (let i = 0; i < NUM_LAYERS; i++) {
                let targetLayer = {
                    baseRadius: maxRadius * (i + 1) / (NUM_LAYERS + 1), // Keep general structure
                    rotationRate: randSign() * rand(0.3, 0.8) * speed,
                    rings: []
                };
                for (let j = 0; j < RINGS_PER_LAYER; j++) {
                    let targetRing = {
                        relativeRadius: rand(0.1, 0.3),
                        orbitSpeed: randSign() * rand(0.5, 1.2) * speed,
                        orbiters: []
                    };
                    for (let k = 0; k < ORBITERS_PER_RING; k++) {
                        let targetOrbiter = {
                            angleOffset: rand(0, Math.PI * 2),
                            size: rand(5, 15) * density,
                            pulseRate: rand(0.5, 1.5) * speed,
                            pulseMagnitude: rand(0.3, 0.7),
                            hueIndex: randInt(0, paletteHues.length - 1),
                            swirlOffsetAngle: rand(0, Math.PI * 2),
                            swirlSpeed: randSign() * rand(0.8, 1.8) * speed
                        };
                        targetRing.orbiters.push(targetOrbiter);
                    }
                    targetLayer.rings.push(targetRing);
                }
                targetLayers.push(targetLayer);
            }
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function updateLayersMorph(t) {
            // t is morph progress (0 to 1)
            // Interpolate each property
            for (let i = 0; i < NUM_LAYERS; i++) {
                let layer = layers[i];
                let targetLayer = targetLayers[i];

                layer.baseRadius = lerp(layer.baseRadius, targetLayer.baseRadius, t);
                layer.rotationRate = lerp(layer.rotationRate, targetLayer.rotationRate, t);

                for (let j = 0; j < RINGS_PER_LAYER; j++) {
                    let ring = layer.rings[j];
                    let targetRing = targetLayer.rings[j];

                    ring.relativeRadius = lerp(ring.relativeRadius, targetRing.relativeRadius, t);
                    ring.orbitSpeed = lerp(ring.orbitSpeed, targetRing.orbitSpeed, t);

                    for (let k = 0; k < ORBITERS_PER_RING; k++) {
                        let orbiter = ring.orbiters[k];
                        let targetOrbiter = targetRing.orbiters[k];

                        orbiter.angleOffset = lerp(orbiter.angleOffset, targetOrbiter.angleOffset, t);
                        orbiter.size = lerp(orbiter.size, targetOrbiter.size, t);
                        orbiter.pulseRate = lerp(orbiter.pulseRate, targetOrbiter.pulseRate, t);
                        orbiter.pulseMagnitude = lerp(orbiter.pulseMagnitude, targetOrbiter.pulseMagnitude, t);
                        // orbiter.hueIndex is discrete, so update it only when t is near 1
                        if (t > 0.95) orbiter.hueIndex = targetOrbiter.hueIndex;
                        orbiter.swirlOffsetAngle = lerp(orbiter.swirlOffsetAngle, targetOrbiter.swirlOffsetAngle, t);
                        orbiter.swirlSpeed = lerp(orbiter.swirlSpeed, targetOrbiter.swirlSpeed, t);
                    }
                }
            }
        }


        // --- Drawing ---
        function drawOrbiter(orbiter, x, y, currentTime) {
            const hue = paletteHues[orbiter.hueIndex];
            const pulseScale = 1 + Math.sin(currentTime * orbiter.pulseRate * Math.PI * 2) * orbiter.pulseMagnitude;
            const currentSize = orbiter.size * pulseScale;

            // Glow stroke (wide, low alpha)
            ctx.beginPath();
            ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
            ctx.strokeStyle = getHSLColor(hue, paletteSaturation, paletteBaseLightness, 0.20); // Alpha up to 0.35
            ctx.lineWidth = currentSize * 0.7; // 4-6 times core width
            ctx.shadowColor = getHSLColor(hue, paletteSaturation, paletteBaseLightness, 0.6);
            ctx.shadowBlur = currentSize * 2;
            ctx.stroke();

            // Core stroke (thin, higher alpha)
            ctx.beginPath();
            ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
            ctx.strokeStyle = getHSLColor(hue, paletteSaturation, 70, 0.9); // Lighter for core
            ctx.lineWidth = currentSize * 0.1;
            ctx.shadowBlur = 0; // Reset shadow for core
            ctx.stroke();

            // Tiny bright fill for center highlight
            ctx.beginPath();
            ctx.arc(x, y, currentSize * 0.05, 0, Math.PI * 2); // Tiny spot
            ctx.fillStyle = getHSLColor(hue, paletteSaturation, 95, 1.0); // Near white
            ctx.fill();
        }

        function drawFrame(currentTime) {
            ctx.clearRect(0, 0, width, height); // Clear every frame
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(centerX, centerY);

            for (let i = 0; i < NUM_LAYERS; i++) {
                let layer = layers[i];
                let layerRotation = currentTime * layer.rotationRate;

                for (let j = 0; j < RINGS_PER_LAYER; j++) {
                    let ring = layer.rings[j];
                    let ringRadius = layer.baseRadius + ring.relativeRadius * (maxRadius * 0.1); // Add a small relative radius variation

                    for (let k = 0; k < ORBITERS_PER_RING; k++) {
                        let orbiter = ring.orbiters[k];
                        let orbiterAngle = layerRotation + ring.orbitSpeed * currentTime + orbiter.angleOffset;

                        // Swirl effect: offset position based on time and a swirl parameter
                        let swirlOffsetMagnitude = Math.sin(currentTime * orbiter.swirlSpeed + orbiter.swirlOffsetAngle) * orbiter.size * 0.5;
                        let swirlOffsetX = Math.cos(orbiterAngle) * swirlOffsetMagnitude;
                        let swirlOffsetY = Math.sin(orbiterAngle) * swirlOffsetMagnitude;

                        let x = Math.cos(orbiterAngle) * ringRadius + swirlOffsetX;
                        let y = Math.sin(orbiterAngle) * ringRadius + swirlOffsetY;

                        drawOrbiter(orbiter, x, y, currentTime);
                    }
                }
            }

            ctx.restore();
        }

        // --- Animation Loop ---
        let totalElapsedTime = 0;
        let lastResetTime = 0;

        function advanceFrame() {
            if (totalElapsedTime - lastResetTime >= cycleSec) {
                // Hard reset
                lastResetTime = totalElapsedTime;
                // Generate new targets for morphing
                createTargetLayers();
                morphStartTime = totalElapsedTime;
            }

            // Morph between current and target state
            let morphProgress = (totalElapsedTime - morphStartTime) / morphDuration;
            if (morphProgress < 1) {
                updateLayersMorph(morphProgress);
            } else {
                // If morph is complete, make current the target to avoid drift
                layers = JSON.parse(JSON.stringify(targetLayers)); // Deep copy
            }

            drawFrame(totalElapsedTime);
            totalElapsedTime += dt;
            window.currentFrame++;
        }

        function advanceFrames(n) {
            for (let i = 0; i < n; i++) {
                advanceFrame();
            }
        }

        // --- Initialization ---
        function init() {
            generatePalette();
            // Initial setup for layers
            initLayers();
            // Create the first set of target layers to start morphing towards
            createTargetLayers();
            morphStartTime = totalElapsedTime; // Start morphing immediately
            
            window.advanceFrame = advanceFrame;
            window.advanceFrames = advanceFrames;
            window.READY = true;
        }

        init();
    </script>
</body>
</html>
