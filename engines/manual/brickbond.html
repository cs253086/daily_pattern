<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Bond Wall — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a random web find (today's
// creative-research routine, category "random architectural or typographic
// movement", least recently used): MASONRY BOND. A brick wall is a set of
// courses; each course is a periodic run of bricks whose joints (cut
// positions) set the bond (stretcher, header, Flemish-style mixes). Real bond
// patterns are defined by where the joints fall from course to course, not by
// a drawn motif. Sources (search snippets): https://en.wikipedia.org/wiki/Bond_(masonry)
// (blocked here, snippet only), https://www.brickbondpatterns.com (bond
// glossary: stretcher, header and running bond), Flemish bond
// description in standard masonry references.
//
// A genuinely different construction PRINCIPLE from the rest of the pool: the
// generative object is a set of JOINT POSITIONS on each course, each joint
// moving on its own travelling wave. Substitution tilings, cell automata,
// grids, herringbone (a binary over/under state) and tartan (a sett) all
// differ; no existing engine has per-joint motion inside periodic rows.
//
// BRIGHTNESS / COVERAGE: each course is a periodic partition of a fixed period
// (one wall width). Joints move but the period never changes, so every course
// is fully covered at every instant and the total brick area is constant.
// Brick colours are luma-equal (lightness bisected per hue), so moving area
// between colours does not trend mean brightness. Mortar is a fixed-width
// black gap, so it is also constant.
//
// MOTION (unit-level): every joint of a course is offset by an integer-wave
// term over the joint index (the same zero-sum-period construction as the rest
// of the pool), with a per-course rate that has guaranteed minimum magnitude
// and random sign. Courses move relative to one another, so no single rigid
// transform explains the frame. Rates are reassigned, never reset, at each
// cycleSec boundary; joint order is preserved because the offset amplitude is
// well below the minimum brick width.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);
  const dt = 1 / FPS;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Burn 4 draws first: Mulberry32's first outputs for small consecutive seeds
  // are correlated (pendulumwave.html / spinbounce.html fix).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);
  const randInt = (a, b) => a + Math.floor(rng() * (b - a + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  // Hue sets per palette, chosen so vivid colours share a similar natural luma.
  const palettes = {
    aurora: [[140, 90], [190, 88], [230, 82], [280, 78], [320, 70]],
    ember:  [[10, 95], [345, 90], [320, 82], [355, 95], [300, 80]],
    ocean:  [[185, 92], [205, 90], [225, 85], [250, 75], [270, 68]],
    neon:   [[0, 95], [165, 88], [144, 88], [216, 92], [288, 94]],
    sunset: [[10, 95], [330, 88], [280, 75], [355, 90], [190, 70]],
    ice:    [[185, 88], [205, 84], [225, 80], [250, 76], [270, 72]],
    gold:   [[20, 92], [350, 85], [300, 80], [160, 85], [240, 85]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out.map((c) => [c[0], c[1]]) : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const HUES = parseColors() || palettes[resolvePalette()];

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }
  function lumaOf(h, s, l) {
    const [r, g, b] = hslToRgb(h, s, l);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function lightnessForLuma(h, s, target) {
    let lo = 10, hi = 95;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2;
      if (lumaOf(h, s, mid) < target) lo = mid; else hi = mid;
    }
    return Math.max(15, Math.min(90, (lo + hi) / 2));
  }

  // ---- Geometry, built once per video ----
  const COURSES = 9;                        // brick courses down the wall
  const PERIOD = 12;                        // one wall width in brick units
  const U = W / PERIOD;                     // brick unit width (px)
  const COURSE_H = H / COURSES;
  const GAP = Math.max(4, COURSE_H * 0.09); // fixed mortar joint (px)

  // Equal-luma brick colours, one per hue slot.
  const BRICK_LUMA = 140;
  const brickCol = HUES.map(([h, s]) => {
    const sat = Math.max(82, Math.min(96, s));
    const light = lightnessForLuma(h, sat, BRICK_LUMA);
    return `hsl(${h}, ${sat}%, ${light.toFixed(2)}%)`;
  });

  // Each course: a periodic partition of PERIOD units into bricks of width 1
  // (header) or 2 (stretcher), summing exactly to PERIOD. Joints are stored as
  // base positions; the per-course offset then moves each joint.
  const courses = [];
  for (let r = 0; r < COURSES; r++) {
    const widths = [];
    let sum = 0;
    while (sum < PERIOD) {
      const room = PERIOD - sum;
      let w = rng() < 0.55 ? 2 : (rng() < 0.5 ? 1 : 3);
      if (w > room) w = room;
      widths.push(w);
      sum += w;
    }
    // Running-bond offset: shift every other course by one unit.
    const shift = (r % 2) ? 1 : 0;
    const joints = [];
    let acc = shift;
    for (const w of widths) { joints.push(acc); acc += w; }
    const m = joints.length;
    const K = randInt(1, 2);                       // whole waves across the course
    const phase = rng() * 2 * Math.PI;
    const rate = sgn() * rand(0.9, 1.4) * SPEED;
    // Adjacent bricks always take different hue slots (a neighbour step of 1-3).
    const colOff = [randInt(0, HUES.length - 1)];
    for (let j = 1; j < m; j++) colOff.push((colOff[j - 1] + randInt(1, HUES.length - 1)) % HUES.length);
    if (colOff[m - 1] === colOff[0]) colOff[m - 1] = (colOff[0] + 1) % HUES.length;
    courses.push({ joints, m, K, phase, rate, wt: 0, rateNow: rate, colOff, y: r * COURSE_H });
  }

  const AMP = 0.28;       // joint excursion in brick units (min brick width 1, so never crosses)
  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;

  function reconfigure() {
    for (const c of courses) {
      // Rates only: changing the wave count would pop every joint at once.
      c.rateNow = sgn() * rand(0.9, 1.4) * SPEED;
    }
  }

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function drawCourse(c) {
    const { joints, m, K, phase, colOff } = c;
    const cur = [];
    for (let j = 0; j < m; j++) {
      // Integer-wave joint offset: periodic in j, so the course stays closed.
      cur.push(joints[j] + AMP * Math.sin(2 * Math.PI * K * j / m + phase - c.wt));
    }
    // Draw three periodic copies so the wrap-around at the frame edge is covered.
    for (let copy = -1; copy <= 1; copy++) {
      for (let j = 0; j < m; j++) {
        const a = (cur[j] + copy * PERIOD) * U;
        const b = ((j + 1 < m ? cur[j + 1] : cur[0] + PERIOD) + copy * PERIOD) * U;
        const bx = b - a;
        if (b < 0 || a > W) continue;
        ctx.fillStyle = brickCol[colOff[j]];
        ctx.fillRect(a + GAP / 2, c.y + GAP / 2, bx - GAP, COURSE_H - GAP);
      }
    }
  }

  function renderFrame() {
    cycleFrame++;
    for (const c of courses) c.wt += c.rateNow * dt;
    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigure(); }
    // Mortar: black background between bricks (fixed-width joints).
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (const c of courses) drawCourse(c);
    window.currentFrame++;
  }

  window.advanceFrame = function () { renderFrame(); };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) renderFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
