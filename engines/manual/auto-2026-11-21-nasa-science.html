<!DOCTYPE html>
<html>
<head>
    <meta name="pattern-name" content="Neptunian Ribbons">
    <title>Neptunian Ribbons</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- PRNG (Mulberry32) ---
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // --- URL Parameters and Initialization ---
        const urlParams = new URLSearchParams(window.location.search);
        const seed = parseInt(urlParams.get('seed') || '12345');
        const width = parseInt(urlParams.get('width') || '1920');
        const height = parseInt(urlParams.get('height') || '1080');
        const fps = parseInt(urlParams.get('fps') || '24');
        const duration = parseFloat(urlParams.get('duration') || '3600');
        const speed = parseFloat(urlParams.get('speed') || '1');
        const density = parseFloat(urlParams.get('density') || '1');
        const cycleSec = parseFloat(urlParams.get('cycleSec') || '90');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, width, height);

        let random = mulberry32(seed);

        window.TOTAL_FRAMES = Math.round(duration * fps);
        window.currentFrame = 0;

        const dt = 1 / fps;
        const TWO_PI = Math.PI * 2;

        // --- Utility Functions ---
        function rnd(min, max) { return min + (max - min) * random(); }
        function choose(arr) { return arr[Math.floor(random() * arr.length)]; }
        function sign() { return random() < 0.5 ? -1 : 1; }

        // HSL to CSS color string
        function hsl(h, s, l, a = 1) {
            h = h % 360;
            if (h < 0) h += 360;
            return `hsla(${h}, ${s * 100}%, ${l * 100}%, ${a})`;
        }

        // --- Palette Generation ---
        let baseHue = rnd(180, 240); // Blue-purple range
        const numHues = Math.floor(rnd(3, 5.99));
        let palette = [];
        for (let i = 0; i < numHues; i++) {
            let hue = (baseHue + i * rnd(40, 60)) % 360;
            // Ensure saturation and lightness constraints
            palette.push({ h: hue, s: rnd(0.75, 1.0), l: rnd(0.35, 0.7) });
        }

        // --- Scene Parameters ---
        const numRibbons = Math.floor(rnd(4, 8) * density);
        const ribbonLength = rnd(0.7, 1.2); // Relative to min(width, height)
        const ribbonWidth = rnd(0.015, 0.035); // Relative to min(width, height)
        const numSegments = Math.floor(rnd(15, 30));

        let ribbons = [];

        function initScene() {
            ribbons = [];
            for (let i = 0; i < numRibbons; i++) {
                let p = choose(palette);
                ribbons.push({
                    hue: p.h,
                    saturation: p.s,
                    lightness: p.l,
                    offsetX: rnd(-width * 0.2, width * 0.2),
                    offsetY: rnd(-height * 0.2, height * 0.2),
                    baseRotationSpeed: sign() * rnd(0.08, 0.15) * speed, // radians per second
                    waveAmplitude: rnd(0.05, 0.1) * Math.min(width, height),
                    waveFrequency: rnd(0.5, 1.5), // cycles per length
                    waveSpeed: sign() * rnd(0.8, 1.2) * speed, // cycles per second
                    morphSpeed: rnd(0.05, 0.1) * speed, // for color morphing
                    targetHue: (p.h + sign() * rnd(30, 60)) % 360,
                    targetSaturation: rnd(0.75, 1.0),
                    targetLightness: rnd(0.35, 0.7),
                    segmentScaleOscillation: rnd(0.05, 0.15), // relative scale
                    segmentScaleSpeed: sign() * rnd(0.8, 1.5) * speed, // cycles per second
                    segmentOffsetOscillation: rnd(0.02, 0.05) * Math.min(width, height),
                    segmentOffsetSpeed: sign() * rnd(0.7, 1.3) * speed, // cycles per second
                });
            }
        }

        initScene(); // Initial setup

        let lastResetFrame = 0;

        function advanceFrame() {
            // Mandated hard reset every cycleSec seconds
            if (window.currentFrame === 0 || (window.currentFrame - lastResetFrame) >= Math.round(cycleSec * fps)) {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, width, height);
                lastResetFrame = window.currentFrame;
                // Evolve composition: re-initialize some parameters
                // For this pattern, continuous morphing is preferred over full re-randomization
                // But we'll "reset" the morph targets to create new evolution
                for (let i = 0; i < numRibbons; i++) {
                    let ribbon = ribbons[i];
                    ribbon.targetHue = (ribbon.hue + sign() * rnd(30, 60)) % 360;
                    ribbon.targetSaturation = rnd(0.75, 1.0);
                    ribbon.targetLightness = rnd(0.35, 0.7);
                    // Also subtly shift the ribbon's base position or wave properties
                    ribbon.offsetX += rnd(-width * 0.05, width * 0.05);
                    ribbon.offsetY += rnd(-height * 0.05, height * 0.05);
                    ribbon.waveAmplitude = rnd(0.05, 0.1) * Math.min(width, height);
                    ribbon.waveFrequency = rnd(0.5, 1.5);
                }
            } else {
                // Clear with slight transparency for trails
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.fillRect(0, 0, width, height);
            }

            const currentTime = window.currentFrame * dt;

            ctx.save();
            ctx.translate(width / 2, height / 2);

            ribbons.forEach((ribbon, rIdx) => {
                // Morphing colors
                ribbon.hue += (ribbon.targetHue - ribbon.hue) * ribbon.morphSpeed * dt;
                ribbon.saturation += (ribbon.targetSaturation - ribbon.saturation) * ribbon.morphSpeed * dt;
                ribbon.lightness += (ribbon.targetLightness - ribbon.lightness) * ribbon.morphSpeed * dt;

                let currentRibbonHue = ribbon.hue;
                let currentRibbonSaturation = Math.max(0.75, Math.min(1.0, ribbon.saturation));
                let currentRibbonLightness = Math.max(0.35, Math.min(0.7, ribbon.lightness));

                let totalRotation = currentTime * ribbon.baseRotationSpeed;

                ctx.save();
                ctx.translate(ribbon.offsetX, ribbon.offsetY);
                ctx.rotate(totalRotation);

                let points = [];
                for (let i = 0; i <= numSegments; i++) {
                    let segmentProgress = i / numSegments; // 0 to 1
                    let localX = segmentProgress * ribbonLength * Math.min(width, height);
                    let wavePhase = (localX * ribbon.waveFrequency / (ribbonLength * Math.min(width, height)) + currentTime * ribbon.waveSpeed);
                    let waveY = Math.sin(wavePhase * TWO_PI) * ribbon.waveAmplitude;

                    let segmentScalePhase = currentTime * ribbon.segmentScaleSpeed * TWO_PI;
                    let segmentScale = 1 + Math.sin(segmentScalePhase + i * Math.PI) * ribbon.segmentScaleOscillation;

                    let segmentOffsetPhase = currentTime * ribbon.segmentOffsetSpeed * TWO_PI;
                    let segmentOffset = Math.sin(segmentOffsetPhase + i * Math.PI) * ribbon.segmentOffsetOscillation;

                    points.push({
                        x: localX * segmentScale,
                        y: waveY + segmentOffset
                    });
                }

                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }

                // Glow stroke (wide, low alpha)
                let glowWidth = ribbonWidth * Math.min(width, height) * 4;
                ctx.lineWidth = glowWidth;
                ctx.strokeStyle = hsl(currentRibbonHue, currentRibbonSaturation, currentRibbonLightness, 0.25);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Core stroke (thin, high alpha)
                let coreWidth = ribbonWidth * Math.min(width, height);
                ctx.lineWidth = coreWidth;
                ctx.strokeStyle = hsl(currentRibbonHue, currentRibbonSaturation, currentRibbonLightness, 0.9);
                ctx.stroke();

                ctx.restore();
            });

            ctx.restore();

            window.currentFrame++;
        }

        function advanceFrames(n) {
            for (let i = 0; i < n; i++) {
                advanceFrame();
            }
        }

        window.advanceFrame = advanceFrame;
        window.advanceFrames = advanceFrames;
        window.READY = true;
    </script>
</body>
</html>
