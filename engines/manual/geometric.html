<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometric — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine with a GEOMETRIC aesthetic: concentric regular polygons and a
// radial lattice rotate at different rates, drawn as crisp glowing edges (thin
// additive strokes on black) — sacred-geometry / op-art feel rather than soft
// organic bloom. Clean straight lines and defined shapes, still luminous.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, canvas sized to width/height, per-second
// rotation rates, cheap vector strokes. Redraws each frame (no accumulation):
// the "glow" is from additive overlap of the layered edges + a light bloom pass.
//
// UNIT CHOREOGRAPHY (2026-09-10 wave 2, user definition of "dynamic": the
// basic units must visibly move RELATIVE TO EACH OTHER every second, not
// just the whole pattern spinning). The unit-motion audit
// (scripts/audit-unit-motion.js) scored the old version at residual 7.9 /
// 83% non-rigid: rigid polygons on a shared global spin with a 4% pulse.
// Now, all coverage-neutral by construction:
//   * COUNTER-ROTATION: adjacent rings alternate sign (inner faster), and
//     the global spin is gone -- every ring slides against its neighbours.
//   * VERTEX BREATHING: each ring's vertex radius carries a travelling wave
//     around the shape (+-12% of its radius, 1 or 2 wavelengths per ring,
//     period 3-6s), so polygons wobble/squash and their corners bulge in
//     turn; the wave spans whole cycles around the ring, so the perimeter
//     stays flat.
//   * RADIAL SLIDE: rings breathe in and out (+-28% of the ring spacing)
//     with phases spread i*2pi/n across the n rings, so the sum of the
//     radii -- and the total stroke length -- is constant at every instant.
//   * SPOKE SWEEP: the spokes are brighter and each swings +-32% of its
//     slot in a travelling wave around the lattice, and its length pulses
//     (+-14%) on the same wave, so the lattice ripples instead of spinning
//     as one block.
//   * Ring count is fixed once per video (initRings); config() re-rolls
//     sides, rates and phases per cycle. Hue is spatial (per ring / per
//     spoke) with a small bounded wobble instead of a steady drift (hue
//     swings luma -- see CLAUDE.md). Thicker strokes (house style).
//   * cycleSec 45 -> 43.5: at 45 one of validate.js's fixed sample times
//     (270s) sat exactly on a reconfigure boundary (the automaton.html /
//     wave-1 lesson); 43.5 keeps every sample clear of one.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  // Wide hue spread per palette (~50-90deg apart) so shapes visibly differ in
  // colour at any instant, not just shades of one hue.
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // A "ring" is a regular polygon at some radius, rotating at its own rate.
  // Ring count is fixed once per video; everything else re-rolls per cycle.
  let rings, sides, hue0, nRings, spokeSweepRate, spokeSweepPhase, spokeSpin, slideRate, slidePhase;
  function initRings() {
    nRings = randInt(4, 6);
  }
  function config() {
    sides = randInt(3, 8);                 // shared polygon order (triangle..octagon)
    hue0 = rng() * 360;
    const sign0 = rng() < 0.5 ? -1 : 1;
    // Spokes: their own slow spin plus a travelling sweep wave.
    spokeSpin = -sign0 * rand(0.25, 0.45);
    spokeSweepRate = (rng() < 0.5 ? -1 : 1) * rand(1.0, 1.7);   // ~3.7-6.3s
    spokeSweepPhase = rng() * Math.PI * 2;
    slideRate = rand(0.8, 1.4);                                   // ~4.5-8s
    slidePhase = rng() * Math.PI * 2;
    const n = nRings;
    rings = [];
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      rings.push({
        r: t * minDim * 0.46,
        rot: rng() * Math.PI * 2,
        // Guaranteed minimum magnitude; adjacent rings COUNTER-rotate
        // (alternating sign) and inner rings spin faster.
        rotRate: sign0 * (i % 2 === 0 ? 1 : -1) * rand(0.55, 1.1) * (1 - t * 0.4),
        sides: (rng() < 0.7) ? sides : randInt(3, 8),
        colorIdx: i % PAL.length,
        // Vertex wave: wavelengths around the ring (integer so the wave is
        // continuous around the shape), rate with random sign, phase.
        waveK: rng() < 0.6 ? 1 : 2,
        waveRate: (rng() < 0.5 ? -1 : 1) * rand(1.1, 2.0),   // ~3-6s
        wavePhase: rng() * Math.PI * 2,
        waveAmp: rand(0.09, 0.14),
      });
    }
  }

  // Polygon whose vertex radius carries a travelling wave around the shape.
  function poly(r, n, rot, style, lw, wAmp, wK, wPh) {
    ctx.strokeStyle = style; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const idx = i % n;
      const a = rot + (idx / n) * Math.PI * 2;
      const rr = r * (1 + wAmp * Math.sin(wPh + (idx / n) * Math.PI * 2 * wK));
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initRings();
  config();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    // Crisp geometry: clear each frame (no smear), redraw the whole figure.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // Radial lattice: crisp spokes from centre, each sweeping inside its
    // slot and pulsing in length on a travelling wave (phase spans exactly
    // two cycles around the lattice, so total spoke length stays flat).
    const spokes = sides * 2;
    const lwThin = Math.max(1, minDim / 1080);
    const slot = Math.PI * 2 / spokes;
    const sweepPh = clk * spokeSweepRate + spokeSweepPhase;
    const spokeBase = clk * spokeSpin;
    for (let k = 0; k < spokes; k++) {
      const wph = sweepPh + (k / spokes) * Math.PI * 2 * 2;
      const a = spokeBase + (k / spokes) * Math.PI * 2 + 0.32 * slot * Math.sin(wph);
      const len = minDim * 0.5 * (1 + 0.14 * Math.cos(wph));
      const base = PAL[k % PAL.length];
      const spokeHue = ((base[0] + hue0 * 0.05 + k * 9 + Math.sin(clk * 0.3) * 6) % 360 + 360) % 360;
      ctx.strokeStyle = `hsla(${spokeHue}, ${base[1]}%, ${base[2]}%, 0.30)`;
      ctx.lineWidth = lwThin * 1.6;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      ctx.stroke();
    }

    // Concentric counter-rotating polygons -- the crisp geometric core. Draw
    // each twice (bright thin + soft wider) so edges read luminous without
    // going blobby. Radii slide with phases spread across the rings.
    const spacing = minDim * 0.46 / rings.length;
    for (let i = 0; i < rings.length; i++) {
      const rg = rings[i];
      const r = rg.r + 0.28 * spacing * Math.sin(clk * slideRate + slidePhase + (i / rings.length) * Math.PI * 2);
      const rot = rg.rot + clk * rg.rotRate;
      const wph = clk * rg.waveRate + rg.wavePhase;
      const base = PAL[rg.colorIdx];
      // Hue: spatial per ring + small bounded wobble (hue swings luma, so
      // no steady drift -- see CLAUDE.md).
      const hue = ((base[0] + hue0 * 0.05 + i * 7 + Math.sin(clk * 0.25 + i) * 8) % 360 + 360) % 360;
      poly(r, rg.sides, rot, `hsla(${hue}, ${base[1]}%, ${Math.min(80, base[2] + 14)}%, 0.9)`, lwThin * 3.2, rg.waveAmp, rg.waveK, wph);
      poly(r, rg.sides, rot, `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.22)`, lwThin * 8.0, rg.waveAmp, rg.waveK, wph);
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
