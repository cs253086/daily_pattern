<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fluid — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: soft luminous "lava lamp" blobs drift, merge and separate.
// Each blob is drawn as an additive radial gradient; overlapping blobs sum into
// bright molten cores with glowing halos over deep black. The lava-lamp / fluid
// look is the dominant style in the relaxing-ambient niche.
//
// Unlike the other engines this one CLEARS each frame (fluid, not accumulating
// trails) — the additive "glow" comes from overlapping soft gradients, not from
// history. Still cheap: ~fill of N radial-gradient circles per frame, no
// per-pixel JS. Kept modest in blob count + gradient radius to stay in budget.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 120);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[155, 90, 55], [180, 88, 55], [275, 80, 58], [110, 82, 52]],
    ember:  [[14, 96, 55], [355, 92, 55], [38, 96, 58], [325, 82, 52]],
    ocean:  [[200, 92, 55], [216, 90, 58], [172, 88, 52], [250, 72, 58]],
    neon:   [[292, 96, 60], [182, 98, 58], [325, 95, 60], [150, 92, 55]],
    sunset: [[16, 96, 58], [340, 90, 58], [285, 80, 55], [44, 96, 60]],
    ice:    [[196, 82, 66], [212, 76, 70], [236, 68, 68], [176, 74, 64]],
    gold:   [[42, 96, 58], [30, 96, 56], [50, 94, 62], [14, 94, 54]],
  };
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  // A "colors" URL param (h,s,l;h,s,l;...) overrides the built-in palette —
  // used to recolour the engine from the image-of-the-day palette.
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  const N = Math.max(5, Math.round(9 * DENSITY));
  let blobs, hue0;
  function config() {
    hue0 = rng() * 360;
    blobs = [];
    for (let i = 0; i < N; i++) {
      const base = PAL[randInt(0, PAL.length - 1)];
      blobs.push({
        x: rng() * W, y: rng() * H,
        // slow drift velocities (px/sec)
        vx: rand(-0.05, 0.05) * minDim, vy: rand(-0.05, 0.05) * minDim,
        rad: rand(0.14, 0.30) * minDim,
        pr: rand(0.6, 1.4),                 // pulse rate
        pph: rng() * Math.PI * 2,
        h: base[0] + rand(-8, 8), s: base[1], l: base[2],
      });
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  config();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    // Fluid: clear to black each frame (no trails); glow is from overlap.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      // wrap softly around edges so blobs re-enter (continuous, loopable feel)
      if (b.x < -b.rad) b.x = W + b.rad; else if (b.x > W + b.rad) b.x = -b.rad;
      if (b.y < -b.rad) b.y = H + b.rad; else if (b.y > H + b.rad) b.y = -b.rad;

      const pulse = 0.82 + 0.18 * Math.sin(clk * b.pr + b.pph);
      const r = b.rad * pulse;
      const hue = ((b.h + Math.sin(clk * 0.1 + b.pph) * 14 + hue0 * 0.03) % 360 + 360) % 360;

      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      // bright-ish core, soft falloff to transparent -> additive halos merge
      g.addColorStop(0.0, `hsla(${hue}, ${b.s}%, ${Math.min(72, b.l + 12)}%, 0.55)`);
      g.addColorStop(0.35, `hsla(${hue}, ${b.s}%, ${b.l}%, 0.22)`);
      g.addColorStop(1.0, `hsla(${hue}, ${b.s}%, ${b.l}%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
