<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spirograph line art — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Gemini-promoted engine (2026-08-15, theme "spirograph hypotrochoid line
// art in clean lines"), restructured by hand. The original drew ONE pen dot
// per curve per frame onto a slowly-fading canvas: the art only existed as
// an accumulated trail, so it was dim, and the unit-motion audit
// (scripts/audit-unit-motion.js) scored it at residual 0.9 -- almost no
// motion at all (a handful of pixels changed per frame). The visual concept
// is kept and made legible: several concentric hypotrochoid/epitrochoid
// curves rendered as chains of round BEADS (the original's dotted, stroked-
// point texture, deliberately distinct from spirograph.html's continuous
// strokes), each being TRACED by a bright pen whose long comet reveals the
// curve behind it while the rest of the curve stays as a faint bead ghost.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rates, redraws every frame
// from the parametric equation (no accumulation, no whiteout risk).
//
// UNIT CHOREOGRAPHY (2026-09-10 wave 2, user definition of "dynamic": the
// basic units must visibly move RELATIVE TO EACH OTHER every second, not
// just the whole pattern spinning). Modelled on spirograph.html's wave-1
// rework, all coverage-neutral by construction:
//   * The pen offset d of every curve MORPHS continuously inside a bounded
//     band (+-45% of its base, period ~3-5s, phases spread curve to curve),
//     so the loops swell and tighten; the point set is rebuilt every frame.
//   * A travelling BEAD-SIZE/BRIGHTNESS pulse runs along each curve (bead
//     radius x0.55-1.45 on a wave with 3-5 wavelengths along the path that
//     advances in time), so the chain visibly ripples.
//   * The curves BREATHE in scale (+-10%) on one shared rate with phases
//     spread i*2pi/n across the n curves, so the deltas cancel exactly.
//   * Two visible PENS per curve race along it in OPPOSITE directions
//     (a full traversal every ~4-6s), each trailing a comet (~30% of the
//     path) that fades toward its tail -- the eye sees the curve being
//     drawn and erased, the original's "line art in progress" idea.
//   * Each curve ROTATES slowly at its own guaranteed-minimum rate with
//     random sign (a gentle base; the morphing is the point).
// The R:r ratios, base d, epi/hypo choice and curve scales are FIXED per
// video (initCurves): re-rolling them per cycle swings stroke coverage and
// reads as a brightness trend (CLAUDE.md spirograph write-up). reconfigure()
// re-rolls only rotation, rates, phases and the hue offset every cycleSec.
// Hue is spatial (per curve, plus a small wobble), not a steady drift.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 12345);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // One hypotrochoid/epitrochoid as a point set. R/r are small coprime
  // integers so the curve closes after exactly r turns of t.
  const POINTS = 1080;
  function buildCurve(pts, R, r, d, epi) {
    const loops = r; // closes after r turns for coprime R/r
    for (let i = 0; i < POINTS; i++) {
      const t = (i / POINTS) * Math.PI * 2 * loops;
      let x, y;
      if (epi) {
        x = (R + r) * Math.cos(t) - d * Math.cos(((R + r) / r) * t);
        y = (R + r) * Math.sin(t) - d * Math.sin(((R + r) / r) * t);
      } else {
        x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
        y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
      }
      pts[i * 2] = x; pts[i * 2 + 1] = y;
    }
  }

  // Curve set, fixed once per video. Coprime (R, r) pairs with 5-8 lobes
  // so each curve reads as a clean rosette, not a dense scribble.
  const SHAPES = [[5, 2], [7, 3], [8, 3], [5, 3], [7, 2], [7, 4]];
  let curves, hue0;
  function initCurves() {
    const n = Math.max(3, Math.min(6, Math.round(5 * DENSITY)));
    curves = [];
    const order = SHAPES.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = randInt(0, i); [order[i], order[j]] = [order[j], order[i]]; }
    for (let i = 0; i < n; i++) {
      const [R, r] = order[i % order.length];
      const epi = rng() < 0.4;
      const d0 = rand(0.6, 1.1) * r;
      const dAmp = 0.45;
      // Normalise by the analytic maximum radius over the WHOLE d swing so
      // the morphing curve always fits its scale (no clipping at any phase).
      const maxMag = (epi ? R + r : R - r) + d0 * (1 + dAmp);
      curves.push({
        R, r, d0, dAmp, epi,
        pts: new Float32Array(POINTS * 2),
        norm: 1 / maxMag,
        scale: (0.16 + (i / Math.max(1, n - 1)) * 0.30) * minDim,
        colorIdx: i % PAL.length,
        dPhase: (i / n) * Math.PI * 2 + rand(-0.4, 0.4),
        breathPhase: (i / n) * Math.PI * 2,
      });
    }
  }
  let breathRate;
  function reconfigure() {
    hue0 = rng() * 360;
    breathRate = rand(0.9, 1.5);                                // shared scale breathing ~4-7s
    for (const c of curves) {
      c.rot = rng() * Math.PI * 2;
      // Guaranteed minimum magnitude with random sign -- same fix as every
      // other curated engine here. Slow: whole-curve spin is rigid motion.
      c.rotRate = (rng() < 0.5 ? -1 : 1) * rand(0.12, 0.3);
      c.dRate = rand(1.2, 2.0);                                 // d morph period ~3-5s
      c.waveRate = (rng() < 0.5 ? -1 : 1) * rand(1.6, 2.6);     // bead pulse wave ~2.4-4s
      c.waveK = randInt(3, 5);                                  // wavelengths along the curve
      c.penRate = (rng() < 0.5 ? -1 : 1) * rand(0.17, 0.25);    // traversals/s (4-6s per lap)
      c.penPhase = rng();
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initCurves();
  reconfigure();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  const STEP = 2;            // draw every 2nd point as a bead (540 beads/curve)
  const COMET = 0.30;        // fraction of the path lit behind EACH pen (two pens per curve)
  const COMET_CHUNKS = 9;    // brightness tiers along the comet
  function drawCurve(c, hue, breath) {
    const { pts, norm, scale } = c;
    const k = norm * scale * breath;
    const base = PAL[c.colorIdx];
    const bead = Math.max(3, minDim / 98);
    const wavePh = clk * c.waveRate;
    const nB = POINTS / STEP;
    // Bead radius along the path: a travelling pulse (mean radius constant).
    const radiusAt = (b) => bead * (1 + 0.45 * Math.sin(wavePh + (b / nB) * Math.PI * 2 * c.waveK));

    // Pass 1: faint ghost of the whole chain (one path, one fill).
    ctx.fillStyle = `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.34)`;
    ctx.beginPath();
    for (let b = 0; b < nB; b++) {
      const j = b * STEP * 2;
      const x = pts[j] * k, y = pts[j + 1] * k;
      const rr = radiusAt(b) * 0.8;
      ctx.moveTo(x + rr, y);
      ctx.arc(x, y, rr, 0, Math.PI * 2);
    }
    ctx.fill();

    // Two pens per curve, running in OPPOSITE directions from opposite
    // starting points, each trailing a comet in brightness tiers.
    const cometB = Math.floor(nB * COMET);
    const per = Math.ceil(cometB / COMET_CHUNKS);
    for (let pen = 0; pen < 2; pen++) {
      const dir = (c.penRate < 0 ? -1 : 1) * (pen === 0 ? 1 : -1);
      const penT = ((dir * clk * Math.abs(c.penRate) + c.penPhase + pen * 0.5) % 1 + 1) % 1;
      const penB = Math.floor(penT * nB);
      for (let ch = 0; ch < COMET_CHUNKS; ch++) {
        const f = (ch + 1) / COMET_CHUNKS;           // 0 tail .. 1 head
        const b0 = ch * per, b1 = Math.min(cometB, b0 + per);
        // Bounded: additive overlap of two comets must not clip to white.
        ctx.fillStyle = `hsla(${hue}, ${base[1]}%, ${Math.min(70, base[2] + 2 + 6 * f)}%, ${0.22 + 0.5 * f})`;
        ctx.beginPath();
        for (let q = b0; q < b1; q++) {
          const back = cometB - q;                    // beads behind the pen
          const b = ((penB - dir * back) % nB + nB) % nB;
          const j = b * STEP * 2;
          const x = pts[j] * k, y = pts[j + 1] * k;
          const rr = radiusAt(b) * (0.8 + 0.5 * f);
          ctx.moveTo(x + rr, y);
          ctx.arc(x, y, rr, 0, Math.PI * 2);
        }
        ctx.fill();
      }
      // Pen head: bright bead with a soft halo.
      const jp = penB * STEP * 2;
      const px = pts[jp] * k, py = pts[jp + 1] * k;
      const pr = Math.max(6, minDim * 0.016);
      const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
      g.addColorStop(0, `hsla(${hue}, ${base[1]}%, 84%, 0.9)`);
      g.addColorStop(0.45, `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.6)`);
      g.addColorStop(1, `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    }
  }

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < curves.length; i++) {
      const c = curves[i];
      // Morph: rebuild the point set with this frame's d.
      const d = c.d0 * (1 + c.dAmp * Math.sin(clk * c.dRate + c.dPhase));
      buildCurve(c.pts, c.R, c.r, d, c.epi);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(c.rot + clk * c.rotRate);
      const base = PAL[c.colorIdx];
      // Hue: spatial per curve + small bounded wobble (hue swings luma, so
      // no steady drift -- see CLAUDE.md).
      const hue = ((base[0] + hue0 * 0.05 + i * 6 + Math.sin(clk * 0.35 + i) * 7) % 360 + 360) % 360;
      // Scale breathing on one shared rate, phases spread across curves so
      // the sum of the path-length deltas cancels at every instant.
      drawCurve(c, hue, 1 + 0.10 * Math.sin(clk * breathRate + c.breathPhase));
      ctx.restore();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigure(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
