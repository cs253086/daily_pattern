<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voronoi Mosaic — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine): the VORONOI DIAGRAM -- a nearest-neighbour
// spatial partition of the plane. Given a set of seed points, each cell
// consists of every point closer to its own seed than to any other seed;
// cell boundaries are straight-line perpendicular bisectors between
// neighbouring seed pairs, so the cells are always convex polygons, never
// curved or organic. See CLAUDE.md's dated write-up for why this category
// (an obscure structural principle rather than a specific named tiling)
// led here rather than to another aperiodic-tiling variant.
//
// A genuinely different construction PRINCIPLE from everything else in the
// pool: not a substitution/subdivision system that recursively repartitions
// a FIXED shape (quasicrystal.html/voderberg.html), not several overlaid
// band families (widmanstatten.html), not a single recursively-defined
// path (hilbertweave.html), not an arithmetic sieve (primespiral.html) --
// a PROXIMITY-based partition with no recursion, no substitution rule, and
// (because seed points are placed with no radial/lattice structure) no
// exact rotational or lattice symmetry at all, unlike almost every other
// engine in the pool. ONE mosaic fills the entire canvas (deliberately not
// several independent instances in a grid -- an earlier attempt at that
// fix measured too close to lattice3d.html's own grid-of-elements
// composition in the mandatory novelty gate, 0.486 vs the 0.60 minimum;
// see CLAUDE.md's dated write-up for the full iteration history).
//
// Cells are computed via HALF-PLANE-INTERSECTION clipping (not Fortune's
// sweep algorithm): starting from a large bounding square, each seed's
// cell is the box repeatedly clipped against the perpendicular-bisector
// half-plane of every OTHER seed, keeping the half closer to this seed.
// This construction was verified OFFLINE before writing any rendering
// code (the same discipline this pool's quasicrystal.html/geodome.html
// already established for formulas that could look plausible even if
// subtly wrong): a standalone script confirmed the resulting cells'
// total area exactly equals the bounding square's area (no gaps or
// overlaps) and that every cell's centroid is genuinely nearest to its
// OWN seed among all seeds, for an 18-seed test case.
//
// Motion is a BOUNDED angular oscillation (a base angle plus a small
// sine wobble), not a full continuous rotation -- a real, measured fix:
// full 360-degree rotation of this mosaic repeatedly failed validate.js's
// brightness-trend (whiteout) regression on some seeds (+62 to -99 luma
// projected, against the +-50 threshold), root-caused to a real structural
// effect, not accumulation or a validator artifact -- rotating a large
// colour-varying field inside a FIXED RECTANGULAR (16:9) viewport isn't
// coverage-neutral the way rotating it inside a circular one would be: the
// canvas reaches ~2.04x farther along its own diagonal (to its corners)
// than along its short edge (half-diagonal / half-height), so cells
// sitting in that "annulus" between the inscribed circle and the
// circumscribed disk are only visible during SOME rotation angles, and a
// full sweep through all of them lets an unlucky seed's specific cell
// layout there swing the frame average. Bounding the angular excursion to
// a small wobble (+-0.3 to +-0.4 rad, a fraction of a full rotation)
// proportionally shrinks how much of that annulus content ever cycles in
// or out of view, while a fast oscillation RATE keeps the same peak
// angular velocity (hence the same strong fastMotion reading) a full slow
// rotation would give -- the same "bound the risky excursion, don't
// remove the motion" lever torusrings3d.html already used for its own
// silhouette-degeneracy problem (bounding tilt instead of allowing an
// unbounded sweep through the edge-on angle).
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rotation rate. Redraws each
// frame from a fixed cell list computed once at start-up -- no
// accumulation, no whiteout risk. The mosaic tiles its own bounding square
// completely (no black background ever visible within it), so the canvas
// is always fully covered regardless of angle as long as that bounding
// square's own half-diagonal reach exceeds the canvas's.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 36);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const halfDiag = Math.sqrt(W * W + H * H) / 2 * 1.08; // covers every corner at any angle within the bounded wobble
  const dt = 1 / FPS;

  // Sutherland-Hodgman single-half-plane clip: keep points x with x.n <= c.
  function clipHalfPlane(poly, nx, ny, c) {
    const out = [];
    const len = poly.length;
    for (let i = 0; i < len; i++) {
      const cur = poly[i];
      const prev = poly[(i - 1 + len) % len];
      const curIn = (cur[0] * nx + cur[1] * ny) <= c;
      const prevIn = (prev[0] * nx + prev[1] * ny) <= c;
      if (curIn) {
        if (!prevIn) out.push(intersectEdge(prev, cur, nx, ny, c));
        out.push(cur);
      } else if (prevIn) {
        out.push(intersectEdge(prev, cur, nx, ny, c));
      }
    }
    return out;
  }
  function intersectEdge(a, b, nx, ny, c) {
    const da = a[0] * nx + a[1] * ny - c;
    const db = b[0] * nx + b[1] * ny - c;
    const t = da / (da - db);
    return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
  }
  function voronoiCell(i, seeds, boundingPoly) {
    let poly = boundingPoly;
    const p = seeds[i];
    for (let j = 0; j < seeds.length; j++) {
      if (j === i) continue;
      const q = seeds[j];
      const nx = q[0] - p[0], ny = q[1] - p[1];
      const c = (q[0] * q[0] + q[1] * q[1] - (p[0] * p[0] + p[1] * p[1])) / 2;
      poly = clipHalfPlane(poly, nx, ny, c);
      if (poly.length === 0) break;
    }
    return poly;
  }

  // UNIT CHOREOGRAPHY (2026-09-10, user definition of "dynamic": the basic
  // pattern units themselves must visibly move relative to each other,
  // not just the whole composition spinning as a rigid block):
  //   1. Every SEED POINT drifts on its own small bounded Lissajous orbit
  //      (radius 14-30% of the mean seed spacing, periods ~3-8s, random
  //      sign, guaranteed-minimum rate) around a fixed home position, and
  //      the Voronoi cells are RECOMPUTED EVERY FRAME from the moving
  //      seeds -- so cell edges slide, cells grow/shrink and swap
  //      neighbours continuously, while the mosaic still tiles its
  //      bounding square completely at every instant (coverage-neutral by
  //      construction: a Voronoi partition has no gaps for any seed set).
  //   2. Each cell's inner fill is scaled about its own centroid in a
  //      travelling wave (up to ~18% linear), revealing a RIM in a
  //      strongly contrasting hue that breathes open and closed across the
  //      mosaic in a moving front. The rim is drawn at the SAME
  //      luma-equalised brightness as the fill (see lightForLuma), so the
  //      pulse changes colour balance but never frame brightness -- a
  //      first version revealed a DARK border instead and tripped the
  //      brightness-trend check (+119 luma projected on seed 4; measured
  //      as the dominant variance source, sd 1.69 vs 0.56 with it off),
  //      and even nearest-neighbour opposite-phase pairing with
  //      area-matched amplitudes only partly cancelled it once the cells
  //      began morphing. Equal-luma rims remove the mechanism entirely.
  // Cell COLOURS, seed home positions, orbit radii/rates/phases and the
  // wave vector are all fixed once per video in initMosaic(); the shared
  // clock drives every position, so same seed => same frames.
  //
  // Seed home positions and per-cell colours are fixed ONCE for the whole
  // video, never re-rolled per cycle -- the "any coverage-affecting
  // parameter re-randomised per cycle creates a real (not aliased)
  // brightness swing" lesson CLAUDE.md documents for eleven prior engines
  // in a row. Cell count is higher than "a few big bold cells" alone would
  // suggest -- many independent, uncorrelated-colour cells dilute any
  // residual whole-canvas-wobble brightness swing (the same "many
  // independent elements average out" principle dendrite.html/
  // phyllotaxis.html already rely on).
  let cells, boundingPoly, waveK, waveKx, waveKy, waveRate, PULSE, bgFill;
  const seedsNow = [];
  function initMosaic() {
    const d = Math.max(0.7, Math.min(1.4, DENSITY));
    const n = Math.round(60 * d);
    const boxHalf = halfDiag * 1.05;
    boundingPoly = [[-boxHalf, -boxHalf], [boxHalf, -boxHalf], [boxHalf, boxHalf], [-boxHalf, boxHalf]];
    const spacing = (2 * boxHalf) / Math.sqrt(n); // mean seed spacing = typical cell size

    const hue0 = rng() * 360;
    // Target luma = the palette's own mean luma at its base lightness, so
    // the overall brightness level matches the un-equalised design.
    let targetLuma = 0;
    for (const c of PAL) targetLuma += hslLuma(c[0], c[1], c[2]);
    targetLuma /= PAL.length;
    cells = [];
    for (let i = 0; i < n; i++) {
      const baseCol = PAL[i % PAL.length];
      const hue = ((baseCol[0] + hue0 + rand(-14, 14)) % 360 + 360) % 360;
      // Luma-equalised lightness: HSL hue carries very different luma at
      // the same S/L (yellow reads far brighter than blue), and now that
      // cells MORPH every frame the visible mix of hues changes
      // continuously -- with raw palette lightness that swung the frame
      // average enough to trip the brightness-trend check on 2/9 seeds.
      // Nudging each cell's lightness so every fill lands near one target
      // luma (+-10, a small zero-mean per-cell spread so cells stay
      // distinguishable in luminance) removes the mechanism at the
      // source, while hue and saturation stay fully vivid. Measured
      // mean-luma sd over validate.js's 300s window: 0.39 at +-6, up to
      // 1.39 on an unlucky seed at +-22 (worst-case projected rise 64),
      // so the spread is kept small on purpose -- the trade-off is that
      // a luma-only motion metric under-reads this engine's (colour-
      // visible) cell morphing.
      const light = lightForLuma(hue, baseCol[1], targetLuma + rand(-10, 10));
      const sgn = () => (rng() < 0.5 ? -1 : 1);
      cells.push({
        hx: rand(-boxHalf, boxHalf), hy: rand(-boxHalf, boxHalf),
        // Primary orbit: 14-30% of a cell in radius, period ~3.3-6.3s.
        r1: spacing * rand(0.14, 0.30), w1: sgn() * rand(1.0, 1.9) * SPEED, p1: rand(0, Math.PI * 2),
        // Secondary (Lissajous) term at a different rate so the path is a
        // slowly-precessing loop rather than a plain circle.
        r2: spacing * rand(0.05, 0.12), w2: sgn() * rand(0.5, 1.0) * SPEED, p2: rand(0, Math.PI * 2),
        pulseOff: rand(-0.6, 0.6),
        // Rim colour: a strongly contrasting hue at the SAME equalised
        // luma, so the breathing rim changes colour balance, never
        // brightness (see the pulse note in the choreography block).
        rimFill: (() => { const rh = (hue + rand(130, 200)) % 360; return `hsl(${rh}, ${baseCol[1]}%, ${lightForLuma(rh, baseCol[1], targetLuma)}%)`; })(),
        hue, sat: baseCol[1], light,
        fill: `hsl(${hue}, ${baseCol[1]}%, ${light}%)`,
        poly: null,
      });
      seedsNow.push([0, 0]);
    }
    // Travelling pulse wave: wavelength ~0.9 x minDim (several wavelengths
    // across the bounding square), period ~4-6.3s, random direction.
    const waveAng = rand(0, Math.PI * 2);
    waveK = (Math.PI * 2) / (Math.min(W, H) * 0.9);
    waveKx = Math.cos(waveAng) * waveK; waveKy = Math.sin(waveAng) * waveK;
    waveRate = (rng() < 0.5 ? -1 : 1) * rand(1.0, 1.55) * SPEED;
    PULSE = 0.18; // max linear shrink of a cell's fill about its centroid
    const bgBase = PAL[SEED % PAL.length];
    bgFill = `hsl(${((bgBase[0] + hue0) % 360 + 360) % 360}, ${Math.max(20, bgBase[1] - 35)}%, 7%)`;
  }

  // Rec.709 luma of an HSL colour (0-255), and the lightness that lands a
  // given hue/saturation at a target luma (bisection, clamped to a
  // vivid-but-not-pastel range).
  function hslLuma(h, s, l) {
    const S = s / 100, L = l / 100;
    const C = (1 - Math.abs(2 * L - 1)) * S;
    const hp = (((h % 360) + 360) % 360) / 60;
    const X = C * (1 - Math.abs((hp % 2) - 1));
    let r = 0, g = 0, b = 0;
    if (hp < 1) { r = C; g = X; } else if (hp < 2) { r = X; g = C; } else if (hp < 3) { g = C; b = X; }
    else if (hp < 4) { g = X; b = C; } else if (hp < 5) { r = X; b = C; } else { r = C; b = X; }
    const m = L - C / 2;
    return 255 * (0.2126 * (r + m) + 0.7152 * (g + m) + 0.0722 * (b + m));
  }
  function lightForLuma(h, s, target) {
    let lo = 40, hi = 70;
    for (let k = 0; k < 14; k++) {
      const mid = (lo + hi) / 2;
      if (hslLuma(h, s, mid) < target) lo = mid; else hi = mid;
    }
    return Math.round(((lo + hi) / 2) * 10) / 10;
  }

  function updateSeeds(t) {
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const a1 = c.p1 + t * c.w1, a2 = c.p2 + t * c.w2;
      seedsNow[i][0] = c.hx + c.r1 * Math.cos(a1) + c.r2 * Math.sin(a2);
      seedsNow[i][1] = c.hy + c.r1 * Math.sin(a1) + c.r2 * Math.cos(a2);
    }
  }

  // Called at start-up AND every cycleSec. Only the wobble's parameters
  // reset -- coverage-neutral by construction (the mosaic itself never
  // changes, and it already tiles its bounding square completely, at any
  // angle within +-WOBBLE_MAX). Seed points have no radial/lattice
  // structure, so unlike ziggurat.html's identical wedges there is no
  // exact rotational symmetry to resonate against.
  const WOBBLE_MAX = 0.36; // radians -- bounds how much of the viewport's outer "annulus" can ever cycle in/out
  let baseAngle, wobblePhase0, wobbleRate;
  function reconfigureWobble() {
    baseAngle = rand(0, Math.PI * 2);
    wobblePhase0 = rand(0, Math.PI * 2);
    // Guaranteed-minimum-magnitude, random-sign rate, same house-style
    // convention as every other engine's motion parameters. Slowed from
    // the original 2.0-3.2 rad/s once the per-unit choreography (moving
    // seeds + breathing borders) became the main source of visible motion
    // -- a fast rigid wobble only drowned the unit-level motion in the
    // audit, while the total excursion stays bounded either way.
    wobbleRate = (rng() < 0.5 ? -1 : 1) * rand(0.5, 0.85) * SPEED;
  }

  const strokeW = Math.max(2, Math.min(W, H) * 0.009);

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initMosaic();
  reconfigureWobble();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    updateSeeds(clk);
    for (let i = 0; i < cells.length; i++) cells[i].poly = voronoiCell(i, seedsNow, boundingPoly);

    ctx.fillStyle = bgFill; // never visible (the mosaic tiles the viewport) -- defensive clear
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(baseAngle + WOBBLE_MAX * Math.sin(wobblePhase0 + clk * wobbleRate));

    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = strokeW;

    const wt = clk * waveRate;
    for (const cell of cells) {
      const poly = cell.poly;
      if (!poly || poly.length < 3) continue;
      // Centroid (vertex mean is fine as a scale pivot for a convex cell).
      let mx = 0, my = 0;
      for (const v of poly) { mx += v[0]; my += v[1]; }
      mx /= poly.length; my /= poly.length;
      const s = 1 - PULSE * (0.5 + 0.5 * Math.sin(waveKx * cell.hx + waveKy * cell.hy + wt + cell.pulseOff));
      // Full cell in the rim colour, then the pulsing inner fill, then the
      // crisp dark edge on the true cell boundary.
      ctx.fillStyle = cell.rimFill;
      ctx.beginPath();
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (let k = 1; k < poly.length; k++) ctx.lineTo(poly[k][0], poly[k][1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = cell.fill;
      ctx.beginPath();
      ctx.moveTo(mx + (poly[0][0] - mx) * s, my + (poly[0][1] - my) * s);
      for (let k = 1; k < poly.length; k++) ctx.lineTo(mx + (poly[k][0] - mx) * s, my + (poly[k][1] - my) * s);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureWobble(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
