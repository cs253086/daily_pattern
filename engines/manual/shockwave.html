<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shockwave Rings — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: SHOCKWAVE FRONTS as the pattern itself. Several epicentres
// emit a travelling ring-front on their own schedule, and the fronts from
// different epicentres interfere where they cross, so the frame reads as
// successive sharp shockwaves washing across each other.
//
// Construction (stateless, a pure function of time):
//   For each epicentre i at position c_i (wandering on a small bounded loop),
//   the emitted front reaches radius d at phase
//       p_i(x, t) = d_i(x) / lambda_i - t / T_i + o_i
//   which is a sawtooth: each period a fresh sharp front expands outward from
//   c_i at speed lambda_i / T_i. The frame value is the average of those phases,
//       s = mean_i p_i,   v = fract(s),
//   so v has a sharp jump (the front) every time a ring of some epicentre passes
//   a pixel, and a smooth ramp behind it. Where fronts of different epicentres
//   meet, the average produces the interference pattern.
//
// Brightness neutrality is by construction: each frame the v values are
// RANK-QUANTISED into K equal-area bands (exactly 1/K of the pixels per band),
// so the area distribution, and hence mean luma, cannot drift as fronts move.
// Every third band is black (a fixed 1/3 of the frame), the coloured bands keep
// fixed hues, so luma is constant. Frames are computed fresh: no accumulation,
// no whiteout mechanism.
//
// Motion: each front expands at its own speed, each epicentre drifts on its own
// bounded loop, and the emission periods differ, so neighbouring fronts move
// against each other (unit-level, non-rigid motion). Nothing ever resets; the
// schedules are periodic and the drift is bounded, so the composition develops
// for the whole hour rather than repeating.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32 (4-draw burn-in), no requestAnimationFrame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Mulberry32's first draws for consecutive small seeds are correlated, so burn
  // 4 draws first (same convention as hypnospiral/juliabands/pendulumwave).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  // ---- epicentres (fixed per video, positions wander on bounded loops) ---------
  // Coordinates are normalised so that 1 unit = half the frame height. The frame
  // spans x in [-aspect, aspect], y in [-1, 1].
  const ASPECT = W / H;
  const NS = 3 + Math.floor(rng() * 3);        // 3..5 epicentres
  const src = [];
  for (let i = 0; i < NS; i++) {
    src.push({
      cx: rand(-0.85 * ASPECT, 0.85 * ASPECT),
      cy: rand(-0.85, 0.85),
      // Drift: a bounded Lissajous loop around the rest position (amplitude 0.12-0.22).
      ax: rand(0.12, 0.22), ay: rand(0.12, 0.22),
      wx: sgn() * rand(0.035, 0.07) * SPEED, wy: sgn() * rand(0.035, 0.07) * SPEED,
      px: rand(0, 2 * Math.PI), py: rand(0, 2 * Math.PI),
      // Front schedule: one ring emitted every T seconds, expanding at speed c.
      T: rand(5.5, 9.5) / SPEED,
      c: rand(0.16, 0.24) * SPEED,            // front speed, normalised units per second
      off: rand(0, 1),                        // phase offset in emission periods
    });
  }

  // ---- field grid -------------------------------------------------------------
  // Computed at a capped resolution and nearest-upscaled (crisp, house style).
  const CW = Math.min(W, 640);
  const CH = Math.max(1, Math.round(CW * H / W));
  const N = CW * CH;
  const K = 12;                 // equal-area bands
  const NB = 4096;              // histogram bins over v in [0,1)

  const PX = new Float32Array(N);
  const PY = new Float32Array(N);
  {
    let i = 0;
    for (let py = 0; py < CH; py++) {
      const y = (CH / 2 - py - 0.5) / (CH / 2);
      for (let px = 0; px < CW; px++) {
        PX[i] = (px + 0.5 - CW / 2) / (CH / 2);
        PY[i] = y;
        i++;
      }
    }
  }

  const off = document.createElement('canvas');
  off.width = CW; off.height = CH;
  const offCtx = off.getContext('2d');
  const img = offCtx.createImageData(CW, CH);
  const data = img.data;

  // ---- colour LUT: K bands ------------------------------------------------------
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  const H0 = PAL[0][0];
  const BAND_S = Math.max(86, Math.min(94, PAL[0][1]));
  const BAND_L = 60;
  const lut = new Uint8ClampedArray(K * 3);
  const isBlack = (k) => k % 3 === 1;          // every third band is black (1/3 of frame)
  function buildLUT() {
    for (let k = 0; k < K; k++) {
      if (isBlack(k)) { lut[k * 3] = 0; lut[k * 3 + 1] = 0; lut[k * 3 + 2] = 0; continue; }
      const rgb = hslToRgb(H0 + (k * 360) / K, BAND_S, BAND_L);
      lut[k * 3] = rgb[0]; lut[k * 3 + 1] = rgb[1]; lut[k * 3 + 2] = rgb[2];
    }
  }

  const binOf = new Uint16Array(N);
  const binCount = new Uint32Array(NB);
  const bandOfBin = new Uint8Array(NB);
  const SRC_TWO_PI = 2 * Math.PI;

  // Front phase at epicentre i: p = d / lambda - t / T + off, lambda = c * T.
  // Then d / lambda = d / (c*T), so p = d/(c*T) - t/T + off.
  function computeField(clk) {
    binCount.fill(0);
    // Current epicentre positions (bounded Lissajous drift).
    const cur = src.map((s) => ({
      x: s.cx + s.ax * Math.sin(s.wx * SRC_TWO_PI * clk + s.px),
      y: s.cy + s.ay * Math.sin(s.wy * SRC_TWO_PI * clk + s.py),
      invL: 1 / (s.c * s.T),
      invT: 1 / s.T,
      off: s.off,
    }));
    const inv = 1 / NS;
    for (let i = 0; i < N; i++) {
      const x = PX[i], y = PY[i];
      let acc = 0;
      for (let j = 0; j < NS; j++) {
        const c = cur[j];
        const dx = x - c.x, dy = y - c.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        acc += d * c.invL - clk * c.invT + c.off;
      }
      const s = acc * inv;
      const v = s - Math.floor(s);
      let bin = (v * NB) | 0;
      if (bin >= NB) bin = NB - 1;
      binOf[i] = bin;
      binCount[bin]++;
    }
  }

  // Rank-quantise: bins are walked in order of v, grouped so each band holds
  // exactly 1/K of the pixels (to bin granularity).
  function assignBands() {
    let cum = 0;
    for (let b = 0; b < NB; b++) {
      const c = binCount[b];
      const q = N > 0 ? (cum + c / 2) / N : 0;
      bandOfBin[b] = Math.min(K - 1, Math.floor(q * K));
      cum += c;
    }
  }

  function paint() {
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const b3 = bandOfBin[binOf[i]] * 3;
      data[p] = lut[b3]; data[p + 1] = lut[b3 + 1]; data[p + 2] = lut[b3 + 2]; data[p + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, W, H);
  }

  let clk = 0;
  function renderFrame() {
    clk += 1 / FPS;
    buildLUT();
    computeField(clk);
    assignBands();
    paint();
  }

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;
  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
