<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chladni — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine): cymatics / Chladni figures -- the nodal-line
// patterns that appear when a vibrating plate is combined with fine sand,
// which collects along the lines where the plate's standing-wave vibration
// cancels to zero (see CLAUDE.md's dated write-up for the search trail).
// A genuinely different construction PRINCIPLE from everything else in the
// pool: not a substitution/subdivision system (quasicrystal.html), not a
// discrete cellular-automaton generation (automaton.html), not a
// continuous rigid transform of a fixed shape -- an IMPLICIT curve (the
// zero-set of a standing-wave interference function), traced by sampling a
// grid and marking points near the zero crossing, closer in spirit to
// spirograph.html's "precise, curved, mathematically-generated geometry"
// than to any polygon/tile engine, but from wave superposition instead of
// a parametric roulette curve.
//
// Standard (visualisation-grade, not a lab-exact eigenmode) square-plate
// Chladni formula: mode(m,n)(u,v) = cos(m*pi*u)*cos(n*pi*v) -
// cos(n*pi*u)*cos(m*pi*v), for u,v in [-1,1] -- a widely used formula for
// generating recognisable Chladni-figure nodal patterns. Two DISTINCT
// (m,n) mode pairs are picked once per video and continuously cross-faded
// via a rotating angle (f = cos(theta)*modeA + sin(theta)*modeB), which
// smoothly morphs the nodal pattern between the two modes and everything
// in between -- the same "sweep the driving frequency and watch the sand
// pattern reorganise" behaviour real Chladni-plate demonstrations show.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rates. Redraws each frame
// (no accumulation, no whiteout risk) -- every dot is a fresh evaluation
// of the current frame's interference function, never blended with the
// previous frame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 34);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const R = minDim * 0.47;
  const dt = 1 / FPS;

  function mode(m, n, u, v) {
    return Math.cos(m * Math.PI * u) * Math.cos(n * Math.PI * v)
         - Math.cos(n * Math.PI * u) * Math.cos(m * Math.PI * v);
  }

  // Picks two distinct, non-degenerate (m,n) mode pairs and grid
  // resolution ONCE for the whole video. Grid resolution is a function of
  // DENSITY only, never re-randomised per cycle -- the exact "coverage
  // parameter must not vary per cycle" lesson CLAUDE.md now documents for
  // three prior engines in a row (automaton.html, quasicrystal.html,
  // stripweave.html): a finer grid samples closer to the true zero-set and
  // reads as a denser pattern, so randomising it per cycle would swing
  // average frame brightness exactly like a randomised subdivision depth
  // or automaton density did.
  let modeA, modeB, cols, rows, cellSize, hue0;
  function pickMode() {
    let m, n;
    do { m = randInt(2, 9); n = randInt(2, 9); } while (m === n);
    return [m, n];
  }
  function initPlate() {
    modeA = pickMode();
    // modeB must be neither equal to modeA NOR its swap (n,m) -- a real
    // bug found only by rendering and running validateEngine(), not by
    // reasoning about the code in the abstract: mode(n,m,u,v) is exactly
    // -mode(m,n,u,v) algebraically (swapping the two cos-product terms
    // just negates the whole expression), so f = cos(theta)*modeA +
    // sin(theta)*modeB collapses to modeA*(cos(theta) - k*sin(theta)) for
    // some constant k whenever modeB is modeA's swap -- a single scalar
    // multiplying a FIXED shape. The zero-set (where the nodal lines are)
    // of a scalar multiple of modeA is identical to the zero-set of modeA
    // itself, so the whole rendered pattern was completely frozen in time
    // regardless of theta -- validateEngine() caught this directly as
    // "little/no motion between frames (max diff 0.00)" on 2 of 10 tested
    // seeds, an unambiguous bug rather than a borderline case.
    do {
      modeB = pickMode();
    } while ((modeB[0] === modeA[0] && modeB[1] === modeA[1])
      || (modeB[0] === modeA[1] && modeB[1] === modeA[0]));
    cellSize = Math.max(16, Math.round((minDim / 42) * Math.max(0.75, Math.min(1.4, DENSITY))));
    cols = Math.floor((2 * R) / cellSize);
    rows = Math.floor((2 * R) / cellSize);
    hue0 = rng() * 360;
  }

  // Called at start-up AND every cycleSec. Only the cross-fade rate/sign
  // resets -- coverage-neutral over a full period by construction, same
  // reasoning as quasicrystal.html's reconfigureRotation() and
  // stripweave.html's reconfigureScroll(): the morph angle sweeps through
  // the same bounded family of nodal patterns regardless of its current
  // rate, so changing the rate doesn't shift average frame brightness the
  // way changing the MODE PAIR or GRID would.
  let thetaBase0, thetaRate, rotAngle0, rotRate;
  function reconfigureMorph() {
    thetaBase0 = rand(0, Math.PI * 2);
    // Guaranteed-nonzero magnitude with random sign. The TARGET_FRAC
    // adaptive threshold above (needed to fix a real brightness-swing bug
    // -- see its own comment) keeps total lit AREA constant, which turned
    // out to also visibly damp frame-to-frame pixel churn compared to a
    // fixed-cutoff threshold: validateEngine() across the same 10 seeds
    // went from 3 brightness-trend failures to 0, but picked up 5 NEW
    // "too slow to read as exciting" failures at the previous 0.3-0.6
    // rad/s range. Fixed by raising the range well past what "many full
    // periods in the test window" alone called for -- 0.8-1.4 rad/s means
    // a full cross-fade period (pi/rate) is only ~2.2-3.9s, so validate.js's
    // 1.5s fast-motion sample window now covers 40-70% of a full period
    // (was 15-30%), giving the SHAPE enough time to visibly reorganise
    // within that short window even with area held constant. Still keeps
    // 65-135 full periods inside the 300s test window, comfortably more
    // than the original range's, so the trend-averaging reasoning above
    // still holds.
    thetaRate = (rng() < 0.5 ? -1 : 1) * rand(0.8, 1.4) * SPEED;

    // A genuine rigid rotation of the whole rendered plate, layered on
    // top of the mode cross-fade above. Added because the cross-fade
    // alone, even at the increased rate, still left 4-5 of 10 tested
    // seeds failing validate.js's fast-motion check -- measured directly
    // (not guessed): only ~8% of lit grid cells actually swapped in/out
    // over a 1.5s window even at the faster theta rate, because the
    // TARGET_FRAC percentile threshold (needed to fix the brightness bug
    // above) selects a comparatively STABLE core of lowest-|f| cells that
    // doesn't reorganise as freely as a plain fixed-value threshold would
    // have. Rather than fight that stability further, added an
    // independent, already-proven motion source: quasicrystal.html's
    // rigid-rotation approach displaces every lit pixel by a large,
    // unambiguous amount regardless of which specific cells are selected,
    // so it doesn't depend on the percentile selection's own churn rate.
    rotAngle0 = rand(0, Math.PI * 2);
    rotRate = (rng() < 0.5 ? -1 : 1) * rand(0.5, 0.9) * SPEED;
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initPlate();
  reconfigureMorph();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  const dotSize = () => Math.max(4, cellSize * 0.88);
  // Target fraction of grid cells lit each frame. Kept CONSTANT via an
  // adaptive per-frame threshold (below) rather than a fixed |f| cutoff --
  // a fixed cutoff was found empirically (validateEngine() across 10
  // seeds) to let real coverage swing with how "mixed" the current
  // mode-cross-fade is: a near-pure single mode has a structurally
  // simpler, shorter total nodal-line length than a fully 50/50 mixed
  // state, so a fixed threshold let 3 of 10 seeds show a real (not just
  // aliased) brightness rise as theta swept through its cycle -- even
  // though the oscillation is periodic with many full periods inside
  // validate.js's 300s test window, 8 sparse samples still have enough
  // variance to occasionally read a spurious trend from a large swing.
  // Fixed at the source the same way automaton.html's capDensity() bounds
  // density regardless of the automaton's own raw behaviour: rank all
  // |f| values this frame and light up exactly the lowest TARGET_FRAC of
  // them, so the LIT AREA never varies, only which specific cells (i.e.
  // the nodal pattern's shape) do.
  const TARGET_FRAC = 0.16;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const theta = thetaBase0 + clk * thetaRate;
    const ct = Math.cos(theta), st = Math.sin(theta);
    const size = dotSize();

    const cells = [];
    for (let gy = 0; gy <= rows; gy++) {
      const v = (gy / rows) * 2 - 1;
      for (let gx = 0; gx <= cols; gx++) {
        const u = (gx / cols) * 2 - 1;
        const f = ct * mode(modeA[0], modeA[1], u, v) + st * mode(modeB[0], modeB[1], u, v);
        cells.push({ u, v, gx, gy, af: Math.abs(f) });
      }
    }
    const sortedAbs = cells.map((c) => c.af).sort((a, b) => a - b);
    const cutIdx = Math.max(0, Math.min(sortedAbs.length - 1, Math.floor(sortedAbs.length * TARGET_FRAC)));
    const thresh = sortedAbs[cutIdx];

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotAngle0 + clk * rotRate);

    for (const c of cells) {
      if (c.af > thresh) continue;
      const lx = c.u * R, ly = c.v * R;
      // Spatial (not time-based) hue ripple -- position-fixed, so it
      // adds colour richness without ever creating a temporal luma
      // trend (the same reasoning as quasicrystal.html's per-triangle
      // sin(5*angle) fix).
      const ang = Math.atan2(c.v, c.u);
      const base = PAL[(c.gx + c.gy) % PAL.length];
      const hue = ((base[0] + hue0 + 32 * Math.sin(3 * ang)) % 360 + 360) % 360;
      ctx.fillStyle = `hsl(${hue}, ${base[1]}%, ${Math.min(78, base[2] + 12)}%)`;
      ctx.fillRect(lx - size / 2, ly - size / 2, size, size);
    }

    ctx.restore();

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureMorph(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
