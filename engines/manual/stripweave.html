<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strip Weave — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine): Kente cloth, the strip-woven textile
// tradition of the Akan/Ewe peoples of West Africa (see CLAUDE.md's dated
// write-up for the search trail). Research turned up a specific structural
// principle worth extracting -- NOT a generic over/under thread weave
// (true of any woven fabric, not distinctively Kente), but the thing that
// actually defines Kente specifically: cloth assembled from separate
// NARROW STRIPS, each woven independently with its OWN repeating geometric
// motif rhythm (zigzags/diamonds/blocks), then sewn together side by side
// -- "the strips are sewn together lengthways to purposely create definite
// patterns", per the research. This engine renders exactly that: N
// vertical strips, each carrying one of a small vocabulary of motifs in
// its own two-colour scheme, continuously scrolling downward at its own
// slightly-jittered rate (as if being fed off parallel looms) -- a
// genuinely different compositional principle from every other engine in
// this pool: not a centred mandala, not a single uniform grid/tile rule
// (grid.html/tessellation.html), not one shape falling in phase-staggered
// columns (cascade.html) -- a heterogeneous juxtaposition of DIFFERENT
// motifs side by side in one frame, which none of those are.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rates. Every strip is
// always 100% opaque (motifs paint their full background, never leave
// black gaps), so this is structurally whiteout-proof the same way as
// every other clear-and-redraw engine here -- there is nothing to
// accumulate, since each frame is a fresh render of a continuously
// scrolling but otherwise fixed pattern.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 36);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];
  const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360}, ${s}%, ${l}%)`;

  // Rec.709 luma of an HSL colour (0-255). Used to guarantee a minimum
  // luma gap between each strip's two colours (the same fix
  // herringbone.html needed): a monochrome-in-luma palette (e.g. all
  // blues) made the motif choreography invisible in luminance terms --
  // measured as a low unit-motion residual on exactly those seeds -- and
  // reads less crisp to the eye as well.
  function hslLuma(h, sat, l) {
    const S = sat / 100, L = l / 100;
    const C = (1 - Math.abs(2 * L - 1)) * S;
    const hp = (((h % 360) + 360) % 360) / 60;
    const X = C * (1 - Math.abs((hp % 2) - 1));
    let r = 0, g = 0, b = 0;
    if (hp < 1) { r = C; g = X; } else if (hp < 2) { r = X; g = C; } else if (hp < 3) { g = C; b = X; }
    else if (hp < 4) { g = X; b = C; } else if (hp < 5) { r = X; b = C; } else { r = C; b = X; }
    const m = L - C / 2;
    return 255 * (0.2126 * (r + m) + 0.7152 * (g + m) + 0.0722 * (b + m));
  }
  const MIN_LUMA_GAP = 60;
  function separateLuma(a, b) {
    // a, b: [h, s, l]. Nudge lightness apart (whichever has more headroom
    // moves) until the luma gap is at least MIN_LUMA_GAP; clamped to a
    // vivid-but-not-pastel range.
    let la = a[2], lb = b[2];
    for (let k = 0; k < 40; k++) {
      const ya = hslLuma(a[0], a[1], la), yb = hslLuma(b[0], b[1], lb);
      if (Math.abs(ya - yb) >= MIN_LUMA_GAP) break;
      if (ya >= yb) { if (la < 74) la += 1; else lb -= 1; if (lb > 38) lb -= 1; else la += 1; }
      else { if (lb < 74) lb += 1; else la -= 1; if (la > 38) la -= 1; else lb += 1; }
      la = Math.max(36, Math.min(76, la)); lb = Math.max(36, Math.min(76, lb));
    }
    return [[a[0], a[1], la], [b[0], b[1], lb]];
  }

  const dt = 1 / FPS;
  const MOTIFS = ['blocks', 'diamond', 'chevron'];

  // UNIT CHOREOGRAPHY (2026-09-10, user definition of "dynamic": the basic
  // pattern units -- here the individual strips and the motifs woven into
  // them -- must visibly move relative to each other, not just the whole
  // cloth scrolling as one rigid block):
  //   1. Each strip scrolls in its OWN direction (some up, some down) at
  //      its own rate, and that rate swells and ebbs sinusoidally over
  //      time (period ~4-8s) but never drops below half its base -- so no
  //      strip ever stops or reverses, they just visibly surge past each
  //      other. Offsets are closed-form integrals of the shared clock.
  //   2. Motifs PULSE in a travelling wave along each strip: diamonds and
  //      chevrons breathe +-32% in size, block splits slide +-25%, with
  //      the wave phase keyed to segment index so the pulse runs along the
  //      strip rather than blinking in unison. Every motif stays inside its
  //      own opaque segment, so total coverage per strip is unchanged and
  //      the phases are spread across strips/segments (no brightness trend).
  //   3. The seams between strips SWAY laterally (+-12% of a strip width,
  //      own rate/phase per seam), so strips widen/narrow against their
  //      neighbours while always tiling the full canvas width.
  //   4. Motifs also drift a little sideways inside their strip (+-12% of
  //      the strip width) on their own wave.
  // All rates/phases are fixed once per video in initStrips(); the shared
  // clock drives every position, so same seed => same frames.
  //
  // Strip count/width is a function of DENSITY only, fixed once for the
  // whole video -- same lesson learned twice already this week
  // (automaton.html, quasicrystal.html): a geometry/coverage parameter
  // that gets re-randomised every cycle creates a real frame-average
  // brightness swing between cycles that validate.js's sparse 8-sample
  // trend fit can misread as a monotonic rise, even when every individual
  // cycle looks fine on its own. Kept moderate (not many, thin strips) on
  // purpose too: house style wants bold, legible shapes.
  let N, stripW, strips, seams;
  function initStrips() {
    N = Math.max(5, Math.min(12, Math.round(8 * Math.max(0.7, Math.min(1.4, DENSITY)))));
    stripW = W / N;
    strips = [];
    const sgn = () => (rng() < 0.5 ? -1 : 1);
    for (let i = 0; i < N; i++) {
      const motif = MOTIFS[randInt(0, MOTIFS.length - 1)];
      const baseA = PAL[i % PAL.length];
      // colB is a DIFFERENT palette entry (not just a lightness/hue nudge
      // of colA), so adjacent motif colours read as genuinely two-tone
      // like real Kente thread combinations, not a single hue's shades.
      const bIdx = (i + randInt(2, PAL.length - 2)) % PAL.length;
      const baseB = PAL[bIdx];
      const [cA, cB] = separateLuma(baseA, [baseB[0], baseB[1], Math.min(78, baseB[2] + 10)]);
      strips.push({
        motif,
        colA: hsl(cA[0], cA[1], cA[2]),
        colB: hsl(cB[0], cB[1], cB[2]),
        // Period relative to strip width so motifs stay proportionate
        // regardless of N. Phase and rate jitter give each strip its own
        // independent rhythm -- "parallel looms", not one shared pattern.
        period: stripW * rand(1.5, 2.3),
        phase: rand(0, 10000),
        rateMul: rand(0.75, 1.25),
        dir: sgn(),
        // Speed modulation: rate x (1 + 0.5 sin(modRate t + modPhase)).
        modRate: rand(0.8, 1.6) * SPEED, modPhase: rand(0, Math.PI * 2),
        // Motif pulse wave along the strip (keyed to segment index).
        pulseK: (Math.PI * 2) / rand(2.5, 4.0), pulseRate: sgn() * rand(0.9, 1.6) * SPEED, pulsePhase: rand(0, Math.PI * 2),
        // Sideways drift of the motif inside the strip.
        driftRate: sgn() * rand(0.7, 1.3) * SPEED, driftPhase: rand(0, Math.PI * 2),
      });
    }
    // Interior seams (N-1 of them) sway independently; the outer edges are
    // pinned to the canvas edges so the cloth always fills the frame.
    seams = [];
    for (let k = 1; k < N; k++) seams.push({ x0: k * stripW, amp: stripW * 0.12, rate: sgn() * rand(0.8, 1.5) * SPEED, phase: rand(0, Math.PI * 2) });
  }

  // Called at start-up AND every cycleSec. Only touches scroll phase/rate
  // -- coverage-neutral by construction (a scrolling periodic pattern has
  // the same total ink coverage at every phase), so this is safe to reset
  // freely, same reasoning as quasicrystal.html's reconfigureRotation().
  let scrollBase0, scrollRate;
  function reconfigureScroll() {
    scrollBase0 = rand(0, 10000);
    // Guaranteed-nonzero base speed; each strip applies its own fixed
    // direction and rate multiplier on top (see initStrips).
    scrollRate = stripW * rand(0.7, 1.1) * SPEED;
  }

  function drawBlocks(x, w, yTop, period, colA, colB, split) {
    ctx.fillStyle = colA; ctx.fillRect(x, yTop, w, period * split);
    ctx.fillStyle = colB; ctx.fillRect(x, yTop + period * split, w, period * (1 - split));
  }
  function drawDiamond(x, w, yTop, period, colBg, colFg, scale, dx) {
    ctx.fillStyle = colBg; ctx.fillRect(x, yTop, w, period);
    const dcx = x + w / 2 + dx, dcy = yTop + period / 2;
    const hw = w * 0.36 * scale, hh = period * 0.36 * scale;
    ctx.fillStyle = colFg;
    ctx.beginPath();
    ctx.moveTo(dcx, dcy - hh);
    ctx.lineTo(dcx + hw, dcy);
    ctx.lineTo(dcx, dcy + hh);
    ctx.lineTo(dcx - hw, dcy);
    ctx.closePath();
    ctx.fill();
  }
  function drawChevron(x, w, yTop, period, colBg, colFg, scale, dx) {
    ctx.fillStyle = colBg; ctx.fillRect(x, yTop, w, period);
    const th = period * 0.3 * scale;
    const midY = yTop + period * 0.5;
    const apex = x + w / 2 + dx;
    ctx.fillStyle = colFg;
    ctx.beginPath();
    ctx.moveTo(x, yTop);
    ctx.lineTo(apex, midY);
    ctx.lineTo(x + w, yTop);
    ctx.lineTo(x + w, yTop + th);
    ctx.lineTo(apex, midY + th);
    ctx.lineTo(x, yTop + th);
    ctx.closePath();
    ctx.fill();
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initStrips();
  reconfigureScroll();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    // Current seam positions (edges pinned).
    const xs = new Array(N + 1);
    xs[0] = 0; xs[N] = W;
    for (let k = 1; k < N; k++) { const sm = seams[k - 1]; xs[k] = sm.x0 + sm.amp * Math.sin(sm.phase + clk * sm.rate); }

    for (let i = 0; i < N; i++) {
      const s = strips[i];
      const x = xs[i];
      const w = xs[i + 1] - xs[i];
      const period = s.period;
      // Closed-form integral of rate*(1+0.5 sin(modRate t + modPhase)).
      const travel = clk - (0.5 / s.modRate) * (Math.cos(s.modRate * clk + s.modPhase) - Math.cos(s.modPhase));
      const dist = scrollBase0 + s.dir * s.rateMul * scrollRate * travel + s.phase;
      const shift = ((dist % period) + period) % period;
      const segStart = Math.floor((-shift) / period) - 1;
      const segEnd = Math.ceil((H - shift) / period) + 1;
      const pt = s.pulsePhase + clk * s.pulseRate;
      const dx = w * 0.12 * Math.sin(s.driftPhase + clk * s.driftRate);
      for (let seg = segStart; seg <= segEnd; seg++) {
        const yTop = seg * period + shift;
        // Segment identity for the wave: the segment's index along the
        // scrolled pattern (stable as it scrolls), so the pulse travels.
        const segId = seg - Math.floor(dist / period);
        const wave = Math.sin(s.pulseK * segId + pt);
        if (s.motif === 'blocks') drawBlocks(x, w, yTop, period, s.colA, s.colB, 0.5 + 0.25 * wave);
        else if (s.motif === 'diamond') drawDiamond(x, w, yTop, period, s.colB, s.colA, 1 + 0.32 * wave, dx);
        else drawChevron(x, w, yTop, period, s.colB, s.colA, 1 + 0.32 * wave, dx);
      }
      // Thin dark separator between adjacent strips -- crisp "individual
      // strips sewn together" definition, house-style straight edges.
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = Math.max(1, stripW / 60);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureScroll(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
