<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Truchet Flow — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "a random Wikipedia article" -- since
// Wikipedia is blocked in this sandbox, an open WebSearch for an unusual
// geometric construction surfaced TRUCHET TILES): Father Sebastien Truchet's
// 1704 discovery that a single asymmetric square tile, placed on a grid with
// each copy independently given one of two random orientations, produces
// sprawling emergent maze/flow patterns from nothing but a coin flip per
// cell -- no global rule, no substitution system, no growth process. Cyril
// Stanley Smith's 1987 variant replaces Truchet's original diagonal-triangle
// split with two quarter-circle arcs, the version rendered here, since it
// produces the flowing connected-tube "maze" look Truchet tiles are famous
// for. Sources: https://en.wikipedia.org/wiki/Truchet_tile (search snippets
// -- Wikipedia itself is blocked here),
// https://questionsindataviz.com/2021/03/03/what-are-truchet-tiles/,
// http://drmathart.com/Resources/Truchet/.
//
// A genuinely different construction PRINCIPLE from every other engine in
// the pool: not a substitution/subdivision system that repartitions a fixed
// area (quasicrystal.html/voderberg.html), not a single continuous global
// modular-shift rule (herringbone.html), not several independently-angled
// overlaid band families (widmanstatten.html), not a neighbour-dependent
// cellular-automaton rule (automaton.html) -- every tile's orientation is
// chosen INDEPENDENTLY, with no rule relating it to any neighbour at all,
// and the emergent connected-maze look is a pure side-effect of a shared
// geometric invariant (see below), not of any coordination between cells.
//
// THE KEY INVARIANT, verified OFFLINE before writing any rendering code
// (the same discipline this pool's quasicrystal.html/geodome.html/
// herringbone.html already established for a construction that could still
// "look plausible" even if subtly wrong): every tile, regardless of which
// of its two orientations ("pairing A": left-top and right-bottom edge
// midpoints joined by arcs; "pairing B": top-right and bottom-left) is
// chosen, uses ALL FOUR of its own edge midpoints as arc endpoints, exactly
// once each. Since two side-by-side tiles always share an edge midpoint as
// an arc endpoint on BOTH sides regardless of either tile's own orientation,
// every tile boundary connects seamlessly to its neighbour by construction
// -- there is no way to place two tiles next to each other that DOESN'T
// connect, which is the entire mechanism behind the "effortless maze" look.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Redraws each frame from a fixed
// per-tile orientation/colour scheme computed once at start-up -- no
// accumulation, no whiteout risk.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 37);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const dt = 1 / FPS;
  const cx = W / 2, cy = H / 2;
  // Half-diagonal of the canvas: the tile field must reach at least this
  // far from centre so a single fixed viewing angle never reveals an empty
  // corner -- the same "size the field to the canvas's own half-diagonal"
  // technique widmanstatten.html/phasespikes.html already established.
  const halfDiag = Math.sqrt((W / 2) ** 2 + (H / 2) ** 2);

  // Cell size, grid extent, per-tile pairing/colour, and the fixed viewing
  // angle are all fixed ONCE for the whole video (only the per-tile bulge
  // RATE resets per cycleSec, below) -- the "any coverage-affecting
  // parameter re-randomised per cycle creates a real brightness swing"
  // lesson CLAUDE.md documents for well over a dozen prior engines. Here
  // total stroke ink is essentially constant regardless of pairing choice
  // (every tile always draws the same two arc lengths), so there is
  // nothing coverage-sensitive to re-roll per cycle in the first place.
  //
  // A first draft also gave the whole tile field a slow CONTINUOUS rigid
  // rotation on top of the per-tile bulge, the same second-motion-source
  // pattern several prior engines use. Measured (validateEngine()'s
  // unitMotionNonRigidFrac, not a visual guess) as a real mistake here:
  // even at a slow 0.15-0.28 rad/s, rotating the WHOLE large tile field
  // (sized to the canvas's half-diagonal for corner coverage) displaces
  // every tile's absolute screen position by far more, pixel-for-pixel,
  // than the local bulge morph does on a thin stroke -- 78-85% of the
  // frame-to-frame change was explained by that one rigid transform on
  // every single tested seed, failing the mandatory 40% floor on all 16.
  // fastMotion was never the failing gate, so there was no need for the
  // rotation to supply raw motion in the first place. Fixed by dropping
  // the rotation entirely (down to a single fixed viewing angle, never
  // reassigned even per cycle, so there is no discrete cycle-boundary
  // snap to a new orientation either) and relying solely on the per-tile
  // bulge -- independent phase/rate per tile, so a rigid fit finds
  // essentially nothing to explain globally -- with amplitude and rate
  // both raised to compensate for the removed rotation's contribution to
  // raw motion.
  let cellSize, cols, rows, tiles, hue0, viewAngle;
  function initTiles() {
    cellSize = Math.max(28, Math.round((Math.min(W, H) / 16) * Math.max(0.75, Math.min(1.4, DENSITY))));
    const reach = halfDiag + cellSize;
    cols = Math.ceil((2 * reach) / cellSize) + 2;
    rows = Math.ceil((2 * reach) / cellSize) + 2;
    hue0 = rng() * 360;
    viewAngle = rand(0, Math.PI * 2);

    tiles = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push({
          pairingA: rng() < 0.5,
          bulgePhase0: rand(0, Math.PI * 2),
          bulgeRate: 0,
        });
      }
      tiles.push(row);
    }
  }

  function reconfigureMotion() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        tiles[r][c].bulgeRate = sgn() * rand(1.1, 1.9) * SPEED;
      }
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initTiles();
  reconfigureMotion();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  // Both arcs in a tile always join two of the four edge midpoints, one
  // pair per orientation ("pairing A" or its 90-degree-rotated sibling
  // "pairing B") -- see the header comment's verified invariant. `bulge`
  // scales each arc's control point away from (bulge=0) or beyond
  // (bulge>1) its corner, breathing the curve's shape while its two
  // endpoints -- always an edge midpoint -- never move.
  function drawTile(x0, y0, s, tile, bulge) {
    const mid = {
      top: [x0 + s * 0.5, y0], right: [x0 + s, y0 + s * 0.5],
      bottom: [x0 + s * 0.5, y0 + s], left: [x0, y0 + s * 0.5],
    };
    const corner = {
      tl: [x0, y0], tr: [x0 + s, y0], bl: [x0, y0 + s], br: [x0 + s, y0 + s],
    };
    const arcs = tile.pairingA
      ? [[mid.left, mid.top, corner.tl], [mid.right, mid.bottom, corner.br]]
      : [[mid.top, mid.right, corner.tr], [mid.bottom, mid.left, corner.bl]];
    for (const [p0, p1, corn] of arcs) {
      // Quadratic Bezier control point: the tile's own corner, scaled by
      // `bulge` about the tile centre. Endpoints p0/p1 never depend on
      // bulge, so this can only reshape the curve between its two fixed
      // ends -- verified offline (see header comment) that this holds
      // for any bulge value, not just bulge=1 (the resting corner arc).
      const tileCx = x0 + s * 0.5, tileCy = y0 + s * 0.5;
      const cx2 = tileCx + (corn[0] - tileCx) * bulge;
      const cy2 = tileCy + (corn[1] - tileCy) * bulge;
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.quadraticCurveTo(cx2, cy2, p1[0], p1[1]);
      ctx.stroke();
    }
  }

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(viewAngle);
    ctx.translate(-(cols * cellSize) / 2, -(rows * cellSize) / 2);

    ctx.lineWidth = cellSize * 0.32;
    ctx.lineCap = 'round';

    for (let r = 0; r < rows; r++) {
      const y0 = r * cellSize;
      for (let c = 0; c < cols; c++) {
        const x0 = c * cellSize;
        const tile = tiles[r][c];
        // Spatial (not time-based) hue ripple keyed to grid position --
        // adds colour richness without ever creating a temporal luma
        // trend, the same reasoning as chladni.html's/quasicrystal.html's
        // spatial hue fixes.
        const base = PAL[(r + c) % PAL.length];
        const hue = ((base[0] + hue0 + 22 * Math.sin(0.35 * r + 0.5 * c)) % 360 + 360) % 360;
        ctx.strokeStyle = `hsl(${hue}, ${base[1]}%, ${Math.min(76, base[2] + 8)}%)`;
        const bulge = 1 + 0.5 * Math.sin(tile.bulgePhase0 + clk * tile.bulgeRate);
        drawTile(x0, y0, cellSize, tile, bulge);
      }
    }

    ctx.restore();

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureMotion(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
