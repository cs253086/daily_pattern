<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orb Weaver Lattice — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "a random featured image" --
// deliberately picked as the pool's most under-used category, only
// phasespikes.html shipped successfully from it once): an open WebSearch for
// striking macro/scientific-photography subjects landed on ORB-WEAVER
// SPIDER WEB GEOMETRY. Real orb webs are two structurally distinct threads:
// 15-35 non-sticky RADIAL "spoke" threads at roughly uniform angular
// intervals (rigid, load-bearing, held under tension so they stay straight),
// plus ONE continuous sticky CAPTURE SPIRAL that is a genuine ARCHIMEDEAN
// spiral (r = a + b*theta, constant radial pitch per turn -- unlike a
// logarithmic spiral) crossing every spoke, with glue droplets forming at
// fairly regular intervals along it (a real Plateau-Rayleigh instability
// effect). Sources:
// https://aptivepestcontrol.com/pests/spiders/the-engineering-logic-behind-spider-web-geometry/,
// https://www.nature.com/articles/srep31265 (Scientific Reports, "The
// secondary frame in spider orb webs"),
// https://en.wikipedia.org/wiki/Orb-weaver_spider (search snippets --
// Wikipedia is blocked in this sandbox).
//
// A genuinely different construction PRINCIPLE from every other engine in
// the pool, including every other radial/spiral one: not mirrored-wedge
// stamps (kaleidoscope.html), not nested star outlines (starburst.html),
// not segmented rotating rings (arcrings.html), not a LOGARITHMIC spiral
// tile march (voderberg.html) or curve family (spirograph.html) -- straight
// rigid radial spokes (held perfectly static, the way real taut dragline
// silk stays straight under tension) crossed by exactly ONE continuous
// ARCHIMEDEAN spiral thread with regularly-spaced beads, a combination none
// of those share. Also not a proximity partition (voronoimosaic.html) or
// substitution tiling (quasicrystal.html/voderberg.html) -- there is no
// polygon fill here at all, only line/curve/point primitives on black.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Spoke and spiral geometry, and every
// bead's fixed position, are computed ONCE per video -- structurally
// whiteout-proof (nothing ever accumulates: the canvas clears to solid
// black every frame) and coverage-stable (see the wobble construction
// below). Only rates/phases reset per cycleSec.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 32);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const dt = 1 / FPS;
  const cx = W / 2, cy = H / 2;
  const halfDiag = Math.sqrt((W / 2) ** 2 + (H / 2) ** 2);

  // Spoke angles, the Archimedean spiral's a/b constants, every bead's
  // fixed (theta, spokeIndex) position, and the base hue are all computed
  // ONCE per video -- the "compute geometry once, only animate bounded
  // per-element wobble/pulse afterward" pattern this pool has established
  // as a reliable default across two dozen prior engines. Spokes reach to
  // the canvas's own half-diagonal so the web fills the full rectangular
  // frame corner to corner without needing any rotation (and therefore
  // without needing the "size the field for a rotating viewport" margin
  // technique at all -- nothing here rotates as a whole).
  let numSpokes, spokeAngles, reach, spiralA, spiralB, turns, thetaMax;
  let beads, hue0, cyclesPerTurn, wobbleAmp;
  function initWeb() {
    numSpokes = Math.max(16, Math.min(34, Math.round(24 * Math.max(0.75, Math.min(1.4, DENSITY)))));
    spokeAngles = [];
    const baseStep = (Math.PI * 2) / numSpokes;
    for (let i = 0; i < numSpokes; i++) {
      spokeAngles.push(i * baseStep + rand(-baseStep * 0.08, baseStep * 0.08));
    }

    reach = halfDiag * 1.02;
    turns = Math.max(6, Math.min(13, Math.round(9 * Math.max(0.75, Math.min(1.4, DENSITY)))));
    spiralA = reach * 0.025;
    thetaMax = turns * Math.PI * 2;
    spiralB = (reach - spiralA) / thetaMax;

    // Coverage-neutral traveling wobble: an integer number of full sine
    // cycles PER TURN (3), so across the exact rendered range [0, thetaMax]
    // -- which is itself an exact integer number of turns -- the wobble
    // completes an exact integer total cycle count regardless of its time-
    // varying phase offset. A sine's integral over any whole number of full
    // periods is exactly zero no matter the phase, so this can never add or
    // remove net radial coverage at any instant, only reshape the curve --
    // the same "phase must span whole cycles across the frame" invariant
    // CLAUDE.md documents for the wave-1 unit-choreography pass.
    cyclesPerTurn = 3;
    wobbleAmp = (spiralB * Math.PI * 2) * 0.16;

    hue0 = rng() * 360;

    // Beads sit at every spoke crossing along the spiral (theta = spoke
    // angle + k full turns), in spiral arc order -- a real Plateau-Rayleigh
    // glue-droplet pattern, simplified to "one per crossing" for a bold,
    // legible dot count rather than the much finer real 1-5mm spacing
    // (the same visualisation-grade, not lab-exact, precedent chladni.html/
    // voderberg.html/widmanstatten.html already established for this pool).
    beads = [];
    for (let k = 0; k < turns; k++) {
      for (let i = 0; i < numSpokes; i++) {
        const theta = spokeAngles[i] + k * Math.PI * 2;
        if (theta > thetaMax) continue;
        beads.push({ theta, spokeIndex: i, turn: k });
      }
    }
    beads.sort((p, q) => p.theta - q.theta);
  }

  function reconfigureMotion() {
    wobbleRate = sgn() * rand(0.5, 0.85) * SPEED;
    pulseRate = sgn() * rand(0.12, 0.22) * SPEED;
  }
  let wobbleRate, pulseRate, wobblePhase0, pulsePhase0;

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initWeb();
  wobblePhase0 = rand(0, Math.PI * 2);
  pulsePhase0 = rand(0, 1);
  reconfigureMotion();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function radiusAt(theta, t) {
    const base = spiralA + spiralB * theta;
    const wobble = wobbleAmp * Math.sin(cyclesPerTurn * theta + wobblePhase0 + t * wobbleRate);
    return base + wobble;
  }

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';

    // Spokes: rigid, static, drawn with a soft glow pass underneath a
    // bright core -- "GLOW IS MANDATORY" per the house-style bloom
    // research (see CLAUDE.md's 2026-09-14 write-up), and a second,
    // genuinely different reason here: keeping every spoke pixel-for-pixel
    // identical between frames means spokes contribute nothing at all to
    // frame-to-frame difference, so the mandatory unit-motion gate is
    // measuring purely the spiral wobble and bead pulse below -- their
    // independent, local, non-rigid signal is not diluted by a spoke
    // rigidly co-rotating with anything.
    const spokeBase = PAL[0];
    for (let i = 0; i < numSpokes; i++) {
      const a = spokeAngles[i];
      const x1 = cx + Math.cos(a) * reach, y1 = cy + Math.sin(a) * reach;
      ctx.strokeStyle = `hsla(${spokeBase[0]}, ${spokeBase[1]}%, ${Math.min(78, spokeBase[2] + 10)}%, 0.28)`;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = `hsl(${spokeBase[0]}, ${spokeBase[1]}%, ${Math.min(70, spokeBase[2] + 4)}%)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.stroke();
    }

    // Capture spiral: sampled finely and stroked as a connected polyline.
    // Spatial (not time-based) hue ripple keyed to theta -- colour richness
    // with no temporal luma trend, the same fix quasicrystal.html/
    // truchet.html already established.
    const step = 0.045;
    ctx.lineWidth = 3;
    let started = false;
    for (let theta = 0; theta <= thetaMax; theta += step) {
      const r = radiusAt(theta, clk);
      const x = cx + Math.cos(theta) * r, y = cy + Math.sin(theta) * r;
      const base = PAL[1 % PAL.length];
      const hue = ((base[0] + hue0 + 26 * Math.sin(5 * theta / turns)) % 360 + 360) % 360;
      ctx.strokeStyle = `hsl(${hue}, ${base[1]}%, ${Math.min(72, base[2] + 6)}%)`;
      if (!started) { ctx.beginPath(); ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();

    // Beads: fixed-length rank-selected window sliding along the arc-
    // ordered bead sequence pulses larger/brighter -- coverage-neutral by
    // construction (the window's SIZE never changes, only its position),
    // the same "fixed-size window, position varies" mechanic chladni.html/
    // hilbertweave.html/dragonfold.html already proved safe.
    const total = beads.length;
    const windowFrac = 0.16;
    const windowLen = Math.max(3, Math.round(total * windowFrac));
    const pos = (((pulsePhase0 + clk * pulseRate) % 1) + 1) % 1;
    const startIdx = Math.floor(pos * total);
    const beadBase = PAL[2 % PAL.length];
    for (let n = 0; n < total; n++) {
      const b = beads[n];
      const distFromWindow = Math.min(
        Math.abs(n - startIdx),
        Math.abs(n - startIdx + total),
        Math.abs(n - startIdx - total)
      );
      const inWindow = distFromWindow < windowLen / 2;
      const pulse = inWindow ? 1 + 0.55 * Math.cos((distFromWindow / (windowLen / 2)) * Math.PI * 0.5) : 1;
      const r = radiusAt(b.theta, clk);
      const x = cx + Math.cos(b.theta) * r, y = cy + Math.sin(b.theta) * r;
      const baseRadius = Math.max(3.5, Math.min(W, H) / (numSpokes + turns * 4));
      const hue = ((beadBase[0] + hue0 + 26 * Math.sin(5 * b.theta / turns)) % 360 + 360) % 360;
      ctx.fillStyle = `hsl(${hue}, ${beadBase[1]}%, ${Math.min(76, beadBase[2] + (inWindow ? 12 : 0))}%)`;
      ctx.beginPath();
      ctx.arc(x, y, baseRadius * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureMotion(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
