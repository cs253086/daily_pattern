<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fluid Marble — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: neon dye swirling through a stable-fluids solver (Stam
// 1999) on a coarse grid, upscaled with smoothing. Several moving injectors
// stir the fluid and drop two-colour neon dye into it; glitter particles are
// carried along by the same velocity field. The dye field is fully
// determined by the seed and the cycle time, so renders are reproducible.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. The whole fluid state resets at each
// cycle boundary (cycleSec), so the flow never saturates over an hour.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  // ---- fluid solver (Stam, stable fluids) -----------------------------
  const GW = 128, GH = 72;
  const SZ = (GW + 2) * (GH + 2);
  const IX = (i, j) => i + (GW + 2) * j;
  const mk = () => new Float32Array(SZ);
  let U = mk(), V = mk(), U0 = mk(), V0 = mk(), PP = mk(), DV = mk();
  const D = [mk(), mk(), mk()], D0 = [mk(), mk(), mk()];
  const DT = 0.12;
  const VISC = 0.00002, DIFF = 0.00008;
  const DYE_DECAY = 0.955;

  function setBnd(b, x) {
    for (let i = 1; i <= GW; i++) {
      x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
      x[IX(i, GH + 1)] = b === 2 ? -x[IX(i, GH)] : x[IX(i, GH)];
    }
    for (let j = 1; j <= GH; j++) {
      x[IX(0, j)] = b === 1 ? -x[IX(1, j)] : x[IX(1, j)];
      x[IX(GW + 1, j)] = b === 1 ? -x[IX(GW, j)] : x[IX(GW, j)];
    }
    x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, GH + 1)] = 0.5 * (x[IX(1, GH + 1)] + x[IX(0, GH)]);
    x[IX(GW + 1, 0)] = 0.5 * (x[IX(GW, 0)] + x[IX(GW + 1, 1)]);
    x[IX(GW + 1, GH + 1)] = 0.5 * (x[IX(GW, GH + 1)] + x[IX(GW + 1, GH)]);
  }

  function linSolve(b, x, x0, a, c) {
    for (let k = 0; k < 6; k++) {
      for (let j = 1; j <= GH; j++) {
        for (let i = 1; i <= GW; i++) {
          x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i - 1, j)] + x[IX(i + 1, j)] + x[IX(i, j - 1)] + x[IX(i, j + 1)])) / c;
        }
      }
      setBnd(b, x);
    }
  }

  function diffuse(b, x, x0, diff, dt) {
    const a = dt * diff * GW * GH;
    linSolve(b, x, x0, a, 1 + 4 * a);
  }

  function advect(b, d, d0, u, v, dt) {
    const dt0 = dt * GW;
    for (let j = 1; j <= GH; j++) {
      for (let i = 1; i <= GW; i++) {
        let x = i - dt0 * u[IX(i, j)];
        let y = j - dt0 * v[IX(i, j)];
        if (x < 0.5) x = 0.5; if (x > GW + 0.5) x = GW + 0.5;
        if (y < 0.5) y = 0.5; if (y > GH + 0.5) y = GH + 0.5;
        const i0 = Math.floor(x), i1 = i0 + 1;
        const j0 = Math.floor(y), j1 = j0 + 1;
        const s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
        d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)])
                    + s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    setBnd(b, d);
  }

  function project(u, v, p, div) {
    const h = 1 / GW;
    for (let j = 1; j <= GH; j++) {
      for (let i = 1; i <= GW; i++) {
        div[IX(i, j)] = -0.5 * h * (u[IX(i + 1, j)] - u[IX(i - 1, j)] + v[IX(i, j + 1)] - v[IX(i, j - 1)]);
        p[IX(i, j)] = 0;
      }
    }
    setBnd(0, div); setBnd(0, p);
    linSolve(0, p, div, 1, 4);
    for (let j = 1; j <= GH; j++) {
      for (let i = 1; i <= GW; i++) {
        u[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h;
        v[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h;
      }
    }
    setBnd(1, u); setBnd(2, v);
  }

  function stepFluid() {
    diffuse(1, U0, U, VISC, DT); diffuse(2, V0, V, VISC, DT);
    project(U0, V0, U, V);
    advect(1, U, U0, U0, V0, DT); advect(2, V, V0, U0, V0, DT);
    project(U, V, U0, V0);
    for (let c = 0; c < 3; c++) {
      diffuse(0, D0[c], D[c], DIFF, DT);
      advect(0, D[c], D0[c], U, V, DT);
      const dc = D[c];
      for (let k = 0; k < SZ; k++) dc[k] *= DYE_DECAY;
    }
  }

  // ---- neon palette and injectors -------------------------------------
  const NEON = [
    [0, 220, 255], [255, 40, 190], [255, 235, 40],
    [70, 255, 130], [150, 70, 255], [0, 120, 255],
  ];

  let injectors = [];
  function initInjectors() {
    injectors = [];
    const n = 7 + Math.floor(rng() * 3);
    for (let k = 0; k < n; k++) {
      injectors.push({
        ax: rand(0.30, 0.46), ay: rand(0.28, 0.42),
        w1: sgn() * rand(0.22, 0.45), w2: sgn() * rand(0.18, 0.40),
        p1: rand(0, 6.283), p2: rand(0, 6.283),
        gain: rand(0.9, 1.5),
        cA: NEON[Math.floor(rng() * NEON.length)],
        cB: NEON[Math.floor(rng() * NEON.length)],
        cp: rand(0, 6.283), cr: sgn() * rand(0.2, 0.5),
      });
    }
  }

  // Glitter particles, advected by the fluid velocity.
  const GLITTER_N = 320;
  let glitter = [];
  function initGlitter() {
    glitter = [];
    for (let k = 0; k < GLITTER_N; k++) {
      glitter.push({ x: rng(), y: rng(), tp: rand(0, 6.283), tr: rand(0.3, 0.9) });
    }
  }

  function clearFluid() {
    for (const a of [U, V, U0, V0, PP, DV]) a.fill(0);
    for (let c = 0; c < 3; c++) { D[c].fill(0); D0[c].fill(0); }
  }

  // Inject force and dye at each injector's position at cycle time tt (seconds).
  function inject(tt) {
    for (const q of injectors) {
      const ph1 = q.w1 * tt + q.p1, ph2 = q.w2 * tt + q.p2;
      const px = 0.5 + q.ax * Math.sin(ph1);
      const py = 0.5 + q.ay * Math.sin(ph2);
      const vx = q.ax * q.w1 * Math.cos(ph1) * q.gain;
      const vy = q.ay * q.w2 * Math.cos(ph2) * q.gain;
      const ci = Math.floor(px * GW) + 1, cj = Math.floor(py * GH) + 1;
      const mix = 0.5 + 0.5 * Math.sin(q.cp + q.cr * tt);
      const col = [0, 1, 2].map((c) => (q.cA[c] * mix + q.cB[c] * (1 - mix)) / 255);
      for (let dj = -3; dj <= 3; dj++) {
        for (let di = -3; di <= 3; di++) {
          const i = ci + di, j = cj + dj;
          if (i < 1 || j < 1 || i > GW || j > GH) continue;
          const w = Math.exp(-(di * di + dj * dj) / 3.5);
          const id = IX(i, j);
          U[id] += vx * w * 0.06;
          V[id] += vy * w * 0.06;
          for (let c = 0; c < 3; c++) D[c][id] += col[c] * w * 0.42;
        }
      }
    }
  }

  function advectGlitter() {
    for (const g of glitter) {
      const i = Math.min(GW, Math.max(1, Math.floor(g.x * GW) + 1));
      const j = Math.min(GH, Math.max(1, Math.floor(g.y * GH) + 1));
      const id = IX(i, j);
      g.x += U[id] * DT;
      g.y += V[id] * DT;
      if (g.x < 0 || g.x >= 1 || g.y < 0 || g.y >= 1) {
        g.x = ((g.x % 1) + 1) % 1; g.y = ((g.y % 1) + 1) % 1;
      }
    }
  }

  // ---- rendering --------------------------------------------------------
  const off = document.createElement('canvas');
  off.width = GW; off.height = GH;
  const octx = off.getContext('2d');
  const img = octx.createImageData(GW, GH);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  function drawFluid() {
    const px = img.data;
    for (let j = 1; j <= GH; j++) {
      for (let i = 1; i <= GW; i++) {
        const id = IX(i, j);
        const o = ((j - 1) * GW + (i - 1)) * 4;
        for (let c = 0; c < 3; c++) {
          const v = 1 - Math.exp(-2.4 * D[c][id]);
          px[o + c] = 255 * v;
        }
        px[o + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(off, 0, 0, W, H);
  }

  function drawGlitter(t) {
    ctx.globalCompositeOperation = 'lighter';
    const s = W / 1280;
    for (const g of glitter) {
      const tw = 0.5 + 0.5 * Math.sin(g.tp + 2 * Math.PI * g.tr * t);
      const a = 0.15 + 0.55 * tw * tw;
      ctx.fillStyle = `rgba(255, 250, 220, ${a.toFixed(3)})`;
      const x = g.x * W, y = g.y * H;
      ctx.fillRect(x, y, 1.6 * s, 1.6 * s);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- frame loop -------------------------------------------------------
  const CYCLE_FRAMES = Math.max(1, Math.round(CYCLE_SEC * FPS));
  window.currentFrame = 0;
  window.TOTAL_FRAMES = Math.round(DURATION * FPS);

  function startCycle() {
    clearFluid();
    initInjectors();
    initGlitter();
    // Warm up the flow before the first visible frame of the cycle.
    for (let w = 0; w < 30; w++) {
      inject((w - 30) / FPS * SPEED);
      stepFluid();
    }
  }

  let started = false;
  window.advanceFrame = function () {
    const f = window.currentFrame;
    const cyc = f % CYCLE_FRAMES;
    if (!started || cyc === 0) { startCycle(); started = true; }
    const tt = cyc / FPS * SPEED;
    inject(tt);
    stepFluid();
    advectGlitter();
    drawFluid();
    drawGlitter(f / FPS);
    window.currentFrame++;
  };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
