<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Mirror — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: INFINITE MIRROR. A vanishing point V drifts slowly. Every
// point of the plane is a copy of a smaller, rotated, alternately mirrored
// version of itself, nested inside a larger copy, all the way to the vanishing
// point. The image is the fixed point of that recursion, so the frame reads as
// a hall of mirrors: nested reflected levels folding in on a moving centre.
//
// Construction (stateless, a pure function of time):
//   z = p - V(t), d = |z|, level L = ln(d) / ln(r(t)), with ratio r in (0,1).
//   k = floor(L) is the level index, f = L - k the position inside the level.
//   Each level is rotated by k*theta(t) and mirrored about the x-axis when k is
//   odd, so the folded angle u in [0, pi] is symmetric within every level.
//   The scalar S = fract(f + Q*u/(2*pi)) (Q = 3 mirror sectors) draws the
//   nested rims (f) and the reflected wedges (u) in one field.
//
// Brightness neutrality by construction: each frame S is RANK-QUANTISED into
// K equal-area bands (exactly 1/K of the pixels per band), so the area mix,
// and hence mean luma, cannot drift as the mirror moves. Every third band is
// black (a fixed 1/3 of the frame), the coloured bands keep fixed hues. The
// field is computed fresh each frame: no accumulation, no whiteout mechanism.
//
// Motion: the vanishing point drifts on a bounded Lissajous loop, the level
// rotation theta breathes, and the ratio r breathes, all on separate periods,
// so the nested levels twist, slide and telescope against one another. Nothing
// resets; the schedules are periodic and bounded, so the hour keeps developing.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32 (4-draw burn-in), no requestAnimationFrame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Mulberry32's first draws for consecutive small seeds are correlated, so burn
  // 4 draws first (same convention as hypnospiral/shockwave/pendulumwave).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  // ---- per-video constants (fixed for the whole video) -------------------------
  const Q = 3;                                       // mirror sectors per level
  const AX = rand(0.10, 0.16), AY = rand(0.08, 0.14); // vanishing-point drift radius
  const TX = rand(34, 52) / SPEED, TY = rand(40, 60) / SPEED;   // drift periods (s)
  const PX0 = rand(0, 2 * Math.PI), PY0 = rand(0, 2 * Math.PI);
  const TH0 = sgn() * rand(0.45, 0.85);              // base twist per level (rad)
  const TH_AMP = rand(0.22, 0.32);                   // twist breathing amplitude
  const TT = rand(22, 34) / SPEED, PT0 = rand(0, 2 * Math.PI);
  const R0 = rand(0.52, 0.6);                        // mean level ratio
  const R_AMP = rand(0.04, 0.06);                    // ratio breathing amplitude
  const TR = rand(26, 38) / SPEED, PR0 = rand(0, 2 * Math.PI);

  // ---- field grid -------------------------------------------------------------
  // Computed at a capped resolution and nearest-upscaled (crisp, house style).
  const CW = Math.min(W, 640);
  const CH = Math.max(1, Math.round(CW * H / W));
  const N = CW * CH;
  const K = 12;                 // equal-area bands
  const NB = 4096;              // histogram bins over S in [0,1)
  const TWO_PI = 2 * Math.PI;

  const PX = new Float32Array(N);
  const PY = new Float32Array(N);
  {
    let i = 0;
    for (let py = 0; py < CH; py++) {
      const y = (CH / 2 - py - 0.5) / (CH / 2);
      for (let px = 0; px < CW; px++) {
        PX[i] = (px + 0.5 - CW / 2) / (CH / 2);
        PY[i] = y;
        i++;
      }
    }
  }

  const off = document.createElement('canvas');
  off.width = CW; off.height = CH;
  const offCtx = off.getContext('2d');
  const img = offCtx.createImageData(CW, CH);
  const data = img.data;

  // ---- colour LUT: K bands ------------------------------------------------------
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  const H0 = PAL[0][0];
  const BAND_S = Math.max(86, Math.min(94, PAL[0][1]));
  const BAND_L = 60;
  const lut = new Uint8ClampedArray(K * 3);
  const isBlack = (k) => k % 3 === 1;          // every third band black (1/3 of frame)
  function buildLUT() {
    for (let k = 0; k < K; k++) {
      if (isBlack(k)) { lut[k * 3] = 0; lut[k * 3 + 1] = 0; lut[k * 3 + 2] = 0; continue; }
      const rgb = hslToRgb(H0 + (k * 360) / K, BAND_S, BAND_L);
      lut[k * 3] = rgb[0]; lut[k * 3 + 1] = rgb[1]; lut[k * 3 + 2] = rgb[2];
    }
  }

  const binOf = new Uint16Array(N);
  const binCount = new Uint32Array(NB);
  const bandOfBin = new Uint8Array(NB);

  function computeField(clk) {
    binCount.fill(0);
    const vx = AX * Math.sin(TWO_PI * clk / TX + PX0);
    const vy = AY * Math.sin(TWO_PI * clk / TY + PY0);
    const th = TH0 + TH_AMP * Math.sin(TWO_PI * clk / TT + PT0);
    const r = R0 + R_AMP * Math.sin(TWO_PI * clk / TR + PR0);
    const lnr = Math.log(r);                          // negative, since r < 1
    for (let i = 0; i < N; i++) {
      const zx = PX[i] - vx, zy = PY[i] - vy;
      const d = Math.max(1e-6, Math.sqrt(zx * zx + zy * zy));
      const L = Math.log(d) / lnr;                    // level, grows toward V
      const k = Math.floor(L);
      const f = L - k;
      let a = Math.atan2(zy, zx) + k * th;
      a -= TWO_PI * Math.floor(a / TWO_PI);           // wrap to [0, 2pi)
      let u = a <= Math.PI ? a : TWO_PI - a;          // mirror-fold to [0, pi]
      if (((k % 2) + 2) % 2 === 1) u = Math.PI - u;   // alternate mirror per level
      const S = f + Q * u / TWO_PI;
      const s = S - Math.floor(S);
      let bin = (s * NB) | 0;
      if (bin >= NB) bin = NB - 1;
      binOf[i] = bin;
      binCount[bin]++;
    }
  }

  // Rank-quantise: bins walked in order of S so each band holds 1/K of pixels.
  function assignBands() {
    let cum = 0;
    for (let b = 0; b < NB; b++) {
      const c = binCount[b];
      const q = N > 0 ? (cum + c / 2) / N : 0;
      bandOfBin[b] = Math.min(K - 1, Math.floor(q * K));
      cum += c;
    }
  }

  function paint() {
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const b3 = bandOfBin[binOf[i]] * 3;
      data[p] = lut[b3]; data[p + 1] = lut[b3 + 1]; data[p + 2] = lut[b3 + 2]; data[p + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, W, H);
  }

  let clk = 0;
  function renderFrame() {
    clk += 1 / FPS;
    buildLUT();
    computeField(clk);
    assignBands();
    paint();
  }

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;
  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
