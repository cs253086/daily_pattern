<!DOCTYPE html>
<html>
<head>
    <title>Generative Art Screensaver</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Seeded PRNG (Mulberry32)
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        // --- URL Param Parsing ---
        const urlParams = new URLSearchParams(window.location.search);
        const getParam = (name, defaultValue, parser = String) => {
            const value = urlParams.get(name);
            return value !== null ? parser(value) : defaultValue;
        };

        const seed = getParam('seed', 0, Number);
        let random = mulberry32(seed);

        const width = getParam('width', 1920, Number);
        const height = getParam('height', 1080, Number);
        const fps = getParam('fps', 24, Number);
        const duration = getParam('duration', 3600, Number);
        const speed = getParam('speed', 1.0, Number);
        const density = getParam('density', 1.0, Number);
        const cycleSec = getParam('cycleSec', 90, Number); // Default to 90 seconds if not provided

        // --- Global State ---
        window.READY = false;
        window.TOTAL_FRAMES = Math.round(duration * fps);
        window.currentFrame = 0;
        const dt = 1 / fps;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = width;
        canvas.height = height;

        ctx.globalCompositeOperation = 'lighter'; // Additive blending
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // --- Core Engine Logic ---

        // Palette Generation (3-6 colors)
        let primaryHue = random() * 360;
        const paletteSize = Math.floor(random() * 4) + 3; // 3 to 6 colors
        const palette = [];
        for (let i = 0; i < paletteSize; i++) {
            let hueOffset = (i / paletteSize) * 360 * (0.4 + random() * 0.2); // Spread hues
            let hue = (primaryHue + hueOffset) % 360;
            palette.push({ h: hue, s: 70 + random() * 25, l: 50 + random() * 10 }); // Saturated colors
        }

        // Mandala parameters
        const numArms = Math.floor(random() * 4) * 2 + 6; // 6, 8, 10, 12 arms
        const numLayers = Math.floor(random() * 3) + 3; // 3 to 5 layers
        const elementCount = Math.floor(density * (random() * 10 + 20)); // Number of elements per layer
        const baseLineWidth = (random() * 0.5 + 1.0) * density;
        const rotationSpeed = (random() * 0.4 + 0.8) * speed * (random() > 0.5 ? 1 : -1); // rad/s

        // Elements
        const elements = [];
        for (let i = 0; i < numLayers; i++) {
            const layerElements = [];
            const layerRadiusMultiplier = 0.2 + (i / numLayers) * (0.8 - (random() * 0.2));
            const layerRotationOffset = random() * Math.PI * 2;
            const layerOscillationMagnitude = (random() * 0.2 + 0.1);
            const layerOscillationFreq = (random() * 0.5 + 1.0) * speed;

            for (let j = 0; j < elementCount; j++) {
                const elementColor = palette[Math.floor(random() * palette.length)];
                const startAngle = random() * Math.PI * 2;
                const endAngle = startAngle + (random() * 0.5 + 0.2) * Math.PI; // Length of arc segment
                const radius = (random() * 0.1 + 0.05) * Math.min(width, height) * 0.5;
                const phaseOffset = random() * Math.PI * 2;
                const speedMult = (random() * 0.5 + 0.5) * speed;
                const direction = random() > 0.5 ? 1 : -1;

                layerElements.push({
                    color: elementColor,
                    startAngle: startAngle,
                    endAngle: endAngle,
                    radius: radius,
                    phaseOffset: phaseOffset,
                    speedMult: speedMult,
                    direction: direction,
                    baseHue: elementColor.h,
                    hueShiftSpeed: (random() * 0.05 + 0.02) * speed * (random() > 0.5 ? 1 : -1),
                    oscillationPhase: random() * Math.PI * 2,
                    oscillationSpeed: (random() * 0.5 + 1.0) * speed,
                });
            }
            elements.push({
                layerElements: layerElements,
                radiusMultiplier: layerRadiusMultiplier,
                rotationOffset: layerRotationOffset,
                oscillationMagnitude: layerOscillationMagnitude,
                oscillationFreq: layerOscillationFreq,
            });
        }

        // Mandala draw function
        function drawMandala(time) {
            ctx.clearRect(0, 0, width, height); // Clear every frame

            ctx.save();
            ctx.translate(width / 2, height / 2);

            const globalRotation = time * rotationSpeed;

            elements.forEach(layer => {
                const layerCurrentRotation = globalRotation + layer.rotationOffset;
                const layerOscillation = Math.sin(time * layer.oscillationFreq) * layer.oscillationMagnitude;

                layer.layerElements.forEach(el => {
                    ctx.save();
                    ctx.rotate(layerCurrentRotation * el.speedMult * el.direction);

                    const currentHue = (el.baseHue + time * el.hueShiftSpeed) % 360;
                    const saturation = el.color.s;
                    const lightness = el.color.l;
                    ctx.strokeStyle = `hsla(${currentHue}, ${saturation}%, ${lightness}%, 0.15)`; // Main stroke, slightly transparent
                    ctx.lineWidth = baseLineWidth;

                    // Draw inner, brighter core
                    ctx.beginPath();
                    for (let i = 0; i < numArms; i++) {
                        const armAngle = (i / numArms) * Math.PI * 2;
                        const effectiveRadius = Math.min(width, height) * 0.5 * layer.radiusMultiplier * (1 + layerOscillation * Math.sin(el.oscillationPhase + time * el.oscillationSpeed));

                        const p1x = Math.cos(armAngle + el.startAngle) * (effectiveRadius + el.radius);
                        const p1y = Math.sin(armAngle + el.startAngle) * (effectiveRadius + el.radius);
                        const p2x = Math.cos(armAngle + el.endAngle) * (effectiveRadius + el.radius);
                        const p2y = Math.sin(armAngle + el.endAngle) * (effectiveRadius + el.radius);

                        ctx.moveTo(p1x, p1y);
                        ctx.lineTo(p2x, p2y);

                        // Mirrored segment
                        const p3x = Math.cos(-armAngle + el.startAngle) * (effectiveRadius + el.radius);
                        const p3y = Math.sin(-armAngle + el.startAngle) * (effectiveRadius + el.radius);
                        const p4x = Math.cos(-armAngle + el.endAngle) * (effectiveRadius + el.radius);
                        const p4y = Math.sin(-armAngle + el.endAngle) * (effectiveRadius + el.radius);
                        ctx.moveTo(p3x, p3y);
                        ctx.lineTo(p4x, p4y);
                    }
                    ctx.stroke();

                    // Draw outer bloom/glow
                    ctx.strokeStyle = `hsla(${currentHue}, ${saturation}%, ${lightness}%, 0.05)`; // Wider, softer stroke
                    ctx.lineWidth = baseLineWidth * 3;
                    ctx.stroke();

                    ctx.restore();
                });
            });

            ctx.restore();
        }

        window.advanceFrame = function() {
            const time = window.currentFrame * dt;
            drawMandala(time);
            window.currentFrame++;
        };

        window.advanceFrames = function(n) {
            for (let i = 0; i < n; i++) {
                window.advanceFrame();
            }
        };

        // Delay READY to handle potential WebGL context loss (even for Canvas2D, good practice)
        setTimeout(() => {
            window.READY = true;
        }, 100); // Small delay
    </script>
</body>
</html>
