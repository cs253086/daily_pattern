<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starburst — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, distinct from geometric.html/grid.html/
// kaleidoscope.html: a small stack of nested rotating STAR polygons
// (concave, pointed) layered with additive fill so overlaps build bright
// moiré cores, no radial spoke lattice (that's geometric.html's signature).
// Crisp straight edges, strong point symmetry, luminous.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rotation rates, cheap vector
// strokes/fills. Redraws each frame (no accumulation, no whiteout risk):
// glow comes from additive overlap of a few nested stars within one frame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 40);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // A "star" is a concave N-pointed star polygon (alternating outer/inner
  // radius) at some scale, spinning at its own rate.
  let stars, hue0;
  function config() {
    hue0 = rng() * 360;
    // Fixed count (not randomised): a variable star count changes total
    // additive overlap area, which changes overall frame brightness enough
    // between cycles to look like a brightness "trend" across the ~7 cycles
    // in validate.js's test window, even though nothing ever accumulates
    // across frames (full clear every frame). Keep count fixed and vary
    // everything else (points/radii/rotation/hue) for variety instead.
    const n = 4;
    stars = [];
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      stars.push({
        points: randInt(5, 9),
        outerR: t * minDim * 0.44,
        innerRatio: rand(0.38, 0.55),
        rot: rng() * Math.PI * 2,
        // Guaranteed minimum magnitude with random sign -- never let a star
        // sit nearly still (see kaleidoscope.html/geometric.html for why).
        rotRate: (rng() < 0.5 ? -1 : 1) * rand(0.5, 1.3) * (1 - t * 0.35),
        pulseRate: rand(0.6, 1.4),
        colorIdx: i % PAL.length,
      });
    }
  }

  // Build a star polygon path (concave, alternating outer/inner vertices).
  function starPath(r, points, innerRatio, rot) {
    ctx.beginPath();
    const n = points * 2;
    for (let i = 0; i <= n; i++) {
      const idx = i % n;
      const rad = (idx % 2 === 0) ? r : r * innerRatio;
      const a = rot + (idx / n) * Math.PI * 2;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  config();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    // Crisp geometry: clear each frame (no smear, no whiteout risk).
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const lwThin = Math.max(1, minDim / 900);

    for (const s of stars) {
      const r = s.outerR * (0.94 + 0.06 * Math.sin(clk * s.pulseRate));
      const rot = s.rot + clk * s.rotRate;
      const base = PAL[s.colorIdx];
      const hue = ((base[0] + hue0 * 0.05 + clk * 5) % 360 + 360) % 360;

      // Low-alpha additive fill first (layers build brighter where stars
      // overlap -- safe: this happens WITHIN one freshly-cleared frame, it
      // never carries over to the next).
      starPath(r, s.points, s.innerRatio, rot);
      ctx.fillStyle = `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.16)`;
      ctx.fill();

      // Crisp bright edge + soft wide edge on top, like the other curated
      // engines, so the outline itself reads luminous.
      starPath(r, s.points, s.innerRatio, rot);
      ctx.strokeStyle = `hsla(${hue}, ${base[1]}%, ${Math.min(82, base[2] + 14)}%, 0.9)`;
      ctx.lineWidth = lwThin * 2.0;
      ctx.stroke();
      ctx.strokeStyle = `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.22)`;
      ctx.lineWidth = lwThin * 5.5;
      ctx.stroke();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
