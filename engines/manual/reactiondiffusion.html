<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reaction-Diffusion Skin Pattern — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "a random featured image" --
// deliberately picked as the pool's most under-used category recently, only
// orbweb.html/phasespikes.html shipped from it before). An open WebSearch
// for a striking macro/scientific-imaging subject surfaced the EMPEROR
// ANGELFISH (Pomacanthus imperator) skin stripe pattern, and the landmark
// real experiment behind it: Kondo & Asai, "A reaction-diffusion wave on
// the skin of the marine angelfish Pomacanthus," Nature 376, 765-768
// (1995) -- the fish's stripes aren't a fixed painted pattern, they are
// continuously generated and REARRANGED (splitting, merging, shifting) by
// a Turing reaction-diffusion system, confirmed by seeding a real
// simulation from a photographed pattern and correctly PREDICTING the
// fish's future stripe layout months later. Follow-up: "Stripe formation
// in juvenile Pomacanthus explained by a generalized Turing mechanism with
// chemotaxis," PNAS 96(10):5549 (1999). Background on the Turing/
// activator-inhibitor mechanism behind animal coat patterns generally:
// https://plus.maths.org/content/how-leopard-got-its-spots. The concrete
// numerical model rendered here is the Gray-Scott reaction-diffusion
// system, the standard widely-used discretisation of Turing's mechanism
// (https://itp.uni-frankfurt.de/~gros/StudentProjects/Projects_2020/projekt_schulz_kaefer/,
// https://limbnet.embl.es/tutorials/gray-scott/), with feed/kill-rate
// presets drawn from Pearson's parameter atlas, the standard reference for
// which (F,k) values give spots vs. stripes vs. "mitosis" self-splitting
// spots (http://www.mrob.com/pub/comp/xmorphia/index.html).
//
// A genuinely different construction PRINCIPLE from every other engine in
// the pool -- the pool's FIRST continuous PDE simulation. Not a static
// field sampled/thresholded fresh each frame (chladni.html's eigenmode
// zero-crossing, phasespikes.html's 3-wave maxima, moire.html's two
// rotating lattices -- all closed-form functions of (x,y,t) with no
// history); not a discrete local-rule automaton (automaton.html's binary
// rule-90/150 lookup on a wrapped ring -- Gray-Scott is a continuous-
// valued, coupled two-field PDE, not a binary cellular rule); not
// particle-based sequential accretion (frostgrowth.html's DLA random
// walkers, precomputed once and replayed as a time-lapse -- reaction-
// diffusion has no discrete particles, it is a continuous field that
// self-organises via genuine local PDE dynamics, and unlike DLA (which
// only ever accretes) it is NON-MONOTONIC: spots split AND merge, stripes
// both lengthen and dissolve, in continuous competition, forever). Not a
// substitution/subdivision tiling, sieve, L-system, or proximity
// partition -- no discrete geometric rule at all; the pattern is an
// emergent statistical consequence of a feed/kill-rate balance, reached
// via diffusion equilibrium rather than any authored rule.
//
// UNIT-LEVEL MOTION IS INHERENT TO THE PHYSICS, not a choreography layer
// bolted on afterward (unlike automaton.html/frostgrowth.html, which each
// needed careful cycle-length tuning or an added motion mechanism). A
// Gray-Scott field continuously writhes on its own: spots visibly drift,
// split into two, and merge back into one; stripe segments visibly
// lengthen, kink, and reconnect. This is the literal phenomenon Kondo &
// Asai photographed, and is exactly the "basic units move relative to
// each other" dynamic CLAUDE.md's 2026-09-10 standing requirement asks
// for -- here it falls out of the underlying physics for free, with no
// separate wobble/pulse mechanism needed at all. That said, this motion
// is genuinely SLOW at the field's natural per-step rate (measured
// offline: mean |delta v| per step is tiny and grows roughly linearly
// with step count against the field's own variance), so a much higher
// per-frame substep count than this pool's other engines is needed for
// the motion to actually register as visible -- see substeps below.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. `cycleSec` is accepted per the engine
// contract but deliberately UNUSED: mean concentration (aggregate
// brightness) stays flat over arbitrarily long spans (drift well under
// 0.002 over a full hour-equivalent), so there is no whiteout/brightness-
// drift risk to periodically reset against -- but see the periodic BLOB
// INJECTION mechanism below, which is a real, necessary fix for a
// DIFFERENT problem (motion, not brightness) found only by testing the
// full 300s validator window, not a coverage-neutral "reconfigure".
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  function hsl2rgb(h, s, l) {
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  function luma(col) {
    const [r, g, b] = hsl2rgb(col[0], col[1], col[2]);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function hueLerp(h0, h1, t) {
    let d = ((h1 - h0 + 540) % 360) - 180;
    return ((h0 + d * t) % 360 + 360) % 360;
  }

  // --- Gray-Scott reaction-diffusion, verified offline before writing
  // this engine (see the 2026-09-25 CLAUDE.md write-up): explicit-Euler
  // 5-point-Laplacian stability confirmed (no NaN across 5000+ step runs
  // at every tested preset), the three preset (F,k) regimes below all
  // converge to their intended pattern class (not blank/saturated) with a
  // warm-up plateau by ~6000 steps, and mean concentration stays flat
  // (drift < 0.002) across a full hour-equivalent (172800 steps at
  // substeps=2/frame) for every preset -- no periodic reset needed.
  const GW = Math.max(60, Math.round(200 * Math.max(0.7, Math.min(1.3, DENSITY))));
  const GH = Math.max(34, Math.round(GW * 113 / 200));
  const Du = 0.16, Dv = 0.08, DT = 1.0;
  const PRESETS = [
    { F: 0.030, k: 0.062, name: 'spots' },
    { F: 0.030, k: 0.058, name: 'stripes' },
    { F: 0.028, k: 0.062, name: 'mitosis' },
  ];

  let u, v, u2, v2;
  let bgCol, fgCol, vMax;
  let substeps;
  let stepCount = 0;
  let winMask, winCX, winCY, winR, bgR, bgG, bgB;

  function seedBlobs(n) {
    for (let i = 0; i < n; i++) {
      const cx = Math.floor(rng() * GW), cy = Math.floor(rng() * GH);
      const r = 3 + Math.floor(rng() * 4);
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r * r) continue;
          const x = ((cx + dx) % GW + GW) % GW, y = ((cy + dy) % GH + GH) % GH;
          v[y * GW + x] = 1;
          u[y * GW + x] = 0.5;
        }
      }
    }
  }

  // Periodic re-seeding fix for a real bug found only by testing motion
  // across the validator's FULL 300s sampled window, not just shortly
  // after warm-up (see the 2026-09-25 CLAUDE.md write-up): a mature
  // Gray-Scott field undergoes genuine Ostwald-ripening COARSENING -- its
  // own internal reorganisation rate decreases substantially (~5x
  // measured offline) as elapsed simulation time grows past warm-up, even
  // though aggregate brightness (mean v) stays flat throughout. A field
  // sampled early looks lively; the same field sampled deep into a long
  // render looks nearly frozen, purely from this physical settling
  // process. Continuous small per-step noise was tried and measured
  // insufficient (still ~5x slowdown, just delayed). What works, verified
  // by an offline sweep of injection cadence/magnitude against the exact
  // 2880-step (=1.5s at substeps=80) window validate.js itself measures:
  // injecting a few fresh small blobs (the same mechanism as the initial
  // seedBlobs, at a smaller boost) every INJECT_EVERY PDE steps. This
  // specific cadence/magnitude was the one candidate of three tested that
  // actually PLATEAUS rather than continuing to decay (0.039 -> 0.024 ->
  // 0.025 -> 0.022 -> 0.022 over the offline-equivalent of a 300s window,
  // vs. a 300-step/n=2 candidate that kept declining to 0.013 and a
  // 150-step/n=3 candidate that kept declining to 0.017) -- a sustained
  // motion floor deep into the render matters far more than a high but
  // decaying value near the start, since validate.js samples across the
  // whole window. Re-uses the deterministic rng() stream (not Math.random)
  // so this stays fully seed-reproducible, and boosts v/u by less than
  // seedBlobs' initial full-strength blobs so it reads as the field's own
  // continued activity rather than a visible "pop".
  const INJECT_EVERY = 260, INJECT_N = 7, INJECT_RMIN = 2, INJECT_RMAX = 5;
  // Injected blobs are placed inside a random WINDOW's own disk (not
  // anywhere on the full simulation grid) so every injection's motion
  // contribution actually lands somewhere visible -- see the window-mask
  // "petri dish" composition below. Falls back to a full-grid random
  // point if called before the window layout exists (defensive only;
  // initSim always computes windows before any injection call).
  function injectBlobs(n, rMin, rMax) {
    for (let i = 0; i < n; i++) {
      let cx, cy;
      if (winCX && winCX.length) {
        const wi = Math.floor(rng() * winCX.length);
        const ang = rng() * Math.PI * 2, rad = Math.sqrt(rng()) * winR[wi] * 0.75;
        cx = Math.round(winCX[wi] + Math.cos(ang) * rad);
        cy = Math.round(winCY[wi] + Math.sin(ang) * rad);
      } else {
        cx = Math.floor(rng() * GW); cy = Math.floor(rng() * GH);
      }
      const r = rMin + Math.floor(rng() * (rMax - rMin + 1));
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r * r) continue;
          const x = ((cx + dx) % GW + GW) % GW, y = ((cy + dy) % GH + GH) % GH;
          const idx = y * GW + x;
          v[idx] = Math.min(1, v[idx] + 0.5);
          u[idx] = Math.max(0, u[idx] - 0.25);
        }
      }
    }
  }
  function stepWithInject(F, k) {
    step(F, k);
    stepCount++;
    if (stepCount % INJECT_EVERY === 0) injectBlobs(INJECT_N, INJECT_RMIN, INJECT_RMAX);
  }

  function step(F, k) {
    for (let y = 0; y < GH; y++) {
      const yN = (y - 1 + GH) % GH, yS = (y + 1) % GH;
      for (let x = 0; x < GW; x++) {
        const xW = (x - 1 + GW) % GW, xE = (x + 1) % GW;
        const i = y * GW + x;
        const lapU = u[yN * GW + x] + u[yS * GW + x] + u[y * GW + xW] + u[y * GW + xE] - 4 * u[i];
        const lapV = v[yN * GW + x] + v[yS * GW + x] + v[y * GW + xW] + v[y * GW + xE] - 4 * v[i];
        const uu = u[i], vv = v[i];
        const reaction = uu * vv * vv;
        u2[i] = uu + (Du * lapU - reaction + F * (1 - uu)) * DT;
        v2[i] = vv + (Dv * lapV + reaction - (F + k) * vv) * DT;
      }
    }
    let t;
    t = u; u = u2; u2 = t;
    t = v; v = v2; v2 = t;
  }

  let presetF, presetK;

  function initSim() {
    u = new Float32Array(GW * GH).fill(1);
    v = new Float32Array(GW * GH).fill(0);
    u2 = new Float32Array(GW * GH);
    v2 = new Float32Array(GW * GH);

    // "Petri dish" window layout: several independent circular ports onto
    // the SAME underlying Gray-Scott field, in a near-regular jittered
    // grid -- the same multi-instance composition technique this pool's
    // dendrite.html/hilbertweave.html/phyllotaxis.html already established
    // for an identical problem (a single seamless full-frame field reads
    // as generically "fine isotropic all-over texture with no strong
    // symmetry", too close to widmanstatten.html's own oblique crosshatch
    // in the mandatory novelty gate -- both are full-bleed, no-black-
    // background compositions with the same near-flat radial/orientation
    // profile; see the 2026-09-25 CLAUDE.md write-up for the measured
    // numbers). Splitting the single field into several disks, each a
    // genuinely different local patch of the same simulation (Gray-Scott
    // varies spatially, so windows show different sub-patterns for free),
    // creates real periodicity/coverage structure and true black negative
    // space that a single continuous field cannot -- while the underlying
    // PDE, warm-up, dead-zone retry, and coarsening-fix injection
    // mechanism (all independently verified above) are UNCHANGED, since
    // this only changes what gets rendered, not how the field evolves.
    const nWinX = Math.max(2, Math.round(3 * Math.max(0.7, Math.min(1.3, DENSITY))));
    const nWinY = Math.max(2, Math.round(2 * Math.max(0.7, Math.min(1.3, DENSITY))));
    const cellW = GW / nWinX, cellH = GH / nWinY;
    winCX = []; winCY = []; winR = [];
    for (let jy = 0; jy < nWinY; jy++) {
      for (let jx = 0; jx < nWinX; jx++) {
        winCX.push((jx + 0.5) * cellW + rand(-0.1, 0.1) * cellW);
        winCY.push((jy + 0.5) * cellH + rand(-0.1, 0.1) * cellH);
        winR.push(Math.min(cellW, cellH) * rand(0.3, 0.36));
      }
    }
    winMask = new Uint8Array(GW * GH);
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        for (let wi = 0; wi < winCX.length; wi++) {
          const dx = x - winCX[wi], dy = y - winCY[wi];
          if (dx * dx + dy * dy <= winR[wi] * winR[wi]) { winMask[y * GW + x] = 1; break; }
        }
      }
    }

    // Jitter magnitude verified offline (see the 2026-09-25 CLAUDE.md
    // write-up): a first +/-0.001 symmetric jitter on BOTH F and k crossed
    // a real Gray-Scott "dead zone" boundary for the mitosis preset. An
    // offline sweep of the jitter box (at one fixed blob layout) found k
    // is the sensitive axis and narrowed it to +/-0.0004 -- but a REAL
    // production seed still collapsed to a flat field even inside that
    // narrowed box, because the dead-zone boundary also depends on the
    // seeded blobs' own count/size/placement, which the fixed-blob-layout
    // sweep never varied. Narrowing jitter further chases a moving target
    // rather than fixing the actual problem, so this is handled instead
    // by a self-correcting retry loop below: DETECT collapse after
    // warm-up (by measuring the field directly) and nudge k away from the
    // kill boundary, deterministically, rather than trying to perfectly
    // characterise a boundary that depends on more variables than (F,k)
    // alone.
    const preset = PRESETS[Math.floor(rng() * PRESETS.length)];
    presetF = preset.F + rand(-0.001, 0.001);
    presetK = preset.k + rand(-0.0004, 0.0004);
    const blobCount = 5 + Math.floor(rng() * 4);

    // Warm-up: run past the initial transient (offline-measured plateau
    // ~6000 steps) synchronously before READY, so playback starts already
    // in the mature, statistically-stationary regime rather than showing
    // an early period that looks structurally different from the rest.
    // Self-correcting retry: if the field decayed to a near-flat state
    // (a real, measured failure mode -- see comment above), nudge k down
    // (away from the kill-rate boundary, back toward this preset's
    // verified-good interior) and re-seed/re-run, up to a few attempts.
    let attemptK = presetK;
    for (let attempt = 0; attempt < 5; attempt++) {
      u.fill(1); v.fill(0);
      seedBlobs(blobCount);
      stepCount = 0;
      for (let s = 0; s < 6200; s++) stepWithInject(presetF, attemptK);
      let vStd = 0, vMean = 0;
      for (let i = 0; i < v.length; i++) vMean += v[i];
      vMean /= v.length;
      for (let i = 0; i < v.length; i++) vStd += (v[i] - vMean) ** 2;
      vStd = Math.sqrt(vStd / v.length);
      if (vStd > 0.02) { presetK = attemptK; break; }
      attemptK -= 0.0006;
    }

    // Colour scheme: background (low-v / u-dominant regions, AND every
    // cell outside the window mask above) is pulled to NEAR-BLACK
    // (hue/saturation kept from a palette entry for a subtle tint,
    // lightness forced low) instead of a mid-lightness palette colour.
    // Found by running the mandatory novelty gate (see the 2026-09-25
    // CLAUDE.md write-up): a first attempt darkened ONLY the background
    // colour, without the window mask, reasoning that a mid-lightness
    // background meant literally every pixel exceeded validate.js's/
    // fingerprint.js's g>12 "lit" threshold, collapsing 4 of the
    // descriptor's 30 features (coverage, blobCount, blobSizeCV,
    // largestBlobFrac) to the exact same saturated values (1.0/1/0/1.0)
    // shared by widmanstatten/voronoimosaic/stripweave. Measured
    // INSUFFICIENT on its own (distance dropped further, 0.529 -> 0.469):
    // fingerprint.js downsamples the rendered canvas well below this
    // engine's own simulation-grid resolution before measuring luma, so
    // for a genuinely space-filling maze/stripe texture nearly every
    // downsampled sample pixel blends some foreground into it regardless
    // of how dark the pure background colour is -- coverage stayed
    // exactly 1.0. The window mask above is what actually fixes it: large
    // BLOCKS of true uniform background between windows survive
    // downsampling intact, genuinely breaking the coverage/blob
    // saturation, and (real bonus, not just a gate workaround) a true
    // dark background also reads as more vivid/high-contrast per the
    // house style's own preference for bold shapes against clear negative
    // space. Foreground (high-v spots/stripes) keeps
    // a normal vivid palette lightness, nudged apart from the background
    // to a guaranteed minimum luma gap -- the same fix herringbone.html's
    // write-up established for two hue-distinct colours that can still
    // read as near-flat to validate.js's luma-based structure check.
    const bgIdx = Math.floor(rng() * PAL.length);
    let fgIdx = Math.floor(rng() * PAL.length);
    if (fgIdx === bgIdx) fgIdx = (fgIdx + 1) % PAL.length;
    bgCol = [PAL[bgIdx][0], PAL[bgIdx][1], rand(6, 13)];
    fgCol = PAL[fgIdx].slice();
    const MIN_LUMA_GAP = 55;
    for (let i = 0; i < 40 && Math.abs(luma(fgCol) - luma(bgCol)) < MIN_LUMA_GAP; i++) {
      if (luma(fgCol) >= luma(bgCol)) {
        fgCol[2] = Math.min(78, fgCol[2] + 2);
        bgCol[2] = Math.max(3, bgCol[2] - 2);
      } else {
        bgCol[2] = Math.min(20, bgCol[2] + 2);
        fgCol[2] = Math.max(22, fgCol[2] - 2);
      }
    }
    [bgR, bgG, bgB] = hsl2rgb(bgCol[0], bgCol[1], bgCol[2]);

    // vMax calibrates the colour lookup to this preset's actual observed
    // range (offline-measured per preset: spots ~0.39, stripes ~0.35,
    // mitosis ~0.38) rather than an assumed [0,1] range that would leave
    // the colour mapping under-saturated for real Gray-Scott output.
    vMax = 0.40;

    // Substep count verified offline (see the 2026-09-25 CLAUDE.md
    // write-up): the mature field's own per-step structural change is
    // tiny and grows roughly LINEARLY with step count (measured
    // ~0.0000107 mean |delta v| per step against a field std of ~0.10),
    // so a low substep count (originally 2/frame, matching several prior
    // engines' per-frame motion conventions) left both validate.js's
    // fastMotion (1.5s window) and compositionDrift (300s window) checks
    // far short of their floors on nearly every seed -- this is a real
    // property of Gray-Scott's mature-regime dynamics, not a tuning
    // oversight to nudge slightly. A substep count in the tens to
    // hundreds per frame is needed for genuinely-visible motion; render
    // cost stays cheap regardless (the PDE step is ~0.2ms/step even at
    // this substep count, since the grid itself, not the canvas, is the
    // simulation's real cost driver).
    substeps = Math.max(20, Math.min(150, Math.round(80 * SPEED)));

    // Precomputed colour LUT (bgCol/fgCol are fixed per video): avoids
    // calling hsl2rgb() per grid cell per frame (22000+ cells), the real
    // per-frame cost driver measured offline -- see the render-technique
    // note below.
    const LUT_N = 512;
    lutR = new Uint8ClampedArray(LUT_N);
    lutG = new Uint8ClampedArray(LUT_N);
    lutB = new Uint8ClampedArray(LUT_N);
    for (let i = 0; i < LUT_N; i++) {
      const t = i / (LUT_N - 1);
      const h = hueLerp(bgCol[0], fgCol[0], t);
      const sat = bgCol[1] + (fgCol[1] - bgCol[1]) * t;
      const light = bgCol[2] + (fgCol[2] - bgCol[2]) * t;
      const [r, g, b] = hsl2rgb(h, sat, light);
      lutR[i] = r; lutG[i] = g; lutB[i] = b;
    }
  }
  let lutR, lutG, lutB;

  initSim();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  // Render technique: draw into a small offscreen canvas at the SIMULATION
  // grid's own resolution (one pixel per cell), then a single scaled
  // drawImage() with imageSmoothingEnabled=false blows it up to the full
  // output size with crisp (not blurred) cell blocks -- the standard fast
  // path for a block-grid engine. A first version called fillRect() once
  // per grid cell (22000+ calls/frame) and measured 55ms/frame in a real
  // browser (~79min projected for a full hour, uncomfortably close to the
  // CI budget); this LUT+ImageData+one-drawImage approach replaces that
  // with one putImageData() and one drawImage() call per frame (measured
  // ~0.9-15ms/frame depending on substep count, comfortably inside budget).
  const off = document.createElement('canvas');
  off.width = GW; off.height = GH;
  const offCtx = off.getContext('2d');
  const imgData = offCtx.createImageData(GW, GH);
  ctx.imageSmoothingEnabled = false;

  function renderFrame() {
    for (let s = 0; s < substeps; s++) stepWithInject(presetF, presetK);

    const data = imgData.data;
    for (let i = 0; i < GW * GH; i++) {
      const o = i * 4;
      if (!winMask[i]) {
        data[o] = bgR; data[o + 1] = bgG; data[o + 2] = bgB; data[o + 3] = 255;
        continue;
      }
      const t = Math.max(0, Math.min(1, v[i] / vMax));
      const li = Math.round(t * (lutR.length - 1));
      data[o] = lutR[li]; data[o + 1] = lutG[li]; data[o + 2] = lutB[li]; data[o + 3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(off, 0, 0, GW, GH, 0, 0, W, H);
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
