<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hankin Star Lattice — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find
// (today's creative-research routine, category "traditional textile/
// tiling/ornament tradition"): Islamic star patterns built by HANKIN'S
// "POLYGONS IN CONTACT" construction (Hankin 1925; formalised for computers
// by Kaplan, "Islamic star patterns from polygons in contact", Graphics
// Interface 2005). Sources: https://tilingsearch.mit.edu/RosetteAnalysis.pdf ;
// https://archive.bridgesmathart.org/2000/bridges2000-105.pdf ;
// https://github.com/evoluteur/islamic-patterns (method description).
//
// Construction: on a tiling of regular hexagons, from the midpoint M of each
// edge a straight strap leaves at a fixed CONTACT ANGLE theta to that edge,
// heading toward one endpoint. In each tile the strap from M_k toward corner
// V and the strap from M_{k+1} toward the same corner meet on the corner
// bisector at X_V, so the straps touch (contact, not crossing). Each tile
// therefore carries a closed 12-gon star: midpoints are the outer tips and
// the contact points X are the inner vertices. Two straps through a shared
// midpoint join the neighbouring stars.
//
// A genuinely different construction PRINCIPLE from every other engine in
// the pool: not a filled tile field (grid, tessellation, mashrabiya), not
// the straight parallel slats of kumiko, not rotating polygons (geometric,
// starburst), not a continuous curve. The picture is a lattice of stars
// whose STRAP geometry is generated by a single angle.
//
// MOTION: the contact angle of each tile breathes on a rank-fraction-phased
// travelling wave. Tiles are ranked by distance from centre and an odd,
// sharpened wave (sign * sqrt|sin|, K = 4 or 5 bands) is evaluated at each
// rank, so the summed angle deviation is zero-mean at every instant and deep
// and shallow stars march outward as concentric bands. Each star's tips slide
// relative to their neighbours (unit-level non-rigid change), with no
// whole-field rotation. Each tile's fill colour is fixed by its ring (hex
// distance from centre), an axis the motion never disturbs.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);
  const dt = 1 / FPS;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Burn 4 draws first -- Mulberry32's first outputs for small consecutive
  // seeds are correlated (pendulumwave.html/spinbounce.html's own fix).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  let PAL = parseColors() || palettes[resolvePalette()];
  if (PAL.length < 5) {
    const out = [];
    for (let i = 0; i < 5; i++) out.push(PAL[i % PAL.length]);
    PAL = out;
  }

  // Layout and motion parameters, fixed once per video.
  const DEG = Math.PI / 180;
  let A_HEX, tiles, theta0, thetaAmp, waveK, phase0 = 0, rate = 1, phase = 0;
  function initLayout() {
    // Hexagon circumradius sized so about 7 tiles span the width.
    A_HEX = Math.max(W / (7 * Math.sqrt(3)), H / (4.6 * 1.5)) / Math.max(0.6, Math.min(1.6, DENSITY));
    const cx0 = W / 2, cy0 = H / 2;
    const rowsHalf = Math.ceil(H / (1.5 * A_HEX)) + 3;
    const colsHalf = Math.ceil(W / (Math.sqrt(3) * A_HEX)) + 3;
    const raw = [];
    for (let j = -rowsHalf; j <= rowsHalf; j++) {
      for (let i = -colsHalf; i <= colsHalf; i++) {
        const x = cx0 + Math.sqrt(3) * A_HEX * (i + (j & 1) * 0.5);
        const y = cy0 + 1.5 * A_HEX * j;
        // Keep tiles whose star reaches the frame; the rest are invisible.
        if (x < -A_HEX * 2 || x > W + A_HEX * 2 || y < -A_HEX * 2 || y > H + A_HEX * 2) continue;
        // Hex-distance ring from the frame centre (cube coordinates).
        const q = i - (j - (j & 1)) / 2, r = j;
        const ring = Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r));
        raw.push({ x, y, ring, idx: 0 });
      }
    }
    // Rank by distance from the frame centre: the travelling wave then
    // marches outward as concentric bands of deep and shallow stars.
    const dist = (t) => Math.hypot(t.x - cx0, t.y - cy0);
    raw.sort((a, b) => (dist(a) - dist(b)) || (a.x - b.x) || (a.y - b.y));
    raw.forEach((t, k) => { t.idx = k; });
    tiles = raw;
    // Contact angle sweeps about 19..61 degrees. Below ~15 the strap tips
    // collapse onto the edge; above ~65 the contact points approach the
    // centre and the star degenerates, so the range stays inside both limits.
    theta0 = rand(39, 41) * DEG;
    thetaAmp = rand(18, 21) * DEG;
    waveK = Math.round(rand(4, 5.49));
    phase0 = rand(0, 2 * Math.PI);
  }
  function reconfigure() {
    // Guaranteed-minimum-magnitude rate, random sign (never near zero).
    rate = sgn() * rand(1.0, 1.5) * SPEED;
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;

  initLayout();
  reconfigure();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  // Draw one star tile: the 12-gon M0 X1 M1 X2 ... M5 X0 with M = edge
  // midpoints (outer tips) and X = contact points on the corner bisectors.
  function drawTile(t, th) {
    const Rv = A_HEX;                         // circumradius = edge length
    const Ap = Rv * Math.sqrt(3) / 2;         // apothem
    const sinT = Math.sin(th), sin120 = Math.sin(120 * DEG - th);
    const d = (Rv / 2) * sinT / sin120;        // distance V -> X along the bisector
    const pts = [];
    for (let k = 0; k < 6; k++) {
      // Midpoint of edge k (between corners at 30+60k and 90+60k degrees).
      const ma = (60 + 60 * k) * DEG;
      pts.push(t.x + Ap * Math.cos(ma), t.y + Ap * Math.sin(ma));
      // Contact point at corner V_{k+1} (angle 90+60k), on the bisector
      // toward the tile centre.
      const va = (90 + 60 * k) * DEG;
      const vx = t.x + Rv * Math.cos(va), vy = t.y + Rv * Math.sin(va);
      const ux = -Math.cos(va), uy = -Math.sin(va);
      pts.push(vx + d * ux, vy + d * uy);
    }
    // Colour fixed by ring; a second, lighter hue marks the straps.
    const [h, s, l] = PAL[t.ring % PAL.length];
    const sat = Math.max(70, Math.min(94, s));
    const light = Math.max(52, Math.min(64, l));
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let p = 2; p < pts.length; p += 2) ctx.lineTo(pts[p], pts[p + 1]);
    ctx.closePath();
    ctx.fillStyle = `hsl(${h}, ${sat}%, ${light}%)`;
    ctx.fill();
    ctx.lineJoin = 'miter';
    ctx.lineWidth = Math.max(2, A_HEX * 0.07);
    ctx.strokeStyle = `hsl(${(h + 20) % 360}, ${sat}%, ${Math.min(88, light + 16)}%)`;
    ctx.stroke();
  }

  function renderFrame() {
    cycleFrame++;
    phase += rate * dt;
    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigure(); }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const p = phase + phase0;
    for (const t of tiles) {
      // Phase is shared; the per-tile angle comes from the rank wave.
      // Odd, sharpened wave (sign * sqrt|sin|): tiles snap between deep and
      // shallow stars, and the summed deviation stays zero-mean.
      const sv = Math.sin(2 * Math.PI * waveK * ((t.idx + 0.5) / tiles.length) - p);
      const th = theta0 + thetaAmp * Math.sign(sv) * Math.sqrt(Math.abs(sv));
      drawTile(t, th);
    }
    window.currentFrame++;
  }

  window.advanceFrame = function () { renderFrame(); };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) renderFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
