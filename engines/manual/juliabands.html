<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Julia Set Escape Bands — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine, inspired by a genuinely random web find (today's
// creative-research routine). Category: obscure mathematical object /
// physical phenomenon (the pool's least recently used mathematical category
// after the 2026-10-20 sandpile firing). An open WebSearch for the escape-
// time construction of Julia sets surfaced the standard complex-dynamics
// recipe: iterate z -> z*z + c from every point z0 of the complex plane and
// record how quickly |z| diverges; the boundary between escaping and
// non-escaping starting points is the Julia set of c. Sources (search
// snippets): https://en.wikibooks.org/wiki/Fractals/Iterations_in_the_complex_plane/Julia_set
// (escape-time method, and the rule that quadratic Julia sets are 180-degree
// rotationally symmetric), and the escape-criterion survey
// https://pmc.ncbi.nlm.nih.gov/articles/PMC13252796/ (divergence count as the
// colouring variable).
//
// A genuinely different construction PRINCIPLE from every other engine in the
// pool: not a wave-interference field (chladni/phasespikes/moire/schlieren),
// not a discrete local automaton (automaton/langtonsant), not a histogrammed
// de Jong map (strangeattractor -- that one accumulates many orbit points into
// a density; this one classifies EVERY pixel by a fixed escape count from its
// own starting point), not a PDE field or a sieve or a tiling. The only
// generative variable is the complex parameter c, which morphs around a
// closed loop, so the boundary between the two regions reorganises
// non-rigidly as it goes (Julia sets are connected for some c and disconnected
// "dust" for others).
//
// Brightness neutrality is by construction, not by luck: every frame, the
// exterior smooth escape values are RANK-QUANTISED into K equal-area bands (each
// band holds 1/K of the exterior pixels at every instant, whatever the set
// currently looks like), so the palette's area distribution, and hence mean
// luma, cannot drift as c moves. The interior (pixels that never escape) gets
// a colour whose lightness is matched to the band mean. Band order follows escape count, so neighbouring contour
// bands are neighbouring hues, which keeps the picture a smooth rainbow
// rather than a speckle. No accumulation: every frame is computed fresh, so
// there is no whiteout mechanism to reset. The band hues rotate slowly around
// the colour wheel (evenly spaced, so the summed luma barely moves with phase).
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32 (4-draw burn-in), no requestAnimationFrame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Mulberry32's first draws for consecutive small seeds are correlated --
  // burn 4 draws first (same convention as pendulumwave/spinbounce).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  // [hue, sat, light] stops; the band ramp interpolates across these.
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  // ---- complex parameter loop --------------------------------------------
  // c = R * e^{i*theta}, theta advancing at a guaranteed-minimum-magnitude,
  // random-sign rate. R is fixed per video (it sets how much of the
  // connected/dust range the loop crosses -- a coverage-affecting choice, so
  // it is never re-rolled), chosen in the band where the loop passes through
  // both connected and dust Julia sets.
  const R_C = rand(0.74, 0.80);
  const TH0 = rand(0, 2 * Math.PI);
  const OMEGA = sgn() * rand(0.5, 0.85) * SPEED;
  const PHI_RATE = sgn() * rand(14, 23) * SPEED; // degrees/s of hue rotation

  // ---- escape-time grid ----------------------------------------------------
  // Computed at a capped resolution and nearest-upscaled (crisp, house style).
  const CW = Math.min(W, 640);
  const CH = Math.max(1, Math.round(CW * H / W));
  const N = CW * CH;
  const MAXIT = 72;
  const K = 12;                 // exterior equal-area bands
  const VIEW_X = 1.7;           // half-width of the view in complex units
  const VIEW_Y = VIEW_X * H / W;
  const xMin = -VIEW_X, dx = (2 * VIEW_X) / CW;
  const yMin = -VIEW_Y, dy = (2 * VIEW_Y) / CH;

  const off = document.createElement('canvas');
  off.width = CW; off.height = CH;
  const offCtx = off.getContext('2d');
  const img = offCtx.createImageData(CW, CH);
  const data = img.data;

  // ---- colour LUT: K exterior bands + 1 interior colour -------------------
  // The K band hues are spread evenly around the FULL colour wheel (step
  // 360/K) and the whole set rotates slowly with a phase phi(t). Evenly spaced
  // hues make the summed luma of the bands almost invariant to phi (the
  // harmonics that survive a K-point sum are far weaker than the first), so the
  // hue cycling adds motion that changes each contour ring's colour without
  // moving its brightness, and it is not a rigid transform of the frame.
  // PAL[0] sets the starting hue and the saturation/lightness family.
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  const luma = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const H0 = PAL[0][0];
  const BAND_S = Math.max(86, Math.min(94, PAL[0][1]));
  const BAND_L = 60;
  const lut = new Uint8ClampedArray((K + 1) * 3);
  // Interior colour: opposite hue, with LIGHTNESS bisected so its Rec.709 luma
  // equals the mean luma of the exterior bands. The interior share of the frame
  // grows and shrinks as c moves; matching luma keeps mean brightness from
  // following that share.
  function buildLUT(phi) {
    let meanBand = 0;
    for (let k = 0; k < K; k++) {
      const rgb = hslToRgb(H0 + phi + (k * 360) / K, BAND_S, BAND_L);
      lut[k * 3] = rgb[0]; lut[k * 3 + 1] = rgb[1]; lut[k * 3 + 2] = rgb[2];
      meanBand += luma(rgb[0], rgb[1], rgb[2]);
    }
    meanBand /= K;
    const hi = H0 + phi + 180;
    let lo = 10, up = 95;
    for (let it = 0; it < 24; it++) {
      const mid = (lo + up) / 2;
      const rgb = hslToRgb(hi, BAND_S, mid);
      if (luma(rgb[0], rgb[1], rgb[2]) < meanBand) lo = mid; else up = mid;
    }
    const rgb = hslToRgb(hi, BAND_S, (lo + up) / 2);
    lut[K * 3] = rgb[0]; lut[K * 3 + 1] = rgb[1]; lut[K * 3 + 2] = rgb[2];
  }

  const NB = 4096;
  const binOf = new Uint16Array(N);      // per-pixel bin, or NB for interior
  const binCount = new Uint32Array(NB);
  const bandOfBin = new Uint8Array(NB + 1);
  const LOG2 = Math.LN2;

  function computeEscape(cr, ci) {
    binCount.fill(0);
    let i = 0;
    for (let py = 0; py < CH; py++) {
      const y0 = yMin + py * dy;
      for (let px = 0; px < CW; px++) {
        let x = xMin + px * dx, y = y0;
        let n = 0;
        let x2 = 0, y2 = 0;
        while (n < MAXIT) {
          x2 = x * x; y2 = y * y;
          if (x2 + y2 > 4) break;
          y = 2 * x * y + ci;
          x = x2 - y2 + cr;
          n++;
        }
        if (n >= MAXIT) {
          binOf[i] = NB;
        } else {
          const mod = Math.sqrt(x2 + y2);
          const smooth = n + 1 - Math.log(Math.log(mod)) / LOG2;
          const bin = Math.min(NB - 1, Math.max(0, Math.floor((smooth / MAXIT) * NB)));
          binOf[i] = bin;
          binCount[bin]++;
        }
        i++;
      }
    }
  }

  function assignBands() {
    let exterior = 0;
    for (let b = 0; b < NB; b++) exterior += binCount[b];
    let cum = 0;
    for (let b = 0; b < NB; b++) {
      const c = binCount[b];
      const q = exterior > 0 ? (cum + c / 2) / exterior : 0;
      bandOfBin[b] = Math.min(K - 1, Math.floor(q * K));
      cum += c;
    }
    bandOfBin[NB] = K;
  }

  function paint() {
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const b3 = bandOfBin[binOf[i]] * 3;
      data[p] = lut[b3]; data[p + 1] = lut[b3 + 1]; data[p + 2] = lut[b3 + 2]; data[p + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, W, H);
  }

  let clk = 0;
  function renderFrame() {
    clk += 1 / FPS;
    const th = TH0 + OMEGA * clk;
    const cr = R_C * Math.cos(th), ci = R_C * Math.sin(th);
    buildLUT(PHI_RATE * clk);
    computeEscape(cr, ci);
    assignBands();
    paint();
  }

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;
  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
