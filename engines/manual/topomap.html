<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Topomap — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Topographic contour flow: glowing iso-lines of a smooth random height field
// that slowly morphs, the look of a live topographic map. The format is a
// staple of the "satisfying loop" and screensaver genre (contour-line loops
// are among the most-watched abstract loops), and no pool engine draws
// marching-squares iso-lines of a continuous field.
//
// Design:
//   * Height field f(x,y,t) = sum of K plane waves with random directions and
//     wavelengths (0.35-0.8 of the frame height), each with its own phase
//     that advances at a guaranteed-minimum-magnitude, random-sign rate.
//   * Iso-levels are EQUAL-AREA quantiles of the current field (recomputed
//     each frame from a sorted copy), so the area between adjacent levels is
//     exactly constant. Whatever the field does, the same fraction of the
//     frame lies in each band, which keeps brightness neutral by construction.
//   * Each level is extracted with marching squares and stroked as a bold
//     glowing line. Level k keeps one hue forever (its colour is tied to its
//     rank, not to the field value), with lightness bisected so every hue has
//     the same Rec.709 luma. Contours move against each other because every
//     plane wave moves at its own rate, so no single rigid transform explains
//     the change.
//   * No reset is needed: the field is evaluated fresh each frame and nothing
//     accumulates. The opaque black clear keeps every frame independent.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no requestAnimationFrame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const U = Math.min(W, H);
  const HUE0 = rand(0, 360);

  // Plane-wave components of the height field.
  const K = 5;
  const WAVES = [];
  for (let k = 0; k < K; k++) {
    const dir = rand(0, 2 * Math.PI);
    const lam = rand(0.35, 0.8) * H;
    WAVES.push({
      kx: (2 * Math.PI / lam) * Math.cos(dir),
      ky: (2 * Math.PI / lam) * Math.sin(dir),
      amp: rand(0.6, 1.0),
      phi: rand(0, 2 * Math.PI),
      om: sgn() * rand(0.3, 0.55) * SPEED,   // rad/s, never near zero
    });
  }

  // Marching-squares grid.
  const G = Math.max(8, Math.round(U / 110));
  const COLS = Math.ceil(W / G) + 1;
  const ROWS = Math.ceil(H / G) + 1;
  const N = COLS * ROWS;
  const field = new Float32Array(N);
  const sorted = new Float32Array(N);

  // Level count: 9 equal-area iso-lines -> 10 equal-area bands.
  const LEVELS = 9;
  const LUMA_TARGET = 130;
  function hslToRgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const hp = (h / 60) % 6;
    const x = c * (1 - Math.abs((hp % 2) - 1));
    let r = 0, g = 0, b = 0;
    if (hp < 1) { r = c; g = x; } else if (hp < 2) { r = x; g = c; }
    else if (hp < 3) { g = c; b = x; } else if (hp < 4) { g = x; b = c; }
    else if (hp < 5) { r = x; b = c; } else { r = c; b = x; }
    const m = l - c / 2;
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  const LTAB = new Float32Array(360);
  for (let h = 0; h < 360; h++) {
    let lo = 0.1, hi = 0.9;
    for (let it = 0; it < 24; it++) {
      const mid = (lo + hi) / 2;
      const [r, g, b] = hslToRgb(h, 0.95, mid);
      const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (y < LUMA_TARGET) lo = mid; else hi = mid;
    }
    LTAB[h] = (lo + hi) / 2;
  }
  const LEVEL_HUE = [];
  for (let k = 0; k < LEVELS; k++) {
    LEVEL_HUE.push(Math.round((((HUE0 + k * 360 / LEVELS) % 360) + 360) % 360));
  }

  // Marching-squares edge table. Corners: 0=TL 1=TR 2=BR 3=BL (bit set when
  // value >= level). Edges: 0=top 1=right 2=bottom 3=left.
  const SEG = [
    [], [[0, 3]], [[0, 1]], [[1, 3]], [[1, 2]], null, [[0, 2]], [[2, 3]],
    [[2, 3]], [[0, 2]], null, [[1, 2]], [[1, 3]], [[0, 1]], [[0, 3]], [],
  ];

  window.currentFrame = 0;
  window.TOTAL_FRAMES = Math.round(DURATION * FPS);

  function evalField(t) {
    for (let k = 0; k < K; k++) {
      const w = WAVES[k];
      w.cur = w.phi + w.om * t;
    }
    for (let j = 0; j < ROWS; j++) {
      const y = Math.min(j * G, H);
      for (let i = 0; i < COLS; i++) {
        const x = Math.min(i * G, W);
        let s = 0;
        for (let k = 0; k < K; k++) {
          const w = WAVES[k];
          s += w.amp * Math.cos(w.kx * x + w.ky * y + w.cur);
        }
        field[j * COLS + i] = s;
      }
    }
  }

  function edgePoint(e, i, j, va, vb, lvl) {
    // Corner coords of cell (i,j).
    const x0 = i * G, y0 = j * G, x1 = x0 + G, y1 = y0 + G;
    let t;
    switch (e) {
      case 0: t = (lvl - va) / (vb - va); return [x0 + t * (x1 - x0), y0];
      case 1: t = (lvl - va) / (vb - va); return [x1, y0 + t * (y1 - y0)];
      case 2: t = (lvl - va) / (vb - va); return [x0 + t * (x1 - x0), y1];
      default: t = (lvl - va) / (vb - va); return [x0, y0 + t * (y1 - y0)];
    }
  }

  function drawLevel(lvl, hue, lw) {
    const L = LTAB[hue];
    ctx.beginPath();
    for (let j = 0; j < ROWS - 1; j++) {
      for (let i = 0; i < COLS - 1; i++) {
        const p0 = j * COLS + i;          // TL
        const p1 = p0 + 1;                // TR
        const p2 = p1 + COLS;             // BR
        const p3 = p0 + COLS;             // BL
        const v0 = field[p0], v1 = field[p1], v2 = field[p2], v3 = field[p3];
        const c = (v0 >= lvl ? 1 : 0) | (v1 >= lvl ? 2 : 0) | (v2 >= lvl ? 4 : 0) | (v3 >= lvl ? 8 : 0);
        if (c === 0 || c === 15) continue;
        let segs = SEG[c];
        if (c === 5 || c === 10) {
          const centre = 0.25 * (v0 + v1 + v2 + v3) >= lvl;
          const sad = (c === 5) === centre;
          segs = sad ? [[0, 1], [2, 3]] : [[0, 3], [1, 2]];
        }
        const vals = [v0, v1, v2, v3];
        // Edge endpoints: top(0)=TL->TR, right(1)=TR->BR, bottom(2)=BL->BR, left(3)=TL->BL.
        const ea = [[0, 1], [1, 2], [3, 2], [0, 3]];
        for (let s = 0; s < segs.length; s++) {
          const [e1, e2] = segs[s];
          const a = ea[e1], b = ea[e2];
          const pa = edgePoint(e1, i, j, vals[a[0]], vals[a[1]], lvl);
          const pb = edgePoint(e2, i, j, vals[b[0]], vals[b[1]], lvl);
          ctx.moveTo(pa[0], pa[1]);
          ctx.lineTo(pb[0], pb[1]);
        }
      }
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = lw * 3.4;
    ctx.strokeStyle = `hsla(${hue}, 100%, ${(L * 100).toFixed(1)}%, 0.22)`;
    ctx.stroke();
    ctx.lineWidth = lw;
    ctx.strokeStyle = `hsla(${hue}, 96%, ${(Math.min(0.92, L + 0.06) * 100).toFixed(1)}%, 0.95)`;
    ctx.stroke();
  }

  function renderFrame() {
    const t = window.currentFrame / FPS;
    evalField(t);
    // Equal-area iso-levels: the quantile of the current field's own values.
    sorted.set(field);
    sorted.sort();
    const n = sorted.length;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const lw = 0.0045 * U;
    for (let k = 0; k < LEVELS; k++) {
      const q = (k + 1) / (LEVELS + 1);
      const lvl = sorted[Math.min(n - 1, Math.round(q * (n - 1)))];
      drawLevel(lvl, LEVEL_HUE[k], lw);
    }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
