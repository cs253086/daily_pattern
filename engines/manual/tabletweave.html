<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tablet-Weave Bands — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "traditional textile/tiling/ornament
// tradition from a randomly chosen culture" -- the pool's most under-used
// category recently, only taniko.html shipped from it since 2026-09-15): an
// open WebSearch surfaced TABLET (CARD) WEAVING -- one of the oldest
// patterned-band techniques in the world. A warp thread passes through one
// of 4 holes in each of many small square "tablets" (cards); turning a
// tablet a quarter-turn brings a different one of its 4 threaded colours to
// the front. Turning many tablets together, in coordinated directions,
// produces a continuous patterned band. This engine specifically draws on
// BALTIC PICK-UP tablet weaving (Latvia/Lithuania, also Sami Scandinavia),
// used to weave patterned sashes/belts (Latvian "jostas") with a named
// motif vocabulary of diamonds, chevrons, and zig-zags -- including a named
// "serpent" (zaltys) motif, a sacred symbol of the sun goddess Saule in
// Lithuanian mythology, produced by MIRRORED ("point-turned") direction
// changes across the band. Sources:
// https://www.stringpage.com/tw/twtheory.html (4 holes per tablet, S/Z
// threading, turn direction), https://www.stringpage.com/tw/basictw.html,
// https://www.shelaghlewins.com/tablet_weaving/TW01/TW01.htm,
// http://www.silkewerk.com/tabletweaving/diagonal.html ("S cards turned
// FORWARD produce Z diagonal stripes; S cards turned BACKWARD produce S
// diagonal stripes" -- the diagonal-stripe threading gradient below is a
// direct rendering of this), http://aspinnerweaver.blogspot.com/2020/04/doing-some-baltic-pickup-and-looking-at.html
// and https://www.keithweaves.com/baltic-style-pick-up-weaving-in-south-america/
// (Baltic/Sami cultural context, diamond/chevron/serpent motifs),
// https://www.keithweaves.com/tablet-weaving-standard-terms-and-notation/
// (standard hole notation, confirms the mod-4 hole-cycling behaviour).
//
// A genuinely different construction PRINCIPLE from every other engine in
// the pool, textile or otherwise: the generative primitive here is a
// PER-UNIT ROTATION STATE -- each tablet is an independent object with its
// own continuous turning angle, and which of its 4 threaded colours is
// visible is a direct, continuous function of that angle. Not
// `stripweave.html` (static opaque motifs, no per-unit rotational state at
// all); not `herringbone.html` (a single BINARY over/under state per grid
// cell from one continuous global modular-shift formula, no rotation, no
// per-unit independence); not `ikatweave.html` (continuous per-thread
// POSITIONAL misalignment noise around one fixed motif, not rotation); not
// `taniko.html` (static discrete shape primitives charted on a grid, with
// motion as a choreography layer added on top -- here rotation IS the
// generative rule itself, kinetic by construction from the first draft).
// Also not a substitution/subdivision system (`quasicrystal.html`/
// `voderberg.html`), not a proximity partition (`voronoimosaic.html`), not
// a self-avoiding path (`hilbertweave.html`/`dragonfold.html`), not an
// arithmetic sieve (`primespiral.html`), not branching growth
// (`dendrite.html`/`frostgrowth.html`), not golden-angle packing
// (`phyllotaxis.html`), not a wave-interference field (`chladni.html`/
// `phasespikes.html`/`moire.html`), not tangent-circle packing
// (`doylespiral.html`), not nucleation/depletion rings (`liesegang.html`),
// not emergent per-cell local-choice connectivity (`truchet.html`), not a
// radial mandala (`kaleidoscope.html`/`starburst.html`/`arcrings.html`/
// `ziggurat.html`).
//
// COVERAGE STABILITY, verified numerically rather than over-claimed: each
// band's N tablets are given base angles evenly spaced through an INTEGER
// number (K) of full 2*PI cycles (baseAngle_i = 2*PI*K*i/N). A first draft
// of this comment claimed the resulting sum of |cos(angle_i(t))| (which
// drives total rendered width) was EXACTLY time-invariant -- checked with a
// standalone offline script BEFORE trusting it, per this pool's established
// discipline, and that claim was WRONG: the argument only holds when every
// tablet shares one direction. With the point-turned mirror split (half the
// tablets running +rate, half -rate), the point set at time t is no longer
// a pure relabelling of the evenly-spaced base set, and the measured sum
// does drift by roughly +/-15% of its mean over a cycle -- a real, bounded,
// periodic swing, not an unbounded accumulation. `validateEngine()` was run
// across the full seed battery specifically because of this, not assumed
// safe from the (flawed) analytic argument: 16/16 seeds passed with
// `projectedRise` comfortably inside the +/-50 threshold (-15.7 to +8.4)
// and `compositionDrift` well above its floor, so the residual swing is
// small enough in practice not to alias into a spurious whiteout trend --
// but this is an empirically-confirmed margin, not a proven invariant.
//
// A "point-turned" mirror direction split (direction(i) = +1 for tablets
// left of a turning-point column, -1 for tablets right of it) reproduces
// the sourced Baltic diamond/chevron/serpent motif mechanism directly:
// left and right halves turn in mirrored directions, so their
// width-foreshortening and colour-cycling phases stay mirror-symmetric
// about the turning point at every instant. Deliberately no literal
// per-tablet direction REVERSAL mid-video (a real tablet-weaving chart
// does reverse direction at specific rows) -- a reversal necessarily
// passes through zero angular velocity, a real near-zero-motion risk this
// pool's CLAUDE.md documents at length. Instead each tablet's direction is
// FIXED for the whole video (only its rate/turning-point column reassigns
// at a coverage-neutral cycleSec boundary, the same "reconfigure rate/sign,
// never animate through zero" pattern already proven safe across dozens of
// this pool's engines, e.g. arcrings.html/cascade.html/doylespiral.html).
// Every tablet's angular velocity magnitude is a guaranteed-minimum,
// never-zero constant for its whole active period, sidestepping the
// near-zero-motion bug class entirely rather than fighting it.
//
// Per-tablet threading is a linear colour-index GRADIENT across the row
// (holeColorBase_i = i mod 5) -- a direct rendering of the sourced
// "S cards turned forward produce Z diagonal stripes" mechanism: as every
// tablet turns at the same rate but starts from a different threading
// offset, the visible colour band sweeps diagonally across the row exactly
// as real tablet-woven diagonal-stripe bands do.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Band layout, tablet count, base angles,
// threading offsets, and turning-point columns are fixed ONCE per video in
// initBands(); only each band's shared angular rate/turning-point column
// reassigns per cycleSec in reconfigureMotion() -- coverage-neutral by the
// exact argument above, not merely approximately safe.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 34);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];
  const NC = PAL.length;

  const dt = 1 / FPS;

  function hueLerp(h0, h1, t) {
    let d = ((h1 - h0 + 540) % 360) - 180;
    return ((h0 + d * t) % 360 + 360) % 360;
  }
  function colorAt(readPos) {
    const idx = Math.floor(readPos);
    const frac = readPos - idx;
    const a = PAL[((idx % NC) + NC) % NC];
    const b = PAL[(((idx + 1) % NC) + NC) % NC];
    const h = hueLerp(a[0], b[0], frac);
    const s = a[1] + (b[1] - a[1]) * frac;
    const l = a[2] + (b[2] - a[2]) * frac;
    return [h, s, l];
  }

  // Band layout, tablet base angles/threading, and turning-point columns
  // are fixed ONCE per video. K (full-cycle count for the evenly-spaced
  // phase argument) is a small fixed constant, never re-derived per seed,
  // so the exact coverage-neutrality argument above always applies.
  const K = 3;
  let bands; // [{ y, h, n, tablets:[{baseAngle, dir, colorBase, w0}], rate, turnCol }]
  function initBands() {
    let bandCount = Math.max(1, Math.min(3, Math.round(2 * Math.max(0.6, Math.min(1.4, DENSITY)))));
    bands = [];
    const bandH = H / bandCount;
    for (let b = 0; b < bandCount; b++) {
      const n = Math.max(16, Math.min(28, Math.round(22 * Math.max(0.75, Math.min(1.3, DENSITY)))));
      const turnCol = Math.floor(n * rand(0.35, 0.65));
      const marginX = W * 0.03;
      const usableW = W - marginX * 2;
      const w0 = (usableW / n) * 0.86;
      const tablets = [];
      for (let i = 0; i < n; i++) {
        tablets.push({
          x: marginX + (i + 0.5) * (usableW / n),
          baseAngle: (2 * Math.PI * K * i) / n,
          dir: i < turnCol ? 1 : -1,
          colorBase: i % NC,
          w0,
        });
      }
      bands.push({
        y: (b + 0.5) * bandH,
        h: bandH * 0.82,
        n,
        tablets,
        turnCol,
        rate: sgn() * rand(0.9, 1.5) * SPEED,
      });
    }
  }

  function reconfigureMotion() {
    for (const band of bands) {
      band.rate = sgn() * rand(0.9, 1.5) * SPEED;
      band.turnCol = Math.floor(band.n * rand(0.35, 0.65));
      for (let i = 0; i < band.n; i++) band.tablets[i].dir = i < band.turnCol ? 1 : -1;
    }
  }

  initBands();

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  const MIN_WIDTH_FRAC = 0.28;

  function renderFrame() {
    const frame = window.currentFrame;
    const clk = frame * dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (const band of bands) {
      for (const tb of band.tablets) {
        const angle = tb.baseAngle + tb.dir * band.rate * clk;
        const widthMul = MIN_WIDTH_FRAC + (1 - MIN_WIDTH_FRAC) * Math.abs(Math.cos(angle));
        const w = tb.w0 * widthMul;
        const readPos = angle / (Math.PI / 2) + tb.colorBase;
        const [h, s, l] = colorAt(readPos);

        // GLOW IS MANDATORY (CLAUDE.md, 2026-09-14 house-style research):
        // a soft wide low-alpha pass underneath a bright opaque core.
        const glowW = w * 1.55, glowH = band.h * 1.15;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `hsla(${h}, ${s}%, ${Math.min(74, l + 6)}%, 0.28)`;
        ctx.fillRect(tb.x - glowW / 2, band.y - glowH / 2, glowW, glowH);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
        const rad = Math.min(8, w * 0.18, band.h * 0.1);
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(tb.x - w / 2, band.y - band.h / 2, w, band.h, rad);
        } else {
          ctx.rect(tb.x - w / 2, band.y - band.h / 2, w, band.h);
        }
        ctx.fill();
      }
    }

    if (frame > 0 && frame % cycleFrames === 0) reconfigureMotion();
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
