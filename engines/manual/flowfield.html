<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Field — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated additive engine: thousands of luminous particles advected by a
// slowly-evolving seeded flow field, drawn with additive ('lighter') blending
// over a gently fading canvas so light accumulates into glowing filaments.
//
// Implements the headless contract used by src/render.js:
//   URL params : seed, palette, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
//
// Deterministic (Mulberry32), no requestAnimationFrame, canvas sized to the
// width/height params, per-second motion rates subdivided per frame so pacing
// is identical at any fps. Cheap: one pass over the particle array per frame,
// only sin/cos + vector math, no per-pixel loops or full-canvas filters.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 90);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Mulberry32 PRNG.
  let rs = (SEED >>> 0) || 1;
  function rng() {
    rs |= 0; rs = (rs + 0x6D2B79F5) | 0;
    let t = Math.imul(rs ^ (rs >>> 15), 1 | rs);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);

  // Palettes as arrays of [h,s,l]; particles pick within the active palette.
  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[155, 85, 58], [185, 80, 60], [275, 70, 62], [110, 75, 58]],
    ember:  [[16, 95, 58], [355, 88, 58], [40, 95, 60], [325, 70, 55]],
    ocean:  [[195, 90, 58], [215, 85, 62], [170, 80, 55], [240, 60, 62]],
    neon:   [[290, 90, 62], [180, 95, 60], [325, 90, 64], [220, 88, 64]],
    sunset: [[18, 92, 60], [340, 82, 62], [285, 70, 58], [46, 92, 62]],
    ice:    [[195, 70, 70], [210, 65, 75], [230, 55, 72], [180, 60, 68]],
    gold:   [[42, 90, 60], [30, 95, 58], [50, 85, 64], [18, 90, 56]],
  };
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = palettes[resolvePalette()];

  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // Flow field: value noise on a coarse grid, bilinearly sampled, angle = 2π·n.
  const GRID = 22;
  let field = [];
  let fieldRot = 0;
  function newField() {
    field = new Array((GRID + 1) * (GRID + 1));
    for (let i = 0; i < field.length; i++) field[i] = rng();
  }
  function angleAt(nx, ny) {
    // nx, ny in [0,1]
    const gx = Math.min(GRID - 1e-6, Math.max(0, nx * GRID));
    const gy = Math.min(GRID - 1e-6, Math.max(0, ny * GRID));
    const x0 = gx | 0, y0 = gy | 0;
    const fx = gx - x0, fy = gy - y0;
    const a = field[y0 * (GRID + 1) + x0];
    const b = field[y0 * (GRID + 1) + x0 + 1];
    const c = field[(y0 + 1) * (GRID + 1) + x0];
    const d = field[(y0 + 1) * (GRID + 1) + x0 + 1];
    const top = a + (b - a) * fx;
    const bot = c + (d - c) * fx;
    const n = top + (bot - top) * fy;
    return (n * Math.PI * 4) + fieldRot;
  }

  const N = Math.round(Math.min(6000, 2200 * DENSITY));
  let particles = [];
  function spawn(p) {
    p.x = rng() * W; p.y = rng() * H;
    p.life = rand(2.5, 7.0);        // seconds
    p.age = 0;
    const base = PAL[(rng() * PAL.length) | 0];
    p.h = base[0] + rand(-12, 12);
    p.s = base[1];
    p.l = base[2];
    p.spd = rand(0.05, 0.16) * minDim;   // px/sec
    p.w = rand(0.6, 1.8) * (minDim / 1080);
  }
  function initParticles() {
    particles = new Array(N);
    for (let i = 0; i < N; i++) { particles[i] = {}; spawn(particles[i]); particles[i].age = rng() * particles[i].life; }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;

  function hardClear() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

  newField();
  initParticles();
  hardClear();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    const progress = cycleFrame / cycleFrames;

    // Gentle fade leaves glowing trails (light accumulates) without smearing to white.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.055)';
    ctx.fillRect(0, 0, W, H);

    // Slowly rotate the whole field for evolving motion.
    fieldRot += 0.06 * SPEED * dt;

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < N; i++) {
      const p = particles[i];
      const ang = angleAt(p.x / W, p.y / H);
      const vx = Math.cos(ang) * p.spd * SPEED;
      const vy = Math.sin(ang) * p.spd * SPEED;
      const nxp = p.x + vx * dt;
      const nyp = p.y + vy * dt;

      // Fade in/out over life so cores twinkle rather than pop.
      const lifeT = p.age / p.life;
      const env = Math.sin(Math.min(1, lifeT) * Math.PI); // 0→1→0
      const alpha = 0.35 * env;

      ctx.strokeStyle = `hsla(${p.h}, ${p.s}%, ${p.l}%, ${alpha})`;
      ctx.lineWidth = p.w;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(nxp, nyp);
      ctx.stroke();

      p.x = nxp; p.y = nyp;
      p.age += dt;
      if (p.age >= p.life || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) spawn(p);
    }

    // New cycle: fresh field + palette-consistent respawn, hard clear.
    if (cycleFrame >= cycleFrames) {
      cycleFrame = 0;
      newField();
      hardClear();
      initParticles();
    }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
