<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Snowflakes — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: FALLING SNOWFLAKES. A dense field of six-fold crystal stars
// falls through the frame in three depth layers. Each flake is a 6-arm star with
// two branches per arm, drawn as a bold glowing stroke on black. Flakes fall
// with a wrap-around, sway side to side, and spin on their own rates, so the
// composition keeps developing for the whole hour.
//
// Construction (stateless per frame, a pure function of time):
//   Each flake has a fixed depth layer, size, fall speed and sway. Its height
//   wraps modulo the frame (y = fract(y0 + v*t)), so the flake count is constant
//   at every instant and the ink on screen never accumulates or drains. Sway is
//   a bounded sine in x. Rotation is a steady spin with a guaranteed-minimum
//   magnitude and a random sign, so neighbouring flakes turn in different
//   directions (unit-level, non-rigid motion).
//
// Speed: each depth layer's star is drawn ONCE into an offscreen sprite, and
// every flake is a rotated, scaled drawImage of that sprite. Stroking hundreds
// of wide paths per frame was too slow for the render budget.
//
// Brightness neutrality: flake count, sizes and per-layer alpha are fixed, and
// each flake's ink is rotation- and sway-invariant, so mean luma holds steady.
// Each star is drawn twice (a wide low-alpha halo, then a thin bright core),
// the house glow convention. Layer hues are fixed; saturation is high so the
// frame stays vivid rather than grey-white.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32 (4-draw burn-in), no requestAnimationFrame.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = Math.max(0.5, fltP('density', 1));

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Mulberry32's first draws for consecutive small seeds are correlated, so burn
  // 4 draws first (same convention as the other curated engines).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  const COLS = parseColors();
  const BASE_H = COLS ? COLS[0][0] : rand(180, 230);

  // ---- layers: far (small, slow, dim) to near (large, fast, bright) -----------
  const LAYERS = [
    { size: 0.040, count: 70, speed: 0.012, alpha: 0.6,  dH: -14 },
    { size: 0.062, count: 48, speed: 0.022, alpha: 0.85, dH: 0 },
    { size: 0.095, count: 26, speed: 0.036, alpha: 1.0,  dH: 14 },
  ];

  // One sprite per layer: a six-fold star, halo then core, drawn once.
  // The sprite is square with radius spriteR px; a flake draws it at scale
  // flake.size / layer.size.
  function makeSprite(L) {
    const R = L.size * H * 1.25;             // star radius in px (with margin)
    const S = Math.ceil(R * 2);
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const hue = BASE_H + L.dH;
    const drawPass = (lw, colour) => {
      g.save();
      g.translate(S / 2, S / 2);
      g.lineCap = 'round';
      g.lineWidth = lw;
      g.strokeStyle = colour;
      g.beginPath();
      for (let a = 0; a < 6; a++) {
        const ang = a * Math.PI / 3;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        g.moveTo(0, 0);
        g.lineTo(ca * R, sa * R);
        for (const f of [0.45, 0.75]) {
          const bx = ca * R * f, by = sa * R * f;
          const len = R * 0.28 * (1 - f * 0.5);
          for (const side of [-1, 1]) {
            const ba = ang + side * Math.PI / 3;
            g.moveTo(bx, by);
            g.lineTo(bx + Math.cos(ba) * len, by + Math.sin(ba) * len);
          }
        }
      }
      g.stroke();
      g.restore();
    };
    drawPass(R * 0.22, `hsla(${hue}, 95%, 62%, ${0.22 * L.alpha})`);   // halo
    drawPass(R * 0.07, `hsla(${hue}, 100%, 72%, ${L.alpha})`);         // core
    return { canvas: c, half: S / 2, R };
  }
  const SPRITES = LAYERS.map(makeSprite);

  // ---- flakes: fixed start positions, sizes and rates, drawn once ----------------
  const flakes = [];
  LAYERS.forEach((L, li) => {
    const n = Math.max(1, Math.round(L.count * DENSITY));
    for (let i = 0; i < n; i++) {
      flakes.push({
        layer: li,
        x0: rand(0, 1),
        y0: rand(0, 1),
        scale: rand(0.85, 1.15),                     // size jitter, multiplies the layer sprite
        fall: L.speed * rand(0.8, 1.2) * SPEED,      // frame heights per second
        swayA: rand(0.012, 0.024),                   // horizontal sway, fraction of width
        swayT: rand(14, 24) / SPEED,
        swayP: rand(0, 2 * Math.PI),
        rot0: rand(0, Math.PI / 3),
        spin: sgn() * rand(0.18, 0.4) * SPEED,       // rad/s, guaranteed minimum magnitude
      });
    }
  });

  let clk = 0;
  const TWO_PI = 2 * Math.PI;
  function renderFrame() {
    clk += 1 / FPS;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      const sp = SPRITES[f.layer];
      const yFrac = f.y0 + f.fall * clk;             // falling wrap: count and ink stay fixed
      const yN = yFrac - Math.floor(yFrac);
      const xN = f.x0 + f.swayA * Math.sin(TWO_PI * clk / f.swayT + f.swayP);
      const cx = xN * W;
      const cy = yN * H;
      const k = f.scale;                             // sprite drawn at layer size * scale
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(f.rot0 + f.spin * clk);
      ctx.scale(k, k);
      ctx.drawImage(sp.canvas, -sp.half, -sp.half);
      ctx.restore();
    }
  }

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;
  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
