<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dendrite — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine): DENDRITIC CRYSTAL GROWTH -- the branching,
// tree-like growth habit seen in frost on glass, manganese/pyrolusite
// dendrites in rock, and Lichtenberg figures (branching electrical
// discharge patterns), where a growth front repeatedly forks into two
// smaller branches at a roughly fixed length-decay ratio and angular
// spread, generation after generation. See CLAUDE.md's dated write-up for
// the search trail.
//
// A genuinely different construction PRINCIPLE from everything else in the
// pool: not an arithmetic sieve (primespiral.html), not a substitution/
// subdivision system that repartitions a FIXED area (quasicrystal.html),
// not a discrete cellular-automaton local rule on a 1D row (automaton.html),
// not an implicit wave-interference zero-set (chladni.html), not a golden-
// angle packing rule (phyllotaxis.html) -- a RECURSIVE BRANCHING process
// (each segment spawns two shorter, angularly-offset child segments,
// generation after generation), the classic construction behind fractal
// trees / L-systems, applied here to a genuinely random crystal-growth
// phenomenon rather than a pre-decided fractal technique.
//
// COMPOSITION note: deliberately NOT a single centred radially-symmetric
// "snowflake" (which would land back in the pool's already-crowded centred-
// radial-mandala archetype -- kaleidoscope.html/starburst.html/
// quasicrystal.html/ziggurat.html -- per CLAUDE.md's "Archetype clustering"
// section) and NOT a single directional top-to-bottom sweep (cascade.html
// already owns that archetype). Instead: several INDEPENDENT dendrites,
// each starting at its own scattered point and growing in its own random
// direction with its own independently-randomised branch angles, so
// neither one shared centre nor one shared direction dominates the frame --
// a field of separate fractal growths, the same "several independent
// instances of one motif, not one dominant shape" composition-level idea
// already used successfully by phyllotaxis.html (after that engine's own
// novelty-gate iteration -- see its dated write-up).
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rotation rates. Redraws each
// frame from a fixed per-dendrite segment list computed once at start-up
// (no accumulation, no whiteout risk).
//
// UNIT CHOREOGRAPHY (2026-09-10, user definition of "dynamic": the basic
// units must visibly move RELATIVE TO EACH OTHER every frame, not just the
// whole pattern spinning). The unit-motion audit (scripts/audit-unit-
// motion.js) scored the old version at residual 3.9: rigid trees that only
// spun about their roots. Now every tree SWAYS like a plant in wind:
//   * Each branch's angle relative to its parent gets an oscillation
//     amp(gen)*sin(omega*t + phase_tree + gen*lag), with amplitude GROWING
//     with generation (trunk barely moves, twigs swing hardest) and a phase
//     lag per generation, so the sway propagates outward along the tree.
//     Because child angles are relative, offsets accumulate along a path
//     and the tips travel a long way (10-35% of the tree radius) while the
//     branching topology, lengths and widths never change -- so coverage is
//     steady by construction (positions are re-walked from the stored
//     relative angles every frame; nothing is re-rolled per cycle).
//   * A brightness+width PULSE travels from trunk to tips (phase by
//     generation, spread over a full turn so the lit total stays flat).
//   * The per-tree spin about its root is kept as before.
// Sway period ~3-5s, random sign per tree; the trunk is sized so the
// swaying reach still stays inside its cell (see trunkLen).
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 36);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // Dendrite count, every start point, and every branch segment (position,
  // width, colour) are all fixed ONCE for the whole video, never re-rolled
  // per cycle -- the "any coverage-affecting parameter re-randomised per
  // cycle creates a real (not aliased) brightness swing" lesson CLAUDE.md
  // documents for seven prior engines in a row. Branch geometry directly
  // sets total lit coverage, so re-rolling it mid-video would swing average
  // frame brightness between cycles exactly like a randomised subdivision
  // depth or star count did.
  // Dendrites are placed in a near-regular grid of cells (small jitter),
  // the same "several independent instances, near-regular placement"
  // pattern phyllotaxis.html settled on -- a genuine bug was found only
  // by rendering and looking: an earlier version placed dendrites at
  // fully random points with a fully random growth DIRECTION, and since a
  // dendrite's reach is unrelated to its start position, this regularly
  // sent a whole tree sprawling off-canvas (leaving large, mostly-empty
  // black frames -- against the house style's "vivid, bold, clear" rule)
  // or curling back to self-cross its own trunk. Fixed by confining each
  // dendrite's expected reach to its own grid cell (trunk length scaled
  // from the cell size), so every dendrite stays substantially on-screen
  // regardless of which random direction it happens to grow in.
  let dendrites;
  function initDendrites() {
    const d = Math.max(0.7, Math.min(1.4, DENSITY));
    // 3x2 (was 3x1) at default density: a 16:9 frame split into three
    // tall cells confined each tree to a circle of half the cell WIDTH and
    // left the top/bottom 40% of every cell black. Two rows of three gives
    // six trees of the same on-screen size and a much fuller frame.
    const grid = d < 0.85 ? { cols: 2, rows: 2 } : d > 1.15 ? { cols: 4, rows: 2 } : { cols: 3, rows: 2 };
    const cellW = W / grid.cols, cellH = H / grid.rows;
    const MAX_GEN = 9;
    const hue0 = rng() * 360;

    dendrites = [];
    let i = 0;
    for (let row = 0; row < grid.rows; row++) {
      for (let col = 0; col < grid.cols; col++, i++) {
        const jx = rand(-0.08, 0.08) * cellW;
        const jy = rand(-0.08, 0.08) * cellH;
        const startX = (col + 0.5) * cellW + jx;
        const startY = (row + 0.5) * cellH + jy;
        const dir0 = rand(0, Math.PI * 2);
        const baseCol = PAL[i % PAL.length];
        const dendHue0 = hue0 + rand(-30, 30);
        // Allowed radius: half the SMALLER cell dimension minus the root
        // jitter and a margin, so a tree's full reach -- in any direction,
        // since it also spins over time -- stays within its own cell. The
        // tree is grown with a nominal trunk and then NORMALISED to this
        // radius from its measured rest-pose reach (below): an earlier
        // estimate (reach ~3.3x trunk, times a fudge for fork folding) was
        // wrong in both directions -- alternating +/- forks make many
        // root-to-tip paths nearly straight, so trees clipped the canvas
        // edge at one setting and left the cell mostly black at another.
        // Measuring instead of estimating fits by construction.
        const allowedR = Math.min(cellW, cellH) * 0.5 - Math.max(Math.abs(jx), Math.abs(jy)) - minDim * 0.015;
        const trunkLen = Math.min(cellW, cellH) * 0.12; // nominal; rescaled below
        const baseWidth = Math.max(6, minDim * 0.017);

        const segments = [];
        // Recursive branch generator: each call records ONE segment (as an
        // angle RELATIVE to its parent, plus its length) then spawns two
        // shorter, angularly-offset children. Angle offsets and length-decay
        // ratio are randomised PER CALL (not just once), so sibling branches
        // diverge organically -- the real dendritic-growth look -- while
        // every value is still drawn once at init time and never touched
        // again, so total coverage never varies frame to frame or cycle to
        // cycle. Positions are computed per frame in renderFrame() by
        // walking the list (parents always precede children), adding the
        // per-generation sway to each relative angle. Spread range
        // tightened from an earlier 0.32-0.62 rad: that wider range
        // occasionally accumulated across generations into branches curling
        // back and crossing their own trunk (a real bug found only by
        // rendering and looking), rather than reading as a clean fractal
        // fork.
        function grow(parent, relAngle, len, gen) {
          const width = Math.max(1.8, baseWidth * Math.pow(0.82, gen));
          const hue = ((baseCol[0] + dendHue0 + gen * 9) % 360 + 360) % 360;
          const light = Math.min(74, baseCol[2] + gen * 2);
          const idx = segments.length;
          segments.push({ parent, relAngle, len, gen, width, hue, sat: baseCol[1], light, ax: 0, ay: 0, bx: 0, by: 0, ang: 0 });
          if (gen >= MAX_GEN || len < minDim * 0.006) return;
          const childLen = len * rand(0.62, 0.78);
          const spread1 = rand(0.26, 0.46);
          const spread2 = rand(0.26, 0.46);
          // Guaranteed-minimum-magnitude branch angle offset (never near
          // zero) so no child branch grows nearly collinear with its
          // parent -- collinear branches would visually fuse into one long
          // segment instead of reading as a fork.
          grow(idx, spread1, childLen, gen + 1);
          grow(idx, -spread2, childLen, gen + 1);
        }
        grow(-1, dir0, trunkLen, 0);
        // Measure the rest-pose geometry, find the centre of the tree's
        // enclosing circle (bounding-box centre) and its radius, then
        // rescale every length so that radius is exactly allowedR /
        // SWAY_REACH -- the sway can straighten a zigzag path a little, so
        // leave that headroom. The tree PIVOTS about that circle centre,
        // not its root: a fan-shaped tree spinning about its root needs a
        // confinement circle of its whole reach and ends up filling only a
        // quarter of its cell (measured by rendering); pivoting about the
        // enclosing-circle centre lets the same cell hold a tree twice as
        // large. Verified by a border-pixel scan over 40s at several seeds:
        // zero lit border pixels.
        const SWAY_REACH = 1.12;
        let pivotX = 0, pivotY = 0;
        {
          const ax = [], ay = [];
          let minX = 0, maxX = 0, minY = 0, maxY = 0;
          for (let k = 0; k < segments.length; k++) {
            const sg = segments[k];
            const ang = sg.parent < 0 ? sg.relAngle : ax[sg.parent] + sg.relAngle;
            const px = sg.parent < 0 ? 0 : ay[sg.parent * 2], py = sg.parent < 0 ? 0 : ay[sg.parent * 2 + 1];
            const ex = px + Math.cos(ang) * sg.len, ey = py + Math.sin(ang) * sg.len;
            ax[k] = ang; ay[k * 2] = ex; ay[k * 2 + 1] = ey;
            if (ex < minX) minX = ex; if (ex > maxX) maxX = ex;
            if (ey < minY) minY = ey; if (ey > maxY) maxY = ey;
          }
          const bcx = (minX + maxX) / 2, bcy = (minY + maxY) / 2;
          let reach = Math.hypot(bcx, bcy); // the root itself
          for (let k = 0; k < segments.length; k++) {
            const rr = Math.hypot(ay[k * 2] - bcx, ay[k * 2 + 1] - bcy);
            if (rr > reach) reach = rr;
          }
          const scale = allowedR / (reach * SWAY_REACH);
          for (const sg of segments) sg.len *= scale;
          pivotX = bcx * scale; pivotY = bcy * scale;
        }

        dendrites.push({
          // The cell centre is the PIVOT; the root sits at pivot - (pivotX, pivotY).
          startX, startY, rootX: startX - pivotX, rootY: startY - pivotY, segments,
          // Sway: per-tree phase and guaranteed-minimum rate with random sign.
          swayPhase: rand(0, Math.PI * 2),
          swayRate: (rng() < 0.5 ? -1 : 1) * rand(1.5, 2.5),
          swayLag: rand(0.5, 0.9),
          swayAmp: rand(0.03, 0.04),
          pulsePhase: rand(0, Math.PI * 2),
          pulseRate: rand(1.4, 2.4),
        });
      }
    }
  }

  // Called at start-up AND every cycleSec. Only each dendrite's OWN spin
  // angle/rate (about its own start point) resets -- coverage-neutral by
  // construction (a rigid rotation transform doesn't change how many
  // segments are lit or how wide they are), same reasoning as
  // quasicrystal.html's/ziggurat.html's/phyllotaxis.html's reconfigure
  // functions. Each dendrite spins independently (guaranteed-minimum-
  // magnitude, random sign, per dendrite) so the field reads as several
  // separately-alive growths, not one synchronised unit.
  function reconfigureSpins() {
    for (const den of dendrites) {
      den.rotAngle0 = rand(0, Math.PI * 2);
      den.rotRate = (rng() < 0.5 ? -1 : 1) * rand(0.45, 0.9) * SPEED;
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initDendrites();
  reconfigureSpins();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';

    for (const den of dendrites) {
      ctx.save();
      ctx.translate(den.startX, den.startY);
      ctx.rotate(den.rotAngle0 + clk * den.rotRate);
      ctx.translate(-den.startX, -den.startY);
      const segs = den.segments;
      const swT = clk * den.swayRate + den.swayPhase;
      const puT = clk * den.pulseRate + den.pulsePhase;
      // Per-generation sway and pulse, computed once per frame per tree.
      const sway = [], pulse = [];
      for (let g = 0; g <= 10; g++) {
        // Amplitude grows with depth: trunk ~0.035 rad, twigs ~0.35 rad, and
        // offsets accumulate along the path from root to tip.
        sway[g] = den.swayAmp * (1 + g) * Math.sin(swT + g * den.swayLag);
        const pw = Math.sin(puT - g * 0.62);
        pulse[g] = pw > 0 ? pw * pw : 0;
      }
      // Walk the tree: parents precede children, so the parent's absolute
      // angle and end point are already up to date.
      for (let i = 0; i < segs.length; i++) {
        const sg = segs[i];
        if (sg.parent < 0) { sg.ax = den.rootX; sg.ay = den.rootY; sg.ang = sg.relAngle + sway[0]; }
        else { const pr = segs[sg.parent]; sg.ax = pr.bx; sg.ay = pr.by; sg.ang = pr.ang + sg.relAngle + sway[sg.gen]; }
        sg.bx = sg.ax + Math.cos(sg.ang) * sg.len;
        sg.by = sg.ay + Math.sin(sg.ang) * sg.len;
        const p = pulse[sg.gen];
        ctx.strokeStyle = `hsl(${sg.hue}, ${sg.sat}%, ${Math.min(84, sg.light + 20 * p)}%)`;
        ctx.lineWidth = sg.width * (1 + 0.45 * p);
        ctx.beginPath();
        ctx.moveTo(sg.ax, sg.ay);
        ctx.lineTo(sg.bx, sg.by);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureSpins(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
