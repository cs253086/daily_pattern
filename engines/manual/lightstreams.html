<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Streams — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated engine: a field of glowing light streams rising through black.
// Each stream is a bright head with a fading tail, drawn additively so
// overlaps bloom into brighter light. Every stream is fixed in position,
// length and colour per video; only its rise speed and sway move.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. The canvas clears to opaque black every
// frame, so nothing accumulates across frames.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Discard the first draws: Mulberry32 outputs for small consecutive seeds are correlated.
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  // Hues spread around the wheel, each saturated and light enough to glow.
  const HUES = [330, 305, 285, 265, 195, 175, 150, 45, 25, 5];
  const hueShift = rand(0, 360);
  const streamCount = Math.round(Math.max(24, Math.min(140, 70 * DENSITY)));

  const streams = [];
  for (let i = 0; i < streamCount; i++) {
    const span = H * 1.6;
    streams.push({
      x: rand(0.03, 0.97) * W,
      len: rand(0.18, 0.55) * H,
      speed: sgn() * rand(0.06, 0.16) * H * SPEED,
      phase: rng(),
      sway: rand(0.004, 0.012) * W,
      swayRate: sgn() * rand(0.03, 0.09),
      width: rand(1.4, 3.2),
      hue: (HUES[Math.floor(rng() * HUES.length)] + hueShift + rand(-12, 12) + 360) % 360,
      span,
    });
  }

  window.currentFrame = 0;
  window.TOTAL_FRAMES = Math.round(DURATION * FPS);

  function drawStream(s, t) {
    const L = H + s.len;
    const u = ((s.phase + (s.speed * t) / L) % 1 + 1) % 1;
    const headY = L - u * L;
    const tailY = headY + s.len;
    const headX = s.x + Math.sin(2 * Math.PI * (s.phase + s.swayRate * t)) * s.sway;
    const tailX = s.x + Math.sin(2 * Math.PI * (s.phase + s.swayRate * t - 0.02)) * s.sway;

    const g = ctx.createLinearGradient(tailX, tailY, headX, headY);
    g.addColorStop(0, `hsla(${s.hue}, 95%, 55%, 0)`);
    g.addColorStop(1, `hsla(${s.hue}, 95%, 62%, 0.9)`);

    ctx.lineCap = 'round';
    ctx.strokeStyle = g;
    ctx.lineWidth = s.width * 7;
    ctx.globalAlpha = 0.09;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(headX, headY); ctx.stroke();

    ctx.lineWidth = s.width * 2.6;
    ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(headX, headY); ctx.stroke();

    ctx.lineWidth = s.width;
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(headX, headY); ctx.stroke();

    const hr = s.width * 9;
    const hg = ctx.createRadialGradient(headX, headY, 0, headX, headY, hr);
    hg.addColorStop(0, `hsla(${s.hue}, 100%, 88%, 1)`);
    hg.addColorStop(0.35, `hsla(${s.hue}, 100%, 65%, 0.45)`);
    hg.addColorStop(1, `hsla(${s.hue}, 100%, 55%, 0)`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(headX, headY, hr, 0, Math.PI * 2); ctx.fill();
  }

  function renderFrame() {
    const t = window.currentFrame / FPS;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const s of streams) drawStream(s, t);
    ctx.globalCompositeOperation = 'source-over';
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
