<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foam Coarsening — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "random natural structure"): 2D FOAM
// COARSENING -- the von Neumann-Mullins law + T1/T2 topological transitions
// that govern how a 2D soap froth (or any cellular network settling toward
// mechanical equilibrium) ages. Real, still-studied physics, not folklore:
// in a dry 2D foam at local equilibrium (every vertex a triple junction
// meeting at 120 degrees, per Plateau's law), a cell's own rate of area
// change depends ONLY on its number of sides n, not its size or shape --
// cells with fewer than 6 sides shrink, cells with more than 6 sides grow,
// hexagonal cells are neutral. As cells shrink/grow the network's own
// TOPOLOGY (who is adjacent to whom) keeps rearranging through two sharp,
// named local events: a T1 transition (a shrinking edge "flips", swapping
// which cells are neighbours) and a T2 transition (a cell whose area hits
// zero vanishes, its former neighbours absorbing the freed area). Sources:
// arxiv.org/pdf/cond-mat/0502287 (scaling state of dry 2D froths),
// par.nsf.gov/servlets/purl/10562600 (foam-coarsening PRE preprint),
// pubs.rsc.org/en/content/articlehtml/2024/sm/d4sm00555d (RSC Soft Matter,
// open access). See CLAUDE.md's dated write-up for the full research trail
// and why this category (random natural structure) led here.
//
// A genuinely different construction PRINCIPLE from every partition-type
// engine already in the pool: columnarbasalt.html's Voronoi, quasicrystal.
// html's substitution tiling, and widmanstatten.html's overlaid bands all
// compute a tessellation ONCE and only transform it rigidly/continuously
// afterward -- the TOPOLOGY (how many sides each cell has, who is adjacent
// to whom) is frozen at construction time. Here the topology itself is the
// thing that evolves, driven by a local integer rule (n vs 6) and expressed
// through genuinely discrete rewiring events, not any rigid transform, wave
// field, branching rule, point lattice, or particle accretion.
//
// IMPLEMENTATION, verified OFFLINE before writing this file (the same
// discipline this pool's quasicrystal.html/geodome.html/spaceframe.html
// already established for a construction that could still "look
// plausible" even if subtly wrong): rather than hand-coding general T1
// edge-flip graph surgery (a large, bug-prone piece of computational
// geometry -- correctly identifying the 4 surrounding faces of a
// collapsing edge in a plain vertex/edge/face adjacency structure, and
// reassigning them without corrupting the mesh, carries real risk of a
// silent error that only manifests thousands of frames later), this uses a
// POWER (Laguerre) VORONOI diagram recomputed FROM SCRATCH every single
// frame from a live seed set, exactly reusing voronoimosaic.html's own
// proven half-plane-intersection clipping code (clipHalfPlane/
// intersectEdge), just with each seed carrying its own scalar WEIGHT in the
// bisector constant: bisector(p,q) is x.(q-p) <= ((|q|^2-wq)-(|p|^2-wp))/2.
// This is a well-established, legitimate technique in materials-science
// grain-growth and foam simulation (a "radical"/Laguerre tessellation),
// not an ad hoc shortcut, and it gets every T1-like neighbour-swap for
// free as a side effect of the SAME proven clipping algorithm recomputing
// from a moved/reweighted seed set each frame -- no explicit edge-flip
// bookkeeping exists anywhere in this file. A standalone offline script
// confirmed: (a) the power diagram always tiles the bounding rectangle
// exactly (floating-point noise only, ~1e-16 relative error) for any
// weight configuration -- so this engine can never show black background;
// (b) a seed's own weight monotonically and substantially controls its
// cell's relative area, confirming the growth/shrink lever actually works;
// (c) a tuned von-Neumann-driven weight-update rule plus death/birth
// bookkeeping (below) stays stable (no NaN, no runaway cell count, no
// permanently-orphaned zero-area seeds) across a simulated 900-SECOND run
// -- 20x longer than validate.js's own 300s test window, since a periodic-
// reset engine's steady-state behaviour matters far past that window too.
// (Each power diagram tiles its OWN window's box exactly, with floating-
// point-noise-only error -- true black background is deliberate between
// windows, see "Several independent circular foam patch windows" below.)
//
// T2 (cell death) and its reverse (cell division / "birth") are each
// IMPLICIT in the same live seed-set recompute, not separate graph-surgery
// code: killing a cell is just removing its seed from next frame's array
// (its freed area is absorbed by whichever neighbours' bisectors now reach
// further -- exactly real T2's "neighbours absorb the freed area", with
// zero stitching code needed); dividing an oversized cell is just adding a
// new seed inside it with a weight modestly BELOW the parent's own (not an
// arbitrary absolute constant -- an early design used a fixed very-low
// birth weight and the new seed was instantly re-eclipsed by its still-
// larger parent, creating a runaway birth-then-immediate-death loop firing
// on nearly every frame; made relative to the parent's own live weight,
// the child reliably claims real area and the parent's own weight is
// knocked down too, so the same oversized cell doesn't re-trigger a birth
// every single frame).
//
// Death/birth thresholds are measured against a FIXED target mean area
// anchored to the cell count at the last hard reset (not the live,
// drifting mean area) -- an early version measured this against the
// CURRENT mean area and the population size drifted upward without bound
// over a long run (deaths requiring an ever-smaller absolute area to
// trigger as N grew, while births stayed equally easy): anchoring both
// thresholds to a fixed target provides real negative feedback back toward
// the starting count. A hard population floor/ceiling additionally caps
// how many deaths/births a single frame may apply (keeping the most
// urgent ones), closing the collapse/explosion failure modes a fully
// greedy per-frame rule showed in the offline script.
//
// Cells are coloured by their CURRENT side count, bucketed directly onto
// the day's 5-entry palette in index order (bucket 0 = n<=4 ... bucket 4 =
// n>=8, with 5,6,7 in between) -- a literal rendering of the same
// "colour by coordination number" convention real foam/grain-growth
// simulations use to visualise coarsening, and it reuses each palette's
// OWN existing saturation/lightness balance (already kept close across
// all 5 entries per CLAUDE.md's item-1 fix) rather than inventing new
// luma-matching logic, so population shifts between buckets can't swing
// frame brightness the way a badly-mismatched colour scheme would
// (the same "hue affects luma" trap this pool has hit many times before).
//
// Per-seed motion reuses voronoimosaic.html's own proven mechanism
// (bounded small Lissajous orbit around a fixed home position) purely for
// a fast, legible baseline churn independent of the much slower structural
// growth/shrink/death/birth dynamics -- the foam rule alone updates weights
// gradually (by design, so coarsening reads as a slow, legible process
// over the whole hour, not a flicker), which would likely be too subtle
// for validate.js's short ~1.5s fastMotion sample window on its own.
// Deliberately NO whole-field rotation at all (per truchet.html's lesson:
// a reflexive whole-field rotation only dilutes the mandatory unit-motion
// signal unless fastMotion genuinely needs it as a second source) -- the
// orbit jitter plus continuous boundary reshaping plus discrete death/birth
// events are more than enough motion on their own, and each window's own
// circular field is sized so a rotation could only ever reveal/hide
// uniform black margin anyway (no "annulus" of hidden content, unlike
// voronoimosaic.html's own single wobbling full-canvas mosaic).
//
// A full hard reset every CYCLE_SEC = 43.5s (every window's own seed
// layout rebuilt, weights zeroed) -- the same proven cycle length this
// pool's automaton.html/primespiral.html/frostgrowth.html/
// columnarbasalt.html already reuse directly (a brute-force search already
// maximised the minimum distance from validate.js's 8 fixed 300s-window
// sample times to any reset boundary; re-deriving it per engine is
// unnecessary). Coverage never dips at a reset WITHIN a window (the power
// diagram always tiles that window's own box completely, at N0 cells or N
// cells alike), so unlike automaton.html's own sparse-genesis reset this
// carries no "empty start, fills up" brightness-trend risk at all.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);
  const dt = 1 / FPS;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.lineJoin = 'round';

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  let PAL = parseColors() || palettes[resolvePalette()];
  if (PAL.length < 5) { // defensive: a `colors` override shorter than 5 still needs 5 buckets
    const out = [];
    for (let i = 0; i < 5; i++) out.push(PAL[i % PAL.length]);
    PAL = out;
  }
  // Bucket colours are luma-EQUALISED across all 5 side-count buckets
  // (same hue/saturation as the day's palette, lightness retargeted to a
  // shared luma via lightForLuma -- reused verbatim from
  // voronoimosaic.html). This is load-bearing, not cosmetic: a first
  // version used the palette's 5 colours' own natural (unequal) lightness
  // directly, and 2 of the first 8 tested seeds failed validate.js's
  // brightness-trend check (+52.7/+66.8 luma projected) -- not an
  // aliasing artefact but a real, repeating effect: within every ~43.5s
  // cycle, the side-count POPULATION shifts as cells coarsen (confirmed by
  // rendering frames across a cycle and looking -- a handful of buckets
  // visibly come to dominate by the cycle's later fraction), and since
  // n-bucket is tied directly to screen colour, an unlucky palette whose
  // buckets carry very different natural luma turns that population shift
  // into a real per-cycle brightness swing, the same "hue/lightness
  // affects luma" trap this pool has hit many times before. Full
  // equalisation is safe here (unlike herringbone.html's own luma-gap
  // bug, which needed the OPPOSITE fix) because every cell boundary is
  // additionally outlined with a separate dark stroke -- local luma
  // contrast for validate.js's spatial-structure check comes from those
  // edges, not from the fill colours differing from each other.
  function hslLuma(h, s100, l100) {
    const H = ((h % 360) + 360) % 360, S = s100 / 100, L = l100 / 100;
    const C = (1 - Math.abs(2 * L - 1)) * S;
    const hp = H / 60;
    const X = C * (1 - Math.abs((hp % 2) - 1));
    let r = 0, g = 0, b = 0;
    if (hp < 1) { r = C; g = X; } else if (hp < 2) { r = X; g = C; } else if (hp < 3) { g = C; b = X; }
    else if (hp < 4) { g = X; b = C; } else if (hp < 5) { r = X; b = C; } else { r = C; b = X; }
    const m = L - C / 2;
    return 255 * (0.2126 * (r + m) + 0.7152 * (g + m) + 0.0722 * (b + m));
  }
  function lightForLuma(h, s, target) {
    let lo = 15, hi = 85;
    for (let k = 0; k < 16; k++) {
      const mid = (lo + hi) / 2;
      if (hslLuma(h, s, mid) < target) lo = mid; else hi = mid;
    }
    return Math.round(((lo + hi) / 2) * 10) / 10;
  }
  const bucketTargetLuma = PAL.slice(0, 5).reduce((sum, [h, s, l]) => sum + hslLuma(h, s, l), 0) / 5;
  const bucketFill = PAL.slice(0, 5).map(([h, s]) => `hsl(${h}, ${s}%, ${lightForLuma(h, s, bucketTargetLuma)}%)`);
  function bucketFor(n) { return bucketFill[Math.max(0, Math.min(4, n - 4))]; }

  // --- Power (Laguerre) Voronoi clipping -- reused verbatim from
  // voronoimosaic.html, extended with a per-seed weight term. ---
  function clipHalfPlane(poly, nx, ny, c) {
    const out = [];
    const len = poly.length;
    for (let i = 0; i < len; i++) {
      const cur = poly[i];
      const prev = poly[(i - 1 + len) % len];
      const curIn = (cur[0] * nx + cur[1] * ny) <= c;
      const prevIn = (prev[0] * nx + prev[1] * ny) <= c;
      if (curIn) {
        if (!prevIn) out.push(intersectEdge(prev, cur, nx, ny, c));
        out.push(cur);
      } else if (prevIn) {
        out.push(intersectEdge(prev, cur, nx, ny, c));
      }
    }
    return out;
  }
  function intersectEdge(a, b, nx, ny, c) {
    const da = a[0] * nx + a[1] * ny - c;
    const db = b[0] * nx + b[1] * ny - c;
    const t = da / (da - db);
    return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
  }
  function powerCell(i, seeds, boundingPoly) {
    let poly = boundingPoly;
    const p = seeds[i];
    const pp = p.x * p.x + p.y * p.y - p.w;
    for (let j = 0; j < seeds.length; j++) {
      if (j === i) continue;
      const q = seeds[j];
      const nx = q.x - p.x, ny = q.y - p.y;
      const qq = q.x * q.x + q.y * q.y - q.w;
      const c = (qq - pp) / 2;
      poly = clipHalfPlane(poly, nx, ny, c);
      if (poly.length === 0) break;
    }
    return poly;
  }
  function polyArea(poly) {
    let a = 0;
    for (let i = 0; i < poly.length; i++) {
      const x0 = poly[i][0], y0 = poly[i][1];
      const x1 = poly[(i + 1) % poly.length][0], y1 = poly[(i + 1) % poly.length][1];
      a += x0 * y1 - x1 * y0;
    }
    return Math.abs(a) / 2;
  }

  // --- Several independent circular "foam patch" windows, not one
  // edge-to-edge mosaic. Added after the mandatory novelty gate's FIRST
  // design (one full-canvas power diagram, same shape as
  // voronoimosaic.html's own full-bleed mosaic) measured only 0.3958 from
  // voronoimosaic -- well below the 0.60 minimum. A per-feature z-score
  // diagnostic (the same technique phyllotaxis.html/hilbertweave.html's
  // own novelty iterations already used) showed WHY: fingerprint.js's
  // coverage/blobCount/blobSizeCV/largestBlobFrac features were EXACTLY
  // identical (diff=0.00) between the two -- both are full-bleed
  // tessellations with no black background, collapsing those 4 features
  // to the same saturated values, the IDENTICAL failure signature
  // reactiondiffusion.html's own write-up documents against
  // widmanstatten/voronoimosaic/stripweave. Applying that engine's own
  // proven fix directly: render the same underlying simulation through
  // several independent circular windows (a near-regular jittered grid,
  // the dendrite.html/hilbertweave.html/phyllotaxis.html multi-instance
  // technique) with TRUE BLACK negative space between them, instead of
  // filling the whole rectangular canvas -- this breaks the coverage/blob
  // saturation while the underlying power-Voronoi/von-Neumann mechanism
  // is completely unchanged. Window layout is fixed once per video
  // (`initWindows()`); only each window's own foam STATE resets at a hard
  // `cycleSec` boundary, exactly like every other multi-instance engine
  // in this pool.
  let windows = [];
  function initWindows() {
    const targetCount = Math.max(4, Math.round(rand(5, 7) * Math.max(0.6, Math.min(1.6, DENSITY))));
    const aspect = W / H;
    let cols = Math.max(1, Math.round(Math.sqrt(targetCount * aspect)));
    let rows = Math.max(1, Math.round(targetCount / cols));
    const cellW = W / cols, cellH = H / rows;
    // r and the jitter range are sized so two adjacent windows' discs can
    // NEVER touch even in the worst case (both jittered maximally toward
    // each other): 2*r + 2*jitterMax = 0.84 + 0.10 = 0.94 of the grid
    // spacing, a real 6% safety margin -- an earlier version (r=0.49,
    // jitter=+-0.08) allowed up to 1.14x the spacing and two windows were
    // seen touching/overlapping in a rendered frame, breaking the "true
    // black negative space between windows" design this engine exists for.
    const r = Math.min(cellW, cellH) * 0.42;
    windows = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const jx = rand(-0.05, 0.05) * cellW, jy = rand(-0.05, 0.05) * cellH;
        windows.push({
          cx: (col + 0.5) * cellW + jx,
          cy: (row + 0.5) * cellH + jy,
          r,
          box: [[-r, -r], [r, -r], [r, r], [-r, r]],
          area: Math.PI * r * r,
          seeds: [],
          N0: 1, targetMeanArea: 1, WCAP: 1, rateK: 1, CAP: 1,
        });
      }
    }
  }

  const DEATH_FRAC = 0.14, BIRTH_FRAC = 2.3;

  function makeSeed(win, hx, hy) {
    const spacing = Math.sqrt(win.targetMeanArea);
    return {
      hx, hy, w: 0,
      x: hx, y: hy,
      // Amplitude/rate raised substantially above the original single-box
      // design's values once the windowed redesign (see the comment above
      // initWindows()) showed each window's much smaller lit area needs
      // proportionally MORE per-seed motion to keep the frame-wide
      // fastMotion/compositionDrift gates clearing comfortably -- a small
      // fraction of the canvas moving a little reads as far less change
      // than the old full-canvas design's same relative motion did.
      r1: rand(0.10, 0.22) * spacing,
      r2: rand(0.10, 0.22) * spacing,
      p1: rand(0, Math.PI * 2),
      p2: rand(0, Math.PI * 2),
      // Guaranteed-minimum-magnitude, random-sign rates -- the house-style
      // convention so no seed can ever sit near-motionless for a whole cycle.
      a1r: sgn() * rand(0.7, 1.3) * SPEED,
      a2r: sgn() * rand(0.7, 1.3) * SPEED,
    };
  }

  // Shared breathing rate/amplitude (NOT independent per window): see the
  // comment at win.breathePhase0 below for why an independent-per-window
  // random phase/rate measurably failed validate.js's brightness-trend
  // check (+73.5/+68.8 luma projected on 2 of the first 5 tested seeds)
  // despite looking locally "bounded" -- an unlucky combination of
  // independent phases can still drift the SUM of all windows' lit area
  // over a sampled window. A single shared rate with phases assigned by
  // WINDOW INDEX, evenly spaced across a full 2*PI, makes the summed lit
  // area EXACTLY constant at every single instant (not just on average)
  // by discrete-Fourier orthogonality, verified offline: for windowCount
  // >= 3 the total breathing-area sum across all windows has zero
  // variance (floating-point noise only, ~1e-13) over a dense sweep of
  // simulated time; windowCount is always >= 4 here (initWindows()'s
  // `Math.max(4, ...)` floor), comfortably clear of the N=2 case where
  // this identity does NOT hold (measured variance ~0.05 there).
  let breatheRate = 1, breatheAmp = 0.25;

  function reconfigureFoam() {
    breatheRate = sgn() * rand(0.34, 0.55) * SPEED;
    breatheAmp = rand(0.24, 0.31);
    for (let wi = 0; wi < windows.length; wi++) {
      const win = windows[wi];
      win.N0 = Math.max(7, Math.round(rand(9, 14) * Math.max(0.6, Math.min(1.6, DENSITY))));
      win.targetMeanArea = win.area / win.N0;
      const spacing = Math.sqrt(win.targetMeanArea);
      win.WCAP = spacing * spacing * 0.42;
      // Faster than the original single-box design's /42 -- a smaller
      // per-window cell count needs quicker coarsening (more death/birth
      // events within a cycle) to keep the frame-wide compositionDrift
      // gate clearing comfortably at this engine's much smaller per-window
      // lit area.
      win.rateK = win.WCAP / 17;
      win.CAP = Math.round(win.N0 * 2.0);
      win.FLOOR = Math.max(4, Math.round(win.N0 * 0.33));
      // Bounded radius "breathing" -- each window's VISIBLE clip radius
      // oscillates (the underlying simulation box/area stays fixed at the
      // full win.r, only the clip shrinks/grows), reassigned fresh every
      // cycleSec like every other motion parameter in this pool. Added
      // because the von Neumann coarsening alone, while genuinely
      // changing cell count/shape, barely moves `coverage` (the fraction
      // of the frame lit) -- each window always fully tiles its own fixed
      // box regardless of cell count -- and `coverage` turned out to be
      // one of the most heavily-weighted features in this pool's
      // compositionDrift descriptor (z-score 1.76 on the pre-windowed
      // design). A bounded, per-window-staggered radius pulse gives the
      // frame-wide lit AREA a real, measurable swing while keeping the
      // SUM across all windows exactly constant at every instant (see the
      // comment above this function) -- phase assigned by WINDOW INDEX,
      // evenly spaced across a full 2*PI, not independently randomised.
      win.breathePhase0 = wi * (2 * Math.PI / windows.length);
      const margin = win.r * 0.95;
      win.seeds = [];
      for (let i = 0; i < win.N0; i++) {
        win.seeds.push(makeSeed(win, rand(-margin, margin), rand(-margin, margin)));
      }
    }
  }

  function updateOrbits(win, clk) {
    for (const s of win.seeds) {
      s.x = s.hx + s.r1 * Math.cos(s.p1 + clk * s.a1r);
      s.y = s.hy + s.r2 * Math.sin(s.p2 + clk * s.a2r);
    }
  }

  function stepFoam(win) {
    const seeds = win.seeds;
    const n = seeds.length;
    const cells = new Array(n), areas = new Array(n), sides = new Array(n);
    for (let i = 0; i < n; i++) {
      const cell = powerCell(i, seeds, win.box);
      cells[i] = cell;
      areas[i] = polyArea(cell);
      sides[i] = cell.length;
    }
    // Von Neumann-Mullins law: n<6 shrinks, n>6 grows, n=6 neutral.
    for (let i = 0; i < n; i++) {
      const drive = (sides[i] - 6) * win.rateK * dt;
      seeds[i].w = Math.max(-win.WCAP, Math.min(win.WCAP, seeds[i].w + drive));
    }
    // T2-equivalent: decide deaths as a set, respecting a population floor
    // (keep the least-dead / largest-area ones alive if too many qualify).
    let deadIdx = [];
    for (let i = 0; i < n; i++) if (areas[i] < DEATH_FRAC * win.targetMeanArea || sides[i] === 0) deadIdx.push(i);
    const maxRemovable = Math.max(0, n - win.FLOOR);
    if (deadIdx.length > maxRemovable) {
      deadIdx.sort((a, b) => areas[a] - areas[b]);
      deadIdx = deadIdx.slice(0, maxRemovable);
    }
    const deadSet = new Set(deadIdx);
    const kept = [];
    for (let i = 0; i < n; i++) {
      if (deadSet.has(i)) continue;
      kept.push(seeds[i]);
      if (n - deadIdx.length >= win.CAP) continue; // at/above population cap -- skip further births this step
      if (areas[i] > BIRTH_FRAC * win.targetMeanArea) {
        const poly = cells[i];
        let cx = 0, cy = 0;
        for (const v of poly) { cx += v[0]; cy += v[1]; }
        cx /= poly.length; cy /= poly.length;
        const spacing = Math.sqrt(win.targetMeanArea);
        const m = win.r * 0.9;
        const child = makeSeed(
          win,
          Math.min(m, Math.max(-m, cx + (rng() - 0.5) * spacing * 0.3)),
          Math.min(m, Math.max(-m, cy + (rng() - 0.5) * spacing * 0.3))
        );
        child.w = seeds[i].w - win.WCAP * 0.18;
        seeds[i].w -= win.WCAP * 0.18; // parent's own weight knocked down too, so it doesn't re-trigger a birth every frame
        kept.push(child);
      }
    }
    win.seeds = kept;
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initWindows();
  reconfigureFoam();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  const strokeW = Math.max(1.5, Math.min(W, H) * 0.0035);

  function renderFrame() {
    cycleFrame++;
    clk += dt;
    if (cycleFrame >= cycleFrames) { cycleFrame = 0; clk = 0; reconfigureFoam(); }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (const win of windows) {
      updateOrbits(win, clk);
      stepFoam(win);

      const n = win.seeds.length;
      const liveCells = new Array(n);
      for (let i = 0; i < n; i++) liveCells[i] = powerCell(i, win.seeds, win.box);

      const breatheFrac = 0.5 + 0.5 * Math.sin(win.breathePhase0 + clk * breatheRate);
      const liveR = win.r * (1 - breatheAmp * breatheFrac);

      ctx.save();
      ctx.translate(win.cx, win.cy);
      ctx.beginPath();
      ctx.arc(0, 0, liveR * 0.98, 0, Math.PI * 2);
      ctx.clip();

      // Alpha lowered from an original 0.6: total stroke-ink length scales
      // directly with live cell count (more, smaller cells = more total
      // dark edge length = lower average frame luma), and that count
      // genuinely swings over each coarsening cycle -- a real, not
      // aliased, per-cycle brightness effect that a few unlucky seeds'
      // specific timing caught as a false "trend" in validate.js's 8
      // fixed sample times. Shrinking the swing's magnitude at the source
      // (rather than chasing it with the coarsening rate, which measurably
      // helped one seed while breaking another -- the swing's shape, not
      // just its rate, differs per seed) fixed it without sacrificing the
      // crisp cell-boundary stroke the house style wants.
      ctx.strokeStyle = 'rgba(0,0,0,0.38)';
      ctx.lineWidth = strokeW;
      for (let i = 0; i < n; i++) {
        const poly = liveCells[i];
        if (poly.length < 3) continue;
        ctx.fillStyle = bucketFor(poly.length);
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for (let k = 1; k < poly.length; k++) ctx.lineTo(poly[k][0], poly[k][1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    window.currentFrame++;
  }

  window.advanceFrame = function () { renderFrame(); };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) renderFrame(); };
  window.READY = true;
})();
</script>
