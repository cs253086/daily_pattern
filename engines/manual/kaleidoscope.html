<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kaleidoscope — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated additive engine: a small set of luminous "seed" strokes drift through
// a wedge, and the wedge is mirror-reflected into N-fold radial symmetry — the
// classic kaleidoscope. Symmetry is the strongest retention driver for this
// niche (a "visual anchor" that lets the eye rest on detail). Drawn additively
// over a slow fade so the mandala glows and breathes.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, canvas sized to width/height, per-second
// rates, cheap vector strokes (segments × 2·slices per frame). No per-pixel work.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 70);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[155, 88, 62], [185, 85, 64], [275, 78, 66], [110, 82, 60]],
    ember:  [[16, 96, 62], [355, 90, 62], [40, 96, 64], [325, 78, 58]],
    ocean:  [[195, 92, 62], [215, 88, 66], [170, 85, 60], [255, 70, 66]],
    neon:   [[290, 95, 66], [180, 98, 64], [325, 94, 68], [140, 92, 62]],
    sunset: [[18, 95, 64], [340, 88, 66], [285, 78, 62], [46, 95, 66]],
    ice:    [[195, 80, 74], [210, 74, 78], [235, 66, 76], [175, 72, 72]],
    gold:   [[42, 95, 64], [30, 96, 62], [50, 92, 68], [15, 94, 60]],
  };
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  // A "colors" URL param (h,s,l;h,s,l;...) overrides the built-in palette —
  // used to recolour the engine from the image-of-the-day palette.
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.52;   // seeds roam a large radius; symmetry fills frame
  const dt = 1 / FPS;

  // Seeds: points drifting on gentle Lissajous paths within the source wedge.
  let slices, seeds, hue0;
  function config() {
    slices = randInt(5, 9);            // N-fold symmetry
    hue0 = rng() * 360;
    const n = randInt(2, 4);
    seeds = [];
    for (let i = 0; i < n; i++) {
      seeds.push({
        ar: rand(0.25, 0.95) * R, arv: rand(0.2, 0.5),  // radius osc
        aa: rng() * Math.PI * 2, aav: rand(-0.5, 0.5),   // angle drift (rad/s)
        fr: rand(0.05, 0.22),                             // radial freq
        phase: rng() * Math.PI * 2,
        colorIdx: randInt(0, PAL.length - 1),
        prev: null,
      });
    }
  }

  function hardClear() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  const stepsPerFrame = Math.max(1, Math.round(3 * DENSITY));
  let clk = 0;

  config();
  hardClear();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  // Stamp a soft additive glow bead at (x,y), reflected into every slice and
  // its mirror = luminous kaleidoscope. Filled gradients (not thin lines) so
  // overlapping stamps build bright cores like Bloom/Fluid.
  const stampR = Math.max(6, minDimGlow());
  function minDimGlow() { return Math.min(W, H) * 0.028; }
  function stamp(x, y, hue, s, l, a) {
    for (let k = 0; k < slices; k++) {
      const ang = (k / slices) * Math.PI * 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      for (const mx of [1, -1]) {           // normal + mirror -> reflective
        const px = cx + (mx * x) * ca - y * sa;
        const py = cy + (mx * x) * sa + y * ca;
        const g = ctx.createRadialGradient(px, py, 0, px, py, stampR);
        g.addColorStop(0, `hsla(${hue}, ${s}%, ${Math.min(75, l + 10)}%, ${a})`);
        g.addColorStop(1, `hsla(${hue}, ${s}%, ${l}%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, stampR, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function renderFrame() {
    cycleFrame++;
    const progress = cycleFrame / cycleFrames;

    ctx.globalCompositeOperation = 'source-over';
    const fade = progress > 0.9 ? 0.03 + (progress - 0.9) * 0.9 : 0.03;
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    for (let s = 0; s < stepsPerFrame; s++) {
      clk += dt * SPEED;
      for (const sd of seeds) {
        const r = (0.5 + 0.5 * Math.sin(clk * sd.fr + sd.phase)) * sd.ar + 0.06 * R;
        const ang = sd.aa + clk * sd.aav;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        const base = PAL[sd.colorIdx];
        const hue = ((base[0] + Math.sin(clk * 0.15) * 20 + hue0 * 0.04) % 360 + 360) % 360;
        stamp(x, y, hue, base[1], base[2], 0.16);
        sd.prev = [x, y];
      }
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; hardClear(); config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
