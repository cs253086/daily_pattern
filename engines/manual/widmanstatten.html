<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Widmanstätten Crosshatch — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine): the WIDMANSTATTEN PATTERN -- the interlocking
// crosshatch of metal bands seen when a polished, acid-etched slice of an
// iron-nickel octahedrite meteorite is examined. As the meteorite cools over
// millions of years, kamacite plates nucleate and thicken along the four
// crystallographic <111> planes of the parent taenite crystal's octahedral
// lattice; a flat cut through that 3D octahedral structure intersects those
// plane-families as several sets of PARALLEL BANDS crossing each other at
// angles fixed by the crystal geometry, producing a bold "basketweave" mesh
// of triangular/rhombic cells -- plus finer secondary bands filling the
// gaps between the wide primary lamellae (the real "comb plessite" texture).
// See CLAUDE.md's dated write-up for the search trail and sources.
//
// A genuinely different construction PRINCIPLE from everything else in the
// pool: not a single-direction field of parallel strips (stripweave.html),
// not an orthogonal axis-aligned grid (grid.html), not a filled-polygon
// tiling (tessellation.html/quasicrystal.html) -- SEVERAL independent
// families of parallel bands at oblique (non-90-degree, non-exactly-60/120)
// angles overlaid on top of each other, so the interesting structure is the
// CROSSHATCH itself (the cells the overlapping bands carve out), not any
// one family alone. Rendered as a flat abstract crosshatch, not a literal
// 3D octahedron slice -- the same "visualisation-grade, not lab-exact"
// precedent chladni.html/voderberg.html already set for this pool (getting
// the true crystallographic cut angles right would need a specific slice
// orientation relative to the octahedron, which isn't necessary to render
// the STRUCTURAL PRINCIPLE: oblique parallel-band families overlaid to form
// an interlocking mesh).
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rotation rate. Redraws each
// frame from a fixed band-family list computed once at start-up (no
// accumulation, no whiteout risk).
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 40);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const halfDiag = Math.sqrt(W * W + H * H) / 2 * 1.08; // covers every corner at any rotation angle
  const dt = 1 / FPS;

  // UNIT CHOREOGRAPHY (2026-09-10, user definition of "dynamic": the basic
  // pattern units -- here the individual bands and the crosshatch cells
  // they carve out -- must visibly move relative to each other, not just
  // the whole composition spinning as a rigid block). Every motion below
  // is COVERAGE-NEUTRAL by construction, which turned out to be the whole
  // game: a first version added a free-running width breath, an
  // accordion wave and per-band jitter, all of which either change band
  // area directly or let neighbouring bands merge, and the mean-luma
  // standard deviation over validate.js's 300s window went from 0.60
  // (original engine) to 2.45 -- enough to fail the brightness-trend
  // check on some seeds. Measured per component, then redesigned:
  //   1. Each band FAMILY scrolls along its own normal at its own speed and
  //      direction (random sign, guaranteed-minimum rate, sinusoidally
  //      modulated but never stopping), so the three families slide across
  //      each other and every crosshatch cell continuously changes shape.
  //      The band sequence is generated as one exact PERIOD (length L >=
  //      the full 2*halfDiag span) and drawn twice, offset by the scroll
  //      modulo L, so the viewport always sees a complete band field.
  //   2. Band widths breathe as exactly PAIRED see-saws: consecutive bands
  //      of the same role are paired, and band a widens by delta while
  //      band b narrows by the same delta (both about their own fixed
  //      centre, delta <= 35% of the narrower one, smaller than half the
  //      minimum gap so bands never merge). Total lit width per pair is
  //      constant at every instant; the pair phase follows a travelling
  //      wave so the breath still ripples along the family.
  //   3. A bounded ACCORDION moves band CENTRES along the normal in a
  //      travelling wave (amplitude A, wavelength lambda, with A*k held to
  //      0.25 so the local stretch never lets neighbours touch); widths
  //      are untouched, so per-band area is constant.
  //   4. Each family sways by a small bounded angle (+-0.06 rad) at its own
  //      rate, so the crosshatch angles themselves flex slightly.
  //   5. Family colours are luma-equalised (same Rec.709 luma target per
  //      role, hue/saturation untouched), so bands of different hue
  //      entering or leaving the viewport shift colour balance rather than
  //      brightness.
  // All rates/phases/wave vectors are fixed once per video in initBands();
  // the shared clock drives every position, so same seed => same frames.
  // The global rigid rotation per cycle (reconfigureRotation) is kept on
  // top of this.
  //
  // Family angles, band widths/positions, and colours are all fixed ONCE for
  // the whole video, never re-rolled per cycle -- the "any coverage-
  // affecting parameter re-randomised per cycle creates a real (not
  // aliased) brightness swing" lesson CLAUDE.md documents for nine prior
  // engines in a row. Total ink coverage is entirely a function of how many
  // bands exist and how wide they are, so re-rolling either mid-video would
  // swing average frame brightness between cycles exactly like a
  // randomised subdivision depth or star count did in those engines.

  // Rec.709 luma of an HSL colour (0-255) and the lightness that lands a
  // hue/saturation at a target luma (bisection, clamped vivid-not-pastel).
  function hslLuma(h, sat, l) {
    const S = sat / 100, L = l / 100;
    const C = (1 - Math.abs(2 * L - 1)) * S;
    const hp = (((h % 360) + 360) % 360) / 60;
    const X = C * (1 - Math.abs((hp % 2) - 1));
    let r = 0, g = 0, b = 0;
    if (hp < 1) { r = C; g = X; } else if (hp < 2) { r = X; g = C; } else if (hp < 3) { g = C; b = X; }
    else if (hp < 4) { g = X; b = C; } else if (hp < 5) { r = X; b = C; } else { r = C; b = X; }
    const m = L - C / 2;
    return 255 * (0.2126 * (r + m) + 0.7152 * (g + m) + 0.0722 * (b + m));
  }
  function lightForLuma(h, sat, target) {
    // Clamp [46, 74]: a yellow pushed below L=46 turns mustard-brown, so
    // extreme hues are only PARTIALLY equalised (measured: full
    // equalisation sd 0.92-1.07, none 1.38-1.79 -- most of the gain is
    // kept while every family stays vivid).
    let lo = 46, hi = 74;
    for (let k = 0; k < 14; k++) { const mid = (lo + hi) / 2; if (hslLuma(h, sat, mid) < target) lo = mid; else hi = mid; }
    return Math.round(((lo + hi) / 2) * 10) / 10;
  }

  let families, matrixCol;
  function initBands() {
    const d = Math.max(0.7, Math.min(1.4, DENSITY));

    // Three families at irregular (independently randomised) oblique
    // offsets -- deliberately NOT an even 60/120-degree split, which would
    // read as a regular hexagonal tiling (tessellation.html's archetype)
    // rather than the irregular basketweave a real octahedrite slice shows.
    const angle0 = rand(0, Math.PI);
    const angle1 = angle0 + rand(48, 72) * Math.PI / 180;
    const angle2 = angle1 + rand(48, 72) * Math.PI / 180;
    const angles = [angle0, angle1, angle2];

    matrixCol = PAL[SEED % PAL.length];
    const sgn = () => (rng() < 0.5 ? -1 : 1);
    // Luma target for primary bands = the mean luma of the three family
    // colours at their base lightness; secondary (plessite) bands sit a
    // fixed step lighter.
    let targetLuma = 0;
    for (let fi = 0; fi < 3; fi++) { const c = PAL[(SEED + fi + 1) % PAL.length]; targetLuma += hslLuma(c[0], c[1], c[2]); }
    targetLuma /= 3;

    families = angles.map((theta, fi) => {
      const baseCol = PAL[(SEED + fi + 1) % PAL.length];
      // "Comb" thickness pattern: a repeating short cycle of one wide
      // primary lamella followed by several narrow secondary (plessite)
      // bands, each jittered -- the real alternating wide/thin rhythm a
      // Widmanstatten slice shows, without being literally periodic (each
      // width is independently randomised within its role's range).
      const bands = [];
      let p = -halfDiag;
      let i = 0;
      while (p < halfDiag) {
        const cyclePos = i % 4;
        const isPrimary = cyclePos === 0;
        const w = isPrimary
          ? minDim * rand(0.028, 0.05) * d
          : minDim * rand(0.006, 0.016) * d;
        const gap = isPrimary
          ? minDim * rand(0.02, 0.045)
          : minDim * rand(0.01, 0.03);
        const light = lightForLuma(baseCol[0], baseCol[1], targetLuma + (isPrimary ? rand(-6, 6) : rand(10, 22)));
        bands.push({ p0: p, w, isPrimary, fill: `hsl(${baseCol[0]}, ${baseCol[1]}%, ${light}%)`, delta: 0, sign: 0, bphase: 0 });
        p += w + gap;
        i++;
      }
      // The sequence now ends at p >= halfDiag; its period is the full
      // generated length, so tiling it with period L is seamless and the
      // last gap before the wrap is a normal gap.
      const L = p + halfDiag;
      // Paired width breath (see item 2): consecutive same-role bands.
      const wk = (Math.PI * 2) / (minDim * rand(0.45, 0.65));
      for (const role of [true, false]) {
        const idx = [];
        for (let j = 0; j < bands.length; j++) if (bands[j].isPrimary === role) idx.push(j);
        for (let j = 0; j + 1 < idx.length; j += 2) {
          const a = bands[idx[j]], b = bands[idx[j + 1]];
          // delta bound: 35% of the narrower band, and never more than the
          // smallest gap adjacent to either band (0.01*minDim for
          // secondaries, 0.02*minDim for primaries) so nothing can merge.
          const delta = Math.min(0.35 * Math.min(a.w, b.w), minDim * (role ? 0.018 : 0.009));
          const centre = ((a.p0 + a.w / 2) + (b.p0 + b.w / 2)) / 2;
          a.delta = delta; a.sign = 1; a.bphase = wk * centre;
          b.delta = delta; b.sign = -1; b.bphase = wk * centre;
        }
      }
      // Scroll along the family normal: v(t) = dir * (v0 + v1*sin(wm*t+pm)),
      // v1 < v0 so the family never stops or reverses. A wide primary
      // band+gap "unit" is ~0.07*minDim, so 0.05-0.09*minDim/s slides a
      // unit past in ~0.8-1.4s -- obvious at a glance.
      const v0 = minDim * rand(0.05, 0.09) * SPEED;
      const v1 = v0 * rand(0.35, 0.6);
      const wm = rand(0.5, 0.9) * SPEED;
      // Bounded accordion (item 3): A*k = 0.25.
      const accK = (Math.PI * 2) / (minDim * rand(0.5, 0.7));
      return {
        theta, bands, L,
        dir: sgn(), v0, v1, wm, pm: rand(0, Math.PI * 2),
        wrate: sgn() * rand(1.05, 1.75) * SPEED, wphase: rand(0, Math.PI * 2),
        accK, accAmp: 0.25 / accK, accRate: sgn() * rand(1.0, 1.6) * SPEED, accPhase: rand(0, Math.PI * 2),
        swayAmp: rand(0.04, 0.06), swayRate: sgn() * rand(0.55, 0.95) * SPEED, swayPhase: rand(0, Math.PI * 2),
      };
    });
  }

  // Called at start-up AND every cycleSec. Only rotation resets --
  // coverage-neutral by construction (a rigid rotation of the whole
  // composite crosshatch doesn't change how much geometry is lit), same
  // reasoning as every other curated engine's reconfigure step. The three
  // oblique, irregularly-spaced families have no exact rotational symmetry
  // to resonate against (unlike ziggurat.html's identical wedges), so a
  // plain guaranteed-minimum-magnitude, random-sign rate is sufficient.
  // The rate was briefly lowered to 0.12-0.22 rad/s so the per-unit
  // choreography would dominate the unit-motion audit, then restored:
  // measured mean-luma sd was identical either way (the residual
  // variance is the scroll's, not the rotation's), but a slow spin's
  // coverage fluctuation has a period comparable to validate.js's ~37s
  // sample spacing and aliases into a spurious trend (worst-case shifted
  // rise 46 vs 35-41 at the original rate). The unit choreography still
  // leaves ~75-85% of frame change unexplained by the rigid fit.
  let rotAngle0, rotRate;
  function reconfigureRotation() {
    rotAngle0 = rand(0, Math.PI * 2);
    rotRate = (rng() < 0.5 ? -1 : 1) * rand(0.45, 0.9) * SPEED;
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initBands();
  reconfigureRotation();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = `hsl(${matrixCol[0]}, ${Math.max(20, matrixCol[1] - 40)}%, ${Math.max(8, matrixCol[2] - 46)}%)`;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotAngle0 + clk * rotRate);

    for (const fam of families) {
      ctx.save();
      ctx.rotate(fam.theta + fam.swayAmp * Math.sin(fam.swayPhase + clk * fam.swayRate));
      // Closed-form integral of the modulated speed, so the offset is an
      // exact function of the shared clock (no per-frame accumulation).
      const dist = fam.dir * (fam.v0 * clk - (fam.v1 / fam.wm) * (Math.cos(fam.wm * clk + fam.pm) - Math.cos(fam.pm)));
      const off = ((dist % fam.L) + fam.L) % fam.L;
      const wt = fam.wphase + clk * fam.wrate;
      const at = fam.accPhase + clk * fam.accRate;
      for (let copy = -1; copy <= 0; copy++) {
        const shift = off + copy * fam.L;
        for (const b of fam.bands) {
          const p1 = b.p0 + b.w / 2 + shift; // band centre after scroll
          if (p1 < -halfDiag - b.w || p1 > halfDiag + b.w) continue;
          const pc = p1 + fam.accAmp * Math.sin(fam.accK * p1 + at); // + bounded accordion
          const w = b.w + b.sign * b.delta * Math.sin(b.bphase + wt); // paired see-saw breath
          ctx.fillStyle = b.fill;
          ctx.fillRect(-halfDiag, pc - w / 2, halfDiag * 2, w);
        }
      }
      ctx.restore();
    }

    ctx.restore();

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureRotation(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
