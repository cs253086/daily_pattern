<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dragon Fold — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "random Wikipedia article" -- Wikipedia
// itself is blocked in this sandbox, so per this pool's established fallback
// an open WebSearch for an unusual/lesser-known geometric curve construction
// was used instead): the HEIGHWAY DRAGON CURVE -- the classic "paperfolding"
// fractal produced by repeatedly folding a strip of paper in half the same
// way and unfolding each crease to a right angle. Generated here via its
// standard Lindenmayer-system (L-system) definition: variables X, Y;
// constants F (forward), + (turn left 90deg), - (turn right 90deg); axiom
// FX; rules X -> X+YF+, Y -> -FX-Y (X and Y are non-drawing placeholders,
// only F/+/- are interpreted by the turtle).
//
// A genuinely different construction PRINCIPLE from every existing engine:
// not a substitution/subdivision system that repartitions a FIXED area
// (quasicrystal.html/voderberg.html), not several independently-angled
// overlaid band families (widmanstatten.html), not a branching growth
// process (dendrite.html), not an arithmetic sieve (primespiral.html), not
// a Hamiltonian path that visits EVERY cell of a fixed NxN grid exactly
// once (hilbertweave.html) -- a single curve built by iterated 90-degree
// paper-folding that visits an irregular, lopsided, self-touching-but-
// never-self-crossing set of cells whose very bounding-box shape changes
// with iteration order (verified offline below).
//
// VERIFIED OFFLINE before writing any rendering code, the same discipline
// this pool's quasicrystal.html/geodome.html/hilbertweave.html already
// established for a curve construction that could still "look plausible"
// even if subtly wrong: a standalone script expanded the L-system for
// orders 4/8/12/14 and confirmed, by walking the turtle and hashing every
// traversed edge, that NO edge is ever revisited in either direction (a
// true self-avoiding path) -- and that the bounding box's width/height
// ratio is genuinely NOT constant across orders (1.667, 1.533, 1.508, 0.665
// at orders 4/8/12/14), confirming the lopsided, non-square footprint
// claimed above rather than assuming it.
//
// COMPOSITION, iteration 2. The first draft rendered the curve as a
// continuous thick STROKE, multiple small instances in a grid -- the same
// general shape (several small rainbow curve-mesh clusters on black) as
// hilbertweave.html's own multi-instance composition, and the MANDATORY
// novelty gate confirmed the two read as too similar: distance 0.457
// (need >= 0.60). Rather than nudge stroke width or instance count (this
// pool's phyllotaxis.html/hilbertweave.html write-ups both document that
// parameter nudges within the same archetype don't reliably move the
// distance the right way), this is a genuine render-technique change: the
// curve's visited lattice points are drawn as a CHAIN OF SOLID BLOCKS (near
// pitch-width rounded squares, almost touching corner-to-corner) rather
// than a continuous stroke -- the same "bold filled squares" technique
// primespiral.html already established as safe, but tracing one CONNECTED
// path instead of a sieve of scattered independent points, and at ONE (or
// two, by density) large dominant scale rather than several small
// instances -- a real change to coverage, edge density, and blob-shape
// statistics, not a cosmetic one. Re-measured after the redesign; see
// CLAUDE.md's dated write-up for the number.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Redraws each frame from fixed block
// positions/colours computed once at start-up -- no accumulation, no
// whiteout risk.
//
// UNIT-LEVEL DYNAMICS, built in from the first draft (per CLAUDE.md's
// 2026-09-10 standing requirement: the basic units -- here, each individual
// block -- must visibly move RELATIVE TO EACH OTHER every second, not just
// the whole chain spinning as one rigid piece):
//   - every block bobs independently on its own small orbit (own phase and
//     rate), so neighbouring blocks in the chain visibly drift apart and
//     back together rather than moving in lockstep;
//   - a rank-selected SIZE+BRIGHTNESS pulse: a fixed FRACTION of blocks (by
//     a travelling window over path index) are enlarged/brightened at any
//     instant -- fixed count, so the pulse is coverage-neutral by
//     construction, the same mechanic chladni.html's percentile threshold
//     and hilbertweave.html's travelling pulse window already proved safe;
//   - the whole chain also has an independent slow rigid spin on top.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 41.5);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const dt = 1 / FPS;

  // Dragon-curve L-system: axiom FX, rules X -> X+YF+, Y -> -FX-Y, angle 90
  // degrees. Verified offline (see header comment) to be self-avoiding at
  // every tested order. Returns the turtle's integer-lattice point list
  // AND the exact bounding box (needed because, unlike the Hilbert curve,
  // this box is not a fixed square -- see header).
  function dragonPoints(order) {
    const rules = { X: 'X+YF+', Y: '-FX-Y' };
    let s = 'FX';
    for (let i = 0; i < order; i++) {
      let next = '';
      for (const c of s) next += rules[c] !== undefined ? rules[c] : c;
      s = next;
    }
    let x = 0, y = 0, dx = 1, dy = 0;
    const pts = [[0, 0]];
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    for (const c of s) {
      if (c === 'F') {
        x += dx; y += dy;
        pts.push([x, y]);
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      } else if (c === '+') { const ndx = -dy, ndy = dx; dx = ndx; dy = ndy; }
      else if (c === '-') { const ndx = dy, ndy = -dx; dx = ndx; dy = ndy; }
    }
    return { pts, minX, maxX, minY, maxY };
  }

  // Instance placement (grid shape, per-instance jitter), each instance's
  // dragon-curve order, block positions/colours, and every block's fixed
  // bob phase/rate are all fixed ONCE for the whole video, never re-rolled
  // per cycle -- the "any coverage-affecting parameter re-randomised per
  // cycle creates a real (not aliased) brightness swing" lesson CLAUDE.md
  // documents for a dozen-plus prior engines in a row.
  let instances;
  function initInstances() {
    const d = Math.max(0.7, Math.min(1.4, DENSITY));
    // ONE dominant instance for most densities, two side-by-side only when
    // density is pushed high -- deliberately the opposite of a small-
    // multi-instance grid (see header: that was iteration 1's archetype).
    const grid = d > 1.15 ? { cols: 2, rows: 1 } : { cols: 1, rows: 1 };
    const cellW = W / grid.cols, cellH = H;
    const order = grid.cols === 1 ? 9 : 8;
    const { pts, minX, maxX, minY, maxY } = dragonPoints(order);
    const totalPts = pts.length;
    const bboxW = Math.max(1, maxX - minX);
    const bboxH = Math.max(1, maxY - minY);
    const bboxCx = (minX + maxX) / 2, bboxCy = (minY + maxY) / 2;
    const bboxMax = Math.max(bboxW, bboxH);

    instances = [];
    for (let col = 0; col < grid.cols; col++) {
      const jx = rand(-0.04, 0.04) * cellW;
      const jy = rand(-0.04, 0.04) * cellH;
      const centerX = (col + 0.5) * cellW + jx;
      const centerY = cellH / 2 + jy;
      // Safety: a rotating chain's worst-case reach from its own centre is
      // (half-diagonal of its bbox * scale) + per-block bob amplitude. Bob
      // amplitude is a fraction of PITCH (one lattice step in px), which is
      // itself side/bboxMax -- i.e. much smaller than the half-diagonal
      // term (bboxMax is 15-23 lattice units at the orders used below), so
      // it barely affects the worst-case reach. Half-diagonal is at most
      // 0.5*sqrt(2) =~ 0.707x the LONGER bbox side (the square-bbox worst
      // case). Capping side to 0.56-0.62x the cell's smaller dimension
      // keeps 0.707*side comfortably under 0.5x the cell (0.707*0.62 =
      // 0.438 < 0.5, with headroom to spare for the negligible bob term) so
      // no instance clips a neighbour or the canvas edge at any rotation
      // angle or bob phase.
      const side = Math.min(cellW, cellH) * rand(0.56, 0.62);
      const scale = side / bboxMax;
      const originX = -bboxCx * scale;
      const originY = -bboxCy * scale;
      const pitch = scale; // distance between adjacent lattice points, in px
      const blockSize = pitch * 0.74; // visibly separated blocks: a pixelated, textured chain (not a smooth blob) reads more distinct from the pool's smooth-mesh 3D engines -- measured, not assumed (see CLAUDE.md's dated write-up: a fuller 1.06x-pitch overlap tested WORSE for novelty, moving the composition closer to torusrings3d/geodome, not further)

      const baseCol = PAL[col % PAL.length];
      const hue0 = rng() * 360;
      const hueSpread = 150 + rng() * 90; // total hue travel end-to-end along the path

      const blocks = [];
      for (let i = 0; i < totalPts; i++) {
        const [gx, gy] = pts[i];
        const bx = originX + gx * scale, by = originY + gy * scale;
        const frac = i / (totalPts - 1);
        const hue = ((baseCol[0] + hue0 + frac * hueSpread) % 360 + 360) % 360;
        blocks.push({
          bx, by, hue, sat: baseCol[1], light: baseCol[2],
          bobPh: rng() * Math.PI * 2, bobRate: 0, bobAmp: pitch * (0.34 + rng() * 0.22), bobDir: rng() * Math.PI * 2,
        });
      }

      instances.push({
        centerX, centerY, side, blocks, totalPts, blockSize,
        pulseLenIdx: Math.max(10, Math.round(totalPts * 0.16)),
        rotAngle0: 0, rotRate: 0,
        pulseDir: 1, pulseSpeed: 0, pulsePh0: rng(),
      });
    }
  }

  // Called at start-up AND every cycleSec. Only rotation/bob/pulse RATES
  // reset -- coverage-neutral by construction (a rigid rotation of a fixed
  // chain, a small per-block orbit, or a fixed-length pulse window sliding
  // along the path index all leave total lit geometry/area unchanged), same
  // reasoning as every other curated engine's reconfigure step.
  function reconfigureMotion() {
    for (const inst of instances) {
      inst.rotAngle0 = rand(0, Math.PI * 2);
      inst.rotRate = (rng() < 0.5 ? -1 : 1) * rand(0.35, 0.65) * SPEED;
      inst.pulseDir = rng() < 0.5 ? -1 : 1;
      inst.pulseSpeed = rand(0.14, 0.26) * SPEED; // fraction of path travelled per second
      for (const b of inst.blocks) {
        b.bobRate = (rng() < 0.5 ? -1 : 1) * rand(0.7, 1.3) * SPEED;
      }
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initInstances();
  reconfigureMotion();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    cycleFrame++;
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (const inst of instances) {
      // Rank-selected size+brightness pulse: a FIXED-length window of block
      // indices (so total highlighted coverage never varies as it moves)
      // slides along the path, giving genuine per-frame motion beyond the
      // per-block bob and per-cycle rotation -- the same "fixed-size
      // window, position varies" mechanic chladni.html's percentile
      // threshold / hilbertweave.html's travelling pulse already proved
      // coverage-neutral.
      const pulseCenter = ((inst.pulsePh0 + inst.pulseDir * clk * inst.pulseSpeed) % 1 + 1) % 1 * inst.totalPts;
      const halfLen = inst.pulseLenIdx / 2;

      ctx.save();
      ctx.translate(inst.centerX, inst.centerY);
      ctx.rotate(inst.rotAngle0 + clk * inst.rotRate);

      for (let i = 0; i < inst.totalPts; i++) {
        const b = inst.blocks[i];
        let dCirc = Math.abs(i - pulseCenter);
        dCirc = Math.min(dCirc, inst.totalPts - dCirc);
        const boost = dCirc < halfLen ? (1 - dCirc / halfLen) : 0;

        // Independent per-block orbit -- the basic units visibly drift
        // apart and back together, not just the whole chain spinning.
        const ph = b.bobPh + clk * b.bobRate;
        const px = b.bx + b.bobAmp * Math.cos(ph + b.bobDir);
        const py = b.by + b.bobAmp * Math.sin(ph + b.bobDir);

        const light = Math.min(88, b.light + boost * 22);
        const sat = Math.min(97, b.sat + boost * 8);
        const size = inst.blockSize * (1 + boost * 0.45);
        const r = size / 2;

        ctx.fillStyle = `hsl(${b.hue}, ${sat}%, ${light}%)`;
        ctx.beginPath();
        // Rounded square: cheap and reads as a bold block, not a fine dot.
        const rr = r * 0.32;
        ctx.moveTo(px - r + rr, py - r);
        ctx.arcTo(px + r, py - r, px + r, py + r, rr);
        ctx.arcTo(px + r, py + r, px - r, py + r, rr);
        ctx.arcTo(px - r, py + r, px - r, py - r, rr);
        ctx.arcTo(px - r, py - r, px + r, py - r, rr);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigureMotion(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
