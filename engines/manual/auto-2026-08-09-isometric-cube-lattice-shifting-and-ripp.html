<!DOCTYPE html>
<html>
<head>
    <title>Generative Art Screensaver</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- Hard Contract Implementation ---

        // 1. URL Parameter Parsing
        const urlParams = new URLSearchParams(window.location.search);
        const getParam = (name, defaultValue, parser = String) => {
            const value = urlParams.get(name);
            return value !== null ? parser(value) : defaultValue;
        };

        const seed = getParam('seed', 0, Number);
        const paletteName = getParam('palette', null); // Not used directly, but kept for contract.
        const width = getParam('width', 1920, Number);
        const height = getParam('height', 1080, Number);
        const fps = getParam('fps', 24, Number);
        const duration = getParam('duration', 3600, Number);
        const speed = getParam('speed', 1.0, Number);
        const density = getParam('density', 1.0, Number);
        const cycleSec = getParam('cycleSec', 90, Number);

        const canvas = document.getElementById('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        // 3. Seeded PRNG (Mulberry32)
        let prng_state = seed;
        function mulberry32() {
            prng_state |= 0;
            prng_state = prng_state + 0x6D2B79F5 | 0;
            let t = Math.imul(prng_state ^ prng_state >>> 15, 1 | prng_state);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) | 0;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        // PRNG helper functions
        const rand = (min, max) => mulberry32() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max + 1));
        const randChoice = (arr) => arr[randInt(0, arr.length - 1)];
        const randSign = () => (mulberry32() < 0.5 ? -1 : 1);

        // 5. Expose window variables
        window.READY = false;
        window.TOTAL_FRAMES = Math.round(duration * fps);
        window.currentFrame = 0;

        const dt = 1 / fps; // Time step per frame

        // --- Visual Engine Implementation ---

        // Cube Lattice Parameters
        const CELL_SIZE = rand(50, 80) * density;
        const GRID_ROWS = Math.ceil(height / CELL_SIZE) + 2;
        const GRID_COLS = Math.ceil(width / CELL_SIZE / 0.866) + 2; // Adjust for isometric projection

        // Number of cubes
        const NUM_CUBES = randInt(20, 40) * density;
        let cubes = [];

        // Isometric projection constants
        const ISO_X = Math.cos(Math.PI / 6); // approx 0.866
        const ISO_Y = Math.sin(Math.PI / 6); // approx 0.5

        // Base coordinates for an isometric cube face
        const cubeFaces = {
            top: [
                [-ISO_X, ISO_Y], [0, 2 * ISO_Y], [ISO_X, ISO_Y], [0, 0]
            ],
            left: [
                [-ISO_X, ISO_Y], [-ISO_X, -ISO_Y], [0, -2 * ISO_Y], [0, 0]
            ],
            right: [
                [ISO_X, ISO_Y], [0, 0], [0, -2 * ISO_Y], [ISO_X, -ISO_Y]
            ]
        };

        // Custom HSL to Hex (for internal use)
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // Color Palette Generation (seeded)
        let baseHues = [];
        const numHues = randInt(3, 5);
        let startHue = rand(0, 360);
        for (let i = 0; i < numHues; i++) {
            baseHues.push((startHue + i * rand(40, 70)) % 360);
        }

        function getColor(time, hueOffset = 0, saturation = 70, lightness = 50) {
            const cyclePhase = (time % cycleSec) / cycleSec;
            const hueShift = Math.sin(cyclePhase * Math.PI * 2 * speed * 0.5) * 30; // Gentle hue shift
            const satShift = Math.sin(cyclePhase * Math.PI * 2 * speed * 0.3) * 10;
            const litShift = Math.sin(cyclePhase * Math.PI * 2 * speed * 0.4) * 5;

            const h = (hueOffset + hueShift + 360) % 360;
            const s = Math.max(70, Math.min(95, saturation + satShift));
            const l = Math.max(45, Math.min(65, lightness + litShift));
            return `hsl(${h}, ${s}%, ${l}%)`;
        }
        
        // Cube Object
        function Cube(id) {
            this.id = id;
            this.baseX = rand(-GRID_COLS * CELL_SIZE / 2, GRID_COLS * CELL_SIZE / 2);
            this.baseY = rand(-GRID_ROWS * CELL_SIZE / 2, GRID_ROWS * CELL_SIZE / 2);
            this.scale = rand(0.5, 1.5);
            this.hueIndex = randInt(0, baseHues.length - 1);
            this.rotationRate = randSign() * rand(0.4, 1.5) * speed; // Radians per second
            this.rotation = rand(0, Math.PI * 2);
            this.oscillationFreq = rand(0.5, 1.5) * speed; // Cycles per second
            this.oscillationAmp = rand(0.5, 1.5);
            this.oscillationOffset = rand(0, Math.PI * 2);
            this.zOffset = rand(0, 2); // Initial Z offset for depth

            this.update = function(time) {
                this.rotation += this.rotationRate * dt;
            };

            this.draw = function(currentFrameTime) {
                const s = this.scale * CELL_SIZE;
                const x = this.baseX;
                const y = this.baseY;

                const globalOscillation = Math.sin(currentFrameTime * this.oscillationFreq + this.oscillationOffset) * this.oscillationAmp;
                const currentZ = this.zOffset + globalOscillation;

                const centerIsoX = x * ISO_X - y * ISO_X;
                const centerIsoY = x * ISO_Y + y * ISO_Y - currentZ * s;

                ctx.save();
                ctx.translate(width / 2 + centerIsoX, height / 2 + centerIsoY);
                ctx.rotate(this.rotation);

                ctx.lineWidth = 2; // For crisp edges
                ctx.globalCompositeOperation = 'lighter';

                const baseHue = baseHues[this.hueIndex];
                const colorFront = getColor(currentFrameTime, baseHue, 80, 60);
                const colorSide = getColor(currentFrameTime, (baseHue + 15) % 360, 75, 50);
                const colorTop = getColor(currentFrameTime, (baseHue - 15) % 360, 85, 70);

                // Draw faces from back to front for correct layering
                // Left face
                ctx.beginPath();
                ctx.moveTo(cubeFaces.left[0][0] * s, cubeFaces.left[0][1] * s);
                ctx.lineTo(cubeFaces.left[1][0] * s, cubeFaces.left[1][1] * s);
                ctx.lineTo(cubeFaces.left[2][0] * s, cubeFaces.left[2][1] * s);
                ctx.lineTo(cubeFaces.left[3][0] * s, cubeFaces.left[3][1] * s);
                ctx.closePath();
                ctx.fillStyle = colorSide;
                ctx.fill();
                ctx.strokeStyle = colorSide; // Match stroke to fill for subtle glow
                ctx.stroke();

                // Right face
                ctx.beginPath();
                ctx.moveTo(cubeFaces.right[0][0] * s, cubeFaces.right[0][1] * s);
                ctx.lineTo(cubeFaces.right[1][0] * s, cubeFaces.right[1][1] * s);
                ctx.lineTo(cubeFaces.right[2][0] * s, cubeFaces.right[2][1] * s);
                ctx.lineTo(cubeFaces.right[3][0] * s, cubeFaces.right[3][1] * s);
                ctx.closePath();
                ctx.fillStyle = colorFront;
                ctx.fill();
                ctx.strokeStyle = colorFront;
                ctx.stroke();

                // Top face
                ctx.beginPath();
                ctx.moveTo(cubeFaces.top[0][0] * s, cubeFaces.top[0][1] * s);
                ctx.lineTo(cubeFaces.top[1][0] * s, cubeFaces.top[1][1] * s);
                ctx.lineTo(cubeFaces.top[2][0] * s, cubeFaces.top[2][1] * s);
                ctx.lineTo(cubeFaces.top[3][0] * s, cubeFaces.top[3][1] * s);
                ctx.closePath();
                ctx.fillStyle = colorTop;
                ctx.fill();
                ctx.strokeStyle = colorTop;
                ctx.stroke();

                ctx.restore();
            };
        }

        function initializeCubes() {
            for (let i = 0; i < NUM_CUBES; i++) {
                cubes.push(new Cube(i));
            }
        }

        // Mandatory hard reset logic
        let lastResetFrame = 0;
        const resetIntervalFrames = Math.round(cycleSec * fps);

        function drawFrame(currentFrameTime) {
            // Clear canvas fully at reset interval
            if (window.currentFrame === 0 || (window.currentFrame - lastResetFrame) >= resetIntervalFrames) {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, width, height);
                lastResetFrame = window.currentFrame;
                //console.log(`Hard reset at frame ${window.currentFrame}`);
            } else {
                // Subtle fade for trails
                ctx.fillStyle = 'rgba(0,0,0,0.02)';
                ctx.fillRect(0, 0, width, height);
            }

            // Update and draw cubes
            for (let i = 0; i < cubes.length; i++) {
                cubes[i].update(currentFrameTime);
                cubes[i].draw(currentFrameTime);
            }
        }

        // --- Core Animation Loop ---
        window.advanceFrame = function() {
            if (window.currentFrame >= window.TOTAL_FRAMES) return;

            const currentFrameTime = window.currentFrame * dt;
            drawFrame(currentFrameTime);
            window.currentFrame++;
        };

        window.advanceFrames = function(n) {
            for (let i = 0; i < n; i++) {
                window.advanceFrame();
            }
        };

        // --- Initialization ---
        function init() {
            // Seed the PRNG
            prng_state = seed;
            initializeCubes();
            window.READY = true;
        }

        // Initialize immediately
        init();

    </script>
</body>
</html>
