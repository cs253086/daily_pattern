<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arc Rings — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, distinct from every other curated engine: bold
// concentric rings built from thick rotating ARC SEGMENTS with gaps (a
// "radar/sonar" look), rather than full polygons (geometric.html), mirrored
// point stamps (kaleidoscope.html), or full circles. Each ring spins
// independently; segments are thick and few per ring for a bold, legible
// read at a glance.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rotation rates, cheap arc
// strokes. Redraws each frame (no accumulation, no whiteout risk).
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 40);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);
  const dt = 1 / FPS;

  // A "ring" is a set of evenly-spaced thick arc segments (with gaps
  // between them) at a fixed radius, spinning as one rigid unit.
  let rings, hue0;
  function config() {
    hue0 = rng() * 360;
    const n = randInt(4, 6);
    rings = [];
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      rings.push({
        r: t * minDim * 0.46,
        segments: randInt(3, 6),
        arcFrac: rand(0.35, 0.6), // fraction of each segment's slot that is filled (rest is gap)
        rot: rng() * Math.PI * 2,
        // Guaranteed minimum magnitude with random sign -- same fix as
        // every other curated engine here.
        rotRate: (rng() < 0.5 ? -1 : 1) * rand(0.35, 1.0) * (1 - t * 0.3),
        pulseRate: rand(0.6, 1.4),
        colorIdx: i % PAL.length,
      });
    }
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  config();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function strokeRing(r, rot, segments, arcFrac, style, lw) {
    const slot = (Math.PI * 2) / segments;
    const arcLen = slot * arcFrac;
    ctx.strokeStyle = style;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    for (let k = 0; k < segments; k++) {
      const a0 = rot + k * slot;
      ctx.beginPath();
      ctx.arc(cx, cy, r, a0, a0 + arcLen);
      ctx.stroke();
    }
  }

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const lwBright = Math.max(2, minDim / 220);
    const lwSoft = lwBright * 3.2;

    for (const rg of rings) {
      const r = rg.r * (0.97 + 0.03 * Math.sin(clk * 0.6 * rg.pulseRate));
      const rot = rg.rot + clk * rg.rotRate;
      const base = PAL[rg.colorIdx];
      const hue = ((base[0] + hue0 * 0.05 + clk * 4) % 360 + 360) % 360;
      strokeRing(r, rot, rg.segments, rg.arcFrac, `hsla(${hue}, ${base[1]}%, ${Math.min(84, base[2] + 16)}%, 0.92)`, lwBright);
      strokeRing(r, rot, rg.segments, rg.arcFrac, `hsla(${hue}, ${base[1]}%, ${base[2]}%, 0.2)`, lwSoft);
    }

    // Small glow core at the centre where every ring's spokes visually converge.
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.05);
    const coreBase = PAL[0];
    const coreHue = ((coreBase[0] + hue0 * 0.05 + clk * 4) % 360 + 360) % 360;
    g.addColorStop(0, `hsla(${coreHue}, ${coreBase[1]}%, ${Math.min(80, coreBase[2] + 10)}%, 0.5)`);
    g.addColorStop(1, `hsla(${coreHue}, ${coreBase[1]}%, ${coreBase[2]}%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, minDim * 0.05, 0, Math.PI * 2); ctx.fill();

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
