<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spinning Polygon Bounce — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Physics-based curated engine (2026-09-29, owner request: "it will be also
// fun to use physic engine for a creative pattern"). Coloured balls under
// gravity bounce inside a slowly rotating regular polygon -- the "balls in
// a spinning hexagon" style that does well as satisfying Shorts.
//
// A small hand-written 2D rigid-ball simulation, no library:
//   * fixed sub-step (SUBSTEPS per video frame) semi-implicit Euler, so the
//     same seed always produces the same hour;
//   * ball-wall contacts against the moving polygon edges: the wall's own
//     velocity (omega x r) is subtracted before reflecting and added back
//     after, with a little tangential grip, so the spinning container
//     genuinely throws the balls around;
//   * equal-mass elastic-ish ball-ball collisions (O(N^2), N <= 16);
//   * containment is enforced every sub-step by projecting each ball back
//     inside every edge's half-plane (the polygon is convex), so a ball can
//     never tunnel out no matter how fast it moves;
//   * a gentle thermostat nudges total kinetic energy toward a target band
//     every frame. Real physics runs down (balls pile up at the bottom and
//     the video freezes -- the "stop developing" failure CLAUDE.md item 6
//     documents) or, with numerical error, can gain energy; the thermostat
//     rules out both over a full hour, and a hard speed cap plus a
//     non-finite guard rule out blow-ups.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Clear-and-redraw every frame; a fixed
// number of equal-size balls, so lit area is constant apart from brief
// contact flashes. cycleSec is accepted but unused.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = Math.max(0.2, fltP('speed', 1));
  const DENSITY = Math.max(0.3, fltP('density', 1));

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Consecutive small seeds give correlated first draws from Mulberry32;
  // discard a few so seed 1, 2, 3... don't all pick the same layout.
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];
  const hsl = (c, dl = 0, a = 1) => `hsla(${c[0]}, ${c[1]}%, ${Math.max(40, Math.min(76, c[2] + dl))}%, ${a})`;

  const minDim = Math.min(W, H);
  const cx = W / 2, cy = H / 2;
  const SIDES = [5, 6, 6, 7, 8][Math.floor(rng() * 5)];
  const R = minDim * 0.46;                       // circumradius
  const APOTHEM = R * Math.cos(Math.PI / SIDES);
  const OMEGA = sgn() * rand(0.45, 0.8) * SPEED;  // container spin, rad/s (lively-pace band)
  const N = Math.max(5, Math.round(rand(7, 11) * DENSITY));
  const BR = R * rand(0.095, 0.12);               // ball radius
  const G = R * rand(1.3, 2.0) * SPEED * SPEED;   // gravity, px/s^2
  const V_TARGET = R * rand(1.0, 1.35) * SPEED;   // RMS speed the thermostat holds
  const V_MAX = R * 4 * SPEED;
  const E_WALL = 0.96, E_BALL = 0.97, GRIP = 0.12;
  const SUBSTEPS = 6;
  const h = 1 / (FPS * SUBSTEPS);

  // Start balls spread through the inscribed circle without overlapping.
  const balls = [];
  const inner = APOTHEM - BR * 1.2;
  for (let i = 0; i < N; i++) {
    let x = 0, y = 0;
    for (let tries = 0; tries < 400; tries++) {
      const a = rand(0, Math.PI * 2), r = Math.sqrt(rng()) * inner;
      x = Math.cos(a) * r; y = Math.sin(a) * r;
      if (balls.every((b) => Math.hypot(b.x - x, b.y - y) > BR * 2.2)) break;
    }
    const va = rand(0, Math.PI * 2), vm = V_TARGET * rand(0.7, 1.3);
    balls.push({ x, y, vx: Math.cos(va) * vm, vy: Math.sin(va) * vm, col: PAL[i % PAL.length], flash: 0 });
  }
  const edgeFlash = new Array(SIDES).fill(0);
  let theta = rand(0, Math.PI * 2);

  // Outward unit normal of edge k at container angle th (vertices sit at
  // th + 2*pi*k/SIDES, so edge k's midpoint direction is half a step on).
  function edgeNormal(k, th) {
    const a = th + (Math.PI * (2 * k + 1)) / SIDES;
    return [Math.cos(a), Math.sin(a)];
  }

  function step() {
    theta += OMEGA * h;
    for (const b of balls) {
      b.vy += G * h;
      b.x += b.vx * h; b.y += b.vy * h;
    }
    // Walls.
    for (const b of balls) {
      for (let k = 0; k < SIDES; k++) {
        const [nx, ny] = edgeNormal(k, theta);
        const pen = b.x * nx + b.y * ny - (APOTHEM - BR);
        if (pen <= 0) continue;
        b.x -= pen * nx; b.y -= pen * ny;
        // Wall velocity at the contact point (rigid rotation about centre).
        const wx = -OMEGA * b.y, wy = OMEGA * b.x;
        let rx = b.vx - wx, ry = b.vy - wy;
        const vn = rx * nx + ry * ny;
        if (vn > 0) {
          rx -= (1 + E_WALL) * vn * nx; ry -= (1 + E_WALL) * vn * ny;
          // Tangential grip lets the spinning wall drag the ball along.
          const vt = -rx * ny + ry * nx;
          rx += GRIP * vt * ny; ry -= GRIP * vt * nx;
          b.vx = rx + wx; b.vy = ry + wy;
          if (vn > V_TARGET * 0.35) { b.flash = 1; edgeFlash[k] = 1; }
        }
      }
    }
    // Ball-ball.
    for (let i = 0; i < N; i++) {
      const a = balls[i];
      for (let j = i + 1; j < N; j++) {
        const b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy, min = BR * 2;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        const overlap = (min - d) / 2;
        a.x -= overlap * nx; a.y -= overlap * ny;
        b.x += overlap * nx; b.y += overlap * ny;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          const imp = ((1 + E_BALL) / 2) * rel;
          a.vx += imp * nx; a.vy += imp * ny;
          b.vx -= imp * nx; b.vy -= imp * ny;
          if (-rel > V_TARGET * 0.35) { a.flash = 1; b.flash = 1; }
        }
      }
    }
  }

  function thermostat() {
    let ke = 0;
    for (const b of balls) {
      if (!Number.isFinite(b.x + b.y + b.vx + b.vy)) { b.x = 0; b.y = 0; b.vx = V_TARGET; b.vy = 0; }
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > V_MAX) { b.vx *= V_MAX / sp; b.vy *= V_MAX / sp; }
      ke += b.vx * b.vx + b.vy * b.vy;
    }
    const target = N * V_TARGET * V_TARGET;
    const s = Math.sqrt(target / Math.max(1e-6, ke));
    const k = 1 + 0.04 * (Math.min(2, Math.max(0.5, s)) - 1);
    for (const b of balls) { b.vx *= k; b.vy *= k; }
    // A near-motionless ball (e.g. wedged in a corner) gets a small kick in
    // a seeded direction so nothing ever sits still for long.
    for (const b of balls) {
      if (Math.hypot(b.vx, b.vy) < V_TARGET * 0.15) {
        const a = rand(0, Math.PI * 2);
        b.vx += Math.cos(a) * V_TARGET * 0.5; b.vy += Math.sin(a) * V_TARGET * 0.5 - V_TARGET * 0.3;
      }
    }
  }

  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function polygonPath(th, r) {
    ctx.beginPath();
    for (let k = 0; k <= SIDES; k++) {
      const a = th + (2 * Math.PI * k) / SIDES;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  function renderFrame() {
    for (let s = 0; s < SUBSTEPS; s++) step();
    thermostat();

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Container: glow + core, then brighter edges that were just hit.
    const wc = PAL[0];
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const edgeR = R + BR * 0.25;
    polygonPath(theta, edgeR);
    ctx.strokeStyle = hsl(wc, 4, 0.22); ctx.lineWidth = 22; ctx.stroke();
    polygonPath(theta, edgeR);
    ctx.strokeStyle = hsl(wc, 6); ctx.lineWidth = 7; ctx.stroke();
    for (let k = 0; k < SIDES; k++) {
      if (edgeFlash[k] < 0.02) continue;
      const a0 = theta + (2 * Math.PI * k) / SIDES, a1 = theta + (2 * Math.PI * (k + 1)) / SIDES;
      ctx.strokeStyle = hsl(PAL[(k + 1) % PAL.length], 10, 0.75 * edgeFlash[k]);
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * edgeR, cy + Math.sin(a0) * edgeR);
      ctx.lineTo(cx + Math.cos(a1) * edgeR, cy + Math.sin(a1) * edgeR);
      ctx.stroke();
      edgeFlash[k] *= 0.82;
    }

    // Balls: glow, core, highlight.
    ctx.globalCompositeOperation = 'lighter';
    for (const b of balls) {
      ctx.fillStyle = hsl(b.col, 0, 0.14 + 0.1 * b.flash);
      ctx.beginPath(); ctx.arc(cx + b.x, cy + b.y, BR * 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const b of balls) {
      ctx.fillStyle = hsl(b.col, 8 * b.flash);
      ctx.beginPath(); ctx.arc(cx + b.x, cy + b.y, BR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hsl(b.col, 16, 0.8);
      ctx.beginPath(); ctx.arc(cx + b.x - BR * 0.3, cy + b.y - BR * 0.3, BR * 0.3, 0, Math.PI * 2); ctx.fill();
      b.flash *= 0.8;
    }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
