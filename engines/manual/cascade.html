<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cascade — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, deliberately DIRECTIONAL rather than radially
// symmetric: columns of rotating glowing squares cascade top-to-bottom
// (like a digital-rain waterfall), each column phase-staggered for a
// diagonal sweep. Every other engine in this pool (kaleidoscope, starburst,
// spirograph = centered radial mandalas; geometric/grid/tessellation/
// arcrings = centered rings/tiles) reads as a variation on "symmetric
// shape centered in frame" -- this one deliberately has no centre at all,
// just a directional top-to-bottom flow, to give the curated pool a
// genuinely different silhouette archetype, not just a different engine.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF, per-second rates, cheap vector strokes,
// redraws each frame (no accumulation, no whiteout risk).
//
// UNIT CHOREOGRAPHY (2026-09-10 wave 2, user definition of "dynamic": the
// basic units must visibly move RELATIVE TO EACH OTHER every second, not
// just the whole pattern scrolling). The unit-motion audit
// (scripts/audit-unit-motion.js) scored the old version at residual 5.2 /
// 80% non-rigid: every column fell at the same rate (one rigid downward
// translation) and each block's spin/size were slaved to its fall phase.
// Now, all coverage-neutral by construction:
//   * Per-block SPIN: every block has its own rotation rate (guaranteed
//     minimum, random sign, period ~3-8s) independent of its fall, so
//     neighbours tumble against each other.
//   * Sideways SWAY: a travelling wave keyed to column index (phase spans
//     exactly two cycles across the frame) moves each block +-24% of its
//     cell width (+-30%), so columns lean left/right in a ripple.
//   * Size PULSE as a travelling wave across columns AND along each column
//     (+-30% of block size); the column phases span whole cycles so the
//     frame's total stroke length stays flat at every instant.
//   * Per-column FALL SPEED: each column's fall is integrated per frame
//     (continuous across reconfigures -- no position jump at a cycle
//     boundary) at the shared base rate times (1 + 0.4 sin), phase spread
//     across columns: the floor is guaranteed (never below 0.6x) and columns
//     visibly overtake each other while the diagonal sweep re-forms on
//     average (a permanent per-column speed offset was tried first and
//     dissolved the diagonal -- the engine's identity -- within a cycle).
//   * BUNCHING: blocks within a column slide along it (+-13% of the column
//     spacing) in a travelling wave, so they bunch and spread like beads.
//   * blocksPerCol is FIXED at 4 once per video (was re-rolled 2-3 per
//     cycle: a 50% swing in total stroke length between cycles). Hue is spatial (per
//     column) with a small bounded wobble instead of a steady drift (hue
//     swings luma -- see CLAUDE.md). Each square also carries a translucent
//     additive fill (glass tile) under its bright edge: bolder (house
//     style) and the units carry enough luma for their motion to register.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 42);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const dt = 1 / FPS;

  // A "column" of falling blocks. blocksPerCol blocks are evenly spaced in
  // vertical phase within the column and wrap top-to-bottom continuously.
  // Column count and blocks-per-column are fixed once per video (initGrid);
  // config() re-rolls only rates, phases and the hue offset every cycleSec.
  let cols, cellW, blocksPerCol, hue0, fallRate, diagonalK;
  let colFall, colModPhase, spinRate, spinPhase, swayRate, swayPhase, pulseRate, modRate, bunchRate;
  function initGrid() {
    const target = Math.round(rand(9, 14) * Math.max(0.6, Math.min(1.6, DENSITY)));
    cols = target;
    cellW = W / cols;
    blocksPerCol = 4;
    // Per-column phase stagger by x position -- creates the diagonal
    // cascade sweep instead of every column falling in lockstep. Set once:
    // the per-column fall phase is integrated from here on.
    diagonalK = rand(0.6, 1.4) * (rng() < 0.5 ? -1 : 1);
    colFall = [];
    for (let gx = 0; gx < cols; gx++) colFall.push((gx / cols) * diagonalK);
  }
  function config() {
    hue0 = rng() * 360;
    // Guaranteed minimum magnitude with random sign -- same fix as every
    // other curated engine here. Fall direction itself is NOT randomised
    // (always downward, sign fixed) since that's the whole point of the
    // directional archetype -- only speed varies.
    fallRate = rand(0.13, 0.22);
    // Per-column speed-modulation phase (spread across columns so at any
    // instant some columns are fast and some slow).
    colModPhase = []; spinRate = []; spinPhase = [];
    for (let gx = 0; gx < cols; gx++) {
      colModPhase.push((gx / cols) * Math.PI * 2 * 2 + rand(-0.3, 0.3));
      for (let b = 0; b < blocksPerCol; b++) {
        spinRate.push((rng() < 0.5 ? -1 : 1) * rand(1.2, 2.3)); // rad/s, ~2.7-5.2s per turn
        spinPhase.push(rng() * Math.PI * 2);
      }
    }
    modRate = rand(0.5, 0.85);                                   // fall-speed modulation, ~7-12s
    swayRate = (rng() < 0.5 ? -1 : 1) * rand(1.2, 1.9);          // sway ~3.3-5.2s
    swayPhase = rng() * Math.PI * 2;
    pulseRate = (rng() < 0.5 ? -1 : 1) * rand(1.4, 2.1);         // size pulse ~3-4.5s
    bunchRate = (rng() < 0.5 ? -1 : 1) * rand(0.9, 1.5);         // bunching ~4-7s
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let clk = 0;

  initGrid();
  config();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function drawBlock(x, y, size, rot, style, lw, fill) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(-size / 2, -size / 2, size, size); }
    ctx.strokeStyle = style;
    ctx.lineWidth = lw;
    ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }

  function renderFrame() {
    cycleFrame++;
    clk += dt * SPEED;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const lwBright = Math.max(1.5, Math.min(W, H) / 1080 * 3.6);
    const lwSoft = lwBright * 3.0;
    const maxSize = cellW * 0.62;
    const swayAmp = cellW * 0.30;

    for (let gx = 0; gx < cols; gx++) {
      const x0 = (gx + 0.5) * cellW;
      // Integrate this column's fall: base rate x (1 + 0.4 sin), so it
      // never slows below 0.6x and never reverses; continuous across
      // reconfigures because only the rate changes, never the phase.
      colFall[gx] += dt * SPEED * fallRate * (1 + 0.4 * Math.sin(clk * modRate + colModPhase[gx]));
      const fall = colFall[gx];
      // Travelling waves keyed to column: phase spans exactly 2 cycles
      // across the frame so the per-frame sums stay flat.
      const colWave = (gx / cols) * Math.PI * 2 * 2;
      const sway = swayAmp * Math.sin(clk * swayRate + colWave + swayPhase);

      for (let b = 0; b < blocksPerCol; b++) {
        const bunch = 0.13 * Math.sin(clk * bunchRate + colWave + (b / blocksPerCol) * Math.PI * 2);
        const basePhase = (b / blocksPerCol) + bunch + fall;
        const frac = basePhase - Math.floor(basePhase); // 0..1, wraps continuously
        const y = frac * (H + maxSize * 2) - maxSize;
        // Fade in/out near the top/bottom wrap edges so blocks don't pop.
        const edgeFade = Math.min(1, Math.min(frac, 1 - frac) * 8);
        // Size pulse: travelling wave across columns and down the column.
        const size = maxSize * (0.70 + 0.30 * Math.sin(clk * pulseRate + colWave + frac * Math.PI * 2 * 2));
        const bi = gx * blocksPerCol + b;
        const rot = spinPhase[bi] + clk * spinRate[bi];
        const x = x0 + sway * (0.6 + 0.4 * Math.cos(frac * Math.PI * 2));

        const base = PAL[gx % PAL.length];
        const hue = ((base[0] + hue0 * 0.05 + x0 * 0.06 + Math.sin(clk * 0.3 + gx) * 6) % 360 + 360) % 360;
        const alphaBright = 0.9 * edgeFade;
        const alphaSoft = 0.2 * edgeFade;
        if (alphaBright < 0.02) continue;
        drawBlock(x, y, size, rot, `hsla(${hue}, ${base[1]}%, ${Math.min(84, base[2] + 16)}%, ${alphaBright})`, lwBright,
          `hsla(${hue}, ${base[1]}%, ${base[2]}%, ${0.34 * edgeFade})`);
        drawBlock(x, y, size, rot, `hsla(${hue}, ${base[1]}%, ${base[2]}%, ${alphaSoft})`, lwSoft);
      }
    }

    if (cycleFrame >= cycleFrames) { cycleFrame = 0; config(); }
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
