<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NASA Science Abstraction</title>
    <meta name="pattern-name" content="Orbital Anaglyph Flow">
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- Helper functions and constants ---
        const urlParams = new URLSearchParams(window.location.search);
        const getParam = (name, defaultValue, type = String) => {
            const value = urlParams.get(name);
            if (value === null) return defaultValue;
            return type(value);
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const width = getParam('width', 1920, Number);
        const height = getParam('height', 1080, Number);
        const seed = getParam('seed', 20261128, Number);
        const fps = getParam('fps', 24, Number);
        const duration = getParam('duration', 3600, Number);
        const speed = getParam('speed', 1, Number);
        const density = getParam('density', 1, Number);
        const cycleSec = getParam('cycleSec', 90, Number); // Default to 90 seconds for mandatory reset

        canvas.width = width;
        canvas.height = height;

        const dt = 1 / fps;
        let currentFrame = 0;
        let totalTime = 0;

        window.TOTAL_FRAMES = Math.round(duration * fps);

        // Mulberry32 PRNG
        let prng_state = seed;
        const mulberry32 = () => {
            prng_state |= 0;
            prng_state = prng_state + 0x6D2B79F5 | 0;
            let t = Math.imul(prng_state ^ prng_state >>> 15, 1 | prng_state);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) | 0;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };

        // Seed PRNG
        const rand = (min = 0, max = 1) => min + (max - min) * mulberry32();
        const randInt = (min, max) => Math.floor(rand(min, max + 1));
        const randSign = () => (mulberry32() < 0.5 ? -1 : 1);

        // HSL to CSS color string
        const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

        // Palette generation based on the "NASA Science" image
        let palette = [];
        const generatePalette = () => {
            const baseHue = rand(200, 240); // Blueish base
            const accentHue1 = (baseHue + rand(40, 80)) % 360; // Shifting towards green/cyan
            const accentHue2 = (baseHue + rand(160, 200)) % 360; // Shifting towards red/magenta

            palette = [
                hsl(baseHue, rand(80, 100), rand(40, 60)),
                hsl(accentHue1, rand(75, 95), rand(45, 65)),
                hsl(accentHue2, rand(85, 100), rand(35, 55)),
                hsl(rand(baseHue - 20, baseHue + 20), rand(70, 90), rand(50, 70)), // Lighter blue variant
                hsl(rand(accentHue2 - 20, accentHue2 + 20), rand(75, 95), rand(38, 58)) // Darker red variant
            ];
        };

        // --- Core animation logic ---

        const numOrbitals = Math.floor(rand(5, 8) * density);
        const orbitals = [];
        const maxRadius = Math.min(width, height) * 0.45;
        const minOrbitalRadius = maxRadius * 0.1;
        const maxOrbitalRadius = maxRadius * 0.9;

        class Orbital {
            constructor(id) {
                this.id = id;
                this.reset();
            }

            reset(initial = true) {
                this.baseRadius = rand(minOrbitalRadius, maxOrbitalRadius);
                this.numParticles = Math.floor(rand(5, 15) * density);
                this.orbitSpeed = randSign() * rand(0.3, 0.8) * speed; // rad/s
                this.rotationSpeed = randSign() * rand(0.5, 1.2) * speed; // rad/s for individual particles
                this.amplitude = rand(0.05, 0.15) * this.baseRadius; // for pulsing
                this.frequency = rand(0.8, 1.5) * speed; // for pulsing
                this.offsetAngle = rand(0, Math.PI * 2);

                this.targetRadius = this.baseRadius;
                this.targetOrbitSpeed = this.orbitSpeed;
                this.targetRotationSpeed = this.rotationSpeed;
                this.targetAmplitude = this.amplitude;
                this.targetFrequency = this.frequency;

                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({
                        angle: rand(0, Math.PI * 2),
                        size: rand(0.005, 0.015) * Math.min(width, height),
                        color: palette[randInt(0, palette.length - 1)],
                        innerRadiusOffset: rand(-0.05, 0.05) * this.baseRadius,
                        rotationPhase: rand(0, Math.PI * 2)
                    });
                }
            }

            updateTargets() {
                this.targetRadius = rand(minOrbitalRadius, maxOrbitalRadius);
                this.targetOrbitSpeed = randSign() * rand(0.3, 0.8) * speed;
                this.targetRotationSpeed = randSign() * rand(0.5, 1.2) * speed;
                this.targetAmplitude = rand(0.05, 0.15) * this.baseRadius;
                this.targetFrequency = rand(0.8, 1.5) * speed;
            }

            update(time, dt) {
                // Interpolate parameters for smooth evolution
                const easeFactor = 0.01 * speed; // Slower for smoother long-term change
                this.baseRadius += (this.targetRadius - this.baseRadius) * easeFactor;
                this.orbitSpeed += (this.targetOrbitSpeed - this.orbitSpeed) * easeFactor;
                this.rotationSpeed += (this.targetRotationSpeed - this.rotationSpeed) * easeFactor;
                this.amplitude += (this.targetAmplitude - this.amplitude) * easeFactor;
                this.frequency += (this.targetFrequency - this.frequency) * easeFactor;


                for (let i = 0; i < this.numParticles; i++) {
                    const p = this.particles[i];

                    // Orbital motion
                    p.angle = (p.angle + this.orbitSpeed * dt) % (Math.PI * 2);

                    // Pulsing/waving motion along the radius
                    const wavePhase = (p.angle + this.id * Math.PI / numOrbitals + this.offsetAngle + time * this.frequency) * 2;
                    const radialOffset = this.amplitude * Math.sin(wavePhase);

                    // Individual particle rotation
                    p.rotationPhase = (p.rotationPhase + this.rotationSpeed * dt) % (Math.PI * 2);


                    const currentRadius = this.baseRadius + p.innerRadiusOffset + radialOffset;

                    p.x = width / 2 + currentRadius * Math.cos(p.angle);
                    p.y = height / 2 + currentRadius * Math.sin(p.angle);
                    p.currentSize = p.size * (1 + 0.3 * Math.sin(time * this.frequency + i));
                }
            }

            draw() {
                for (let i = 0; i < this.numParticles; i++) {
                    const p = this.particles[i];
                    const size = p.currentSize;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotationPhase);

                    // Glow effect
                    ctx.globalCompositeOperation = 'lighter'; // For glow
                    ctx.strokeStyle = p.color.replace('hsla(', 'hsla(').replace(', 1)', `, 0.15)`);
                    ctx.lineWidth = size * 0.7; // Wide blurred stroke
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
                    ctx.stroke();

                    // Core bright stroke
                    ctx.globalCompositeOperation = 'source-over'; // Back to normal for core
                    ctx.strokeStyle = p.color.replace('hsla(', 'hsla(').replace(', 1)', `, 0.7)`);
                    ctx.lineWidth = size * 0.15; // Thin bright core
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }
            }
        }

        // Initialize orbitals
        for (let i = 0; i < numOrbitals; i++) {
            orbitals.push(new Orbital(i));
        }

        // --- Animation loop ---
        const advanceFrame = () => {
            totalTime = currentFrame / fps;

            // Mandatory hard reset (clear to black)
            if (currentFrame % Math.round(cycleSec * fps) === 0) {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, width, height);
                // Also update targets for evolution
                orbitals.forEach(o => o.updateTargets());
            } else {
                // Subtle fade to black
                ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
                ctx.fillRect(0, 0, width, height);
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            orbitals.forEach(o => {
                o.update(totalTime, dt);
                o.draw();
            });

            currentFrame++;
        };

        const advanceFrames = (n) => {
            for (let i = 0; i < n; i++) {
                advanceFrame();
            }
        };

        window.advanceFrame = advanceFrame;
        window.advanceFrames = advanceFrames;
        window.currentFrame = currentFrame;

        // --- Initialization ---
        generatePalette();
        orbitals.forEach(o => o.reset()); // Ensure initial state is based on fresh palette

        window.READY = true;
    </script>
</body>
</html>
