<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seigaiha Wave Scales — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find
// (today's creative-research routine, category "traditional textile/tiling/
// ornament tradition from a randomly chosen culture"): SEIGAIHA, the Japanese
// "blue sea waves" ornament. A unit is a stack of concentric circles; units are
// laid out in staggered rows, each row offset by half a unit, and the lower
// row is painted over the upper one, so only the lower arcs of every unit show
// as a field of nested fan-shaped scales. Sources (search snippets only):
// https://musubikiln.com/blogs/glossary/seigaiha,
// https://amanaut.com/seigaiha-wave-pattern/ (the staggered concentric-arc
// construction; the origin story is disputed, the geometry is not).
//
// A genuinely different construction PRINCIPLE from every other engine in the
// pool: not an imbricated lattice of elongated ellipse scales (wingscales,
// whose scales are flat ellipses with a sheen), not a tiling of polygons or
// substitution tiles (quasicrystal, voderberg, herringbone), not concentric
// rings that rotate as rigid segments (arcrings, doylespiral). Seigaiha's
// unit is one centre with nested discs, and the composition is decided by
// painter-order overlap between rows of those discs.
//
// MOTION (unit-level, every unit moves relative to its neighbours):
//   * each unit's ring radii breathe together on a travelling wave over the
//     unit index (row-major). The phase increment is an integer number of
//     whole cycles across the grid, so the summed radius change is exactly zero
//     at every instant (discrete Fourier orthogonality, the doylespiral /
//     rosenspikes construction), so coverage and brightness do not trend.
//   * a second, decorrelated wave runs across columns, so adjacent units in a
//     row are never in phase.
// Rates have a guaranteed minimum magnitude with random sign (lively 0.9-1.4
// rad/s), and are reassigned, never reset, at each cycleSec boundary.
//
// BRIGHTNESS: each ring index has one fixed hue, luma-equalised by bisecting
// lightness, so the ring-colour area mix is brightness-neutral by construction.
// Colours are fixed per ring index and never depend on wall-clock time.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);
  const dt = 1 / FPS;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Burn 4 draws first: Mulberry32's first outputs for small consecutive seeds
  // are correlated (pendulumwave.html / spinbounce.html fix).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  // Hue sets per palette, chosen so vivid colours share a similar natural luma.
  const palettes = {
    aurora: [[140, 90], [190, 88], [230, 82], [280, 78], [320, 70]],
    ember:  [[10, 95], [345, 90], [320, 82], [355, 95], [300, 80]],
    ocean:  [[185, 92], [205, 90], [225, 85], [250, 75], [270, 68]],
    neon:   [[0, 95], [165, 88], [144, 88], [216, 92], [288, 94]],
    sunset: [[10, 95], [330, 88], [280, 75], [355, 90], [190, 70]],
    ice:    [[185, 88], [205, 84], [225, 80], [250, 76], [270, 72]],
    gold:   [[20, 92], [350, 85], [300, 80], [160, 85], [240, 85]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out.map((c) => [c[0], c[1]]) : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const HUES = parseColors() || palettes[resolvePalette()];

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }
  function lumaOf(h, s, l) {
    const [r, g, b] = hslToRgb(h, s, l);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
    function lightnessForLuma(h, s, target) {
    let lo = 10, hi = 95;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2;
      if (lumaOf(h, s, mid) < target) lo = mid; else hi = mid;
    }
    return Math.max(15, Math.min(90, (lo + hi) / 2));
  }

  // ---- Geometry, built once per video ----
  const RINGS = 4;                              // nested discs per unit
  const R = (Math.min(W, H) * 0.5) / (5.2 / DENSITY); // unit radius
  const COLS = Math.ceil(W / (2 * R)) + 2;      // units per row
  const ROW_MIN = -3;
  const ROW_MAX = Math.ceil(H / R) + 3;         // rows, drawn top to bottom
  const ringCol = [];
  // Each ring index gets its own luma level (dark outer rim to bright core).
  // Equal luma on every ring would leave the frame flat to the luma-based
  // structure check; the breathing wave is zero-sum, so the ring-area mix
  // (and therefore mean brightness) still does not trend.
  for (let j = 0; j < RINGS; j++) {
    const [h, s] = HUES[j % HUES.length];
    const sat = Math.max(82, Math.min(96, s));
    const target = 78 + j * 36;   // 78, 114, 150, 186
    const light = lightnessForLuma(h, sat, target);
    ringCol.push(`hsl(${h}, ${sat}%, ${light.toFixed(2)}%)`);
  }
  // Units, in row-major order (the travelling-wave index).
  const units = [];
  for (let row = ROW_MIN; row <= ROW_MAX; row++) {
    const off = (((row % 2) + 2) % 2) ? R : 0;
    for (let col = -1; col <= COLS; col++) {
      units.push({ x: col * 2 * R + off, y: row * R, row, col, ph: 0, rate: 0 });
    }
  }
  const NU = units.length;
  const ROWS_N = ROW_MAX - ROW_MIN + 1;
  const COLS_N = COLS + 3;
  // Wave integers: whole cycles across the index set (zero-sum by construction).
  const KA = 2 + Math.floor(rng() * 2);         // 2 or 3 cycles across the row-major sequence
  const KB = 2 + Math.floor(rng() * 2);         // 2 or 3 cycles across the columns
  const phA = rng() * 2 * Math.PI;
  const phB = rng() * 2 * Math.PI; // column-wave phase offset
  // Per-unit fixed wave value (its index-fraction phase), sign-free.
  for (let i = 0; i < NU; i++) {
    const u = units[i];
    const idx = i / NU;
    const colFrac = ((u.col + 1) % COLS_N) / COLS_N;
    u.base = 2 * Math.PI * KA * idx + phA;
    u.colFrac = colFrac;
  }

  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;
  let wtA = 0, wtB = 0;     // accumulated wave phases (never reset)
  let rateA = 0, rateB = 0;

  function reconfigure() {
    rateA = sgn() * rand(0.9, 1.4) * SPEED;
    rateB = sgn() * rand(0.9, 1.4) * SPEED;
  }
  reconfigure();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  const AMP = 0.27;    // ring-radius breathing, fraction of ring radius
  const RING_LAG = 1.0; // phase lag between successive rings of one unit

  function renderFrame() {
    cycleFrame++;
    wtA += rateA * dt;
    wtB += rateB * dt;
    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigure(); }

    ctx.fillStyle = ringCol[0];
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < NU; i++) {
      const u = units[i];
      // Exact zero-sum: each unit's breathing is a sine of (base + wave time).
      const cx = u.x, cy = u.y;
      if (cx < -2 * R || cx > W + 2 * R || cy < -2 * R || cy > H + 2 * R) continue;
      const base = 0.6 * Math.sin(u.base - wtA) + 0.4 * Math.sin(2 * Math.PI * KB * u.colFrac + phB - wtB);
      let prev = Infinity;
      for (let j = 0; j < RINGS; j++) {
        // Each ring breathes with a small lag behind its neighbour, so the
        // bands drift against one another inside the unit (not one rigid scale).
        const sj = 1 + AMP * Math.sin(Math.asin(Math.max(-1, Math.min(1, base))) - j * RING_LAG);
        let r = R * (1.1 - j * 0.25) * sj;
        if (r > prev * 0.97) r = prev * 0.97;   // keep rings nested
        prev = r;
        ctx.fillStyle = ringCol[j];
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    window.currentFrame++;
  }

  window.advanceFrame = function () { renderFrame(); };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) renderFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
