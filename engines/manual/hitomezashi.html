<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hitomezashi Stitch Field — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a random web find (today's
// creative-research routine, category "obscure mathematical object / physical
// phenomenon" was tied for least recent use; the search came back to the
// traditional Japanese sashiko stitch rule). HITOMEZASHI: a sheet of cloth is
// stitched along straight rows and columns, and each row and each column is
// given a single binary choice (which of the two offsets its first stitch
// starts on). Stitches then alternate along every line, and the whole pattern
// is fixed by those two bit strings. Sources (search snippets only):
// Defant & Kravitz, "Loops and Regions in Hitomezashi Patterns", arXiv
// 2201.03461 (parity lemma: stitches on one line alternate, and the regions
// carved out by stitches can be two-coloured so neighbours differ);
// Reimann, "Connections between Hitomezashi Patterns and Truchet Tiling",
// Bridges 2023 (the starting bits fully determine the design);
// https://dev.to/stepinto/sashiko-a-stone-screen-and-tartan-each-made-from-one-simple-rule-d72
//
// A genuinely different construction PRINCIPLE from the rest of the pool: the
// composition is a PARITY-DEFINED two-colour region map. The edge set and the
// region colouring are fixed by the bit strings, computed once per video by a
// breadth-first walk (every stitch crossed flips the colour). No other engine
// colours regions by stitch-crossing parity; kumiko (slats), mudcrack (greedy
// random cracks), mondrian (guillotine rectangles) and grid (regular squares)
// all differ.
//
// MOTION (unit-level, geometric, topology never changes): the lattice vertices
// are displaced by two plane waves over the (integer-count) lattice index. The
// stitch edges stay straight between their displaced endpoints, so the cells
// and their black stitch lines deform and slide against each other. Each wave
// has an integer number of whole periods across the lattice in both
// directions, so the summed displacement over all vertices is exactly zero at
// every instant (discrete-Fourier orthogonality), and the two colours are
// luma-equal, so the moving region borders do not trend mean brightness. Wave
// phases are accumulated and never reset; only the rates reassign at each
// cycleSec boundary.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF.
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const CYCLE_SEC = fltP('cycleSec', 43.5);
  const dt = 1 / FPS;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Burn 4 draws first: Mulberry32's first outputs for small consecutive seeds
  // are correlated (pendulumwave.html / spinbounce.html fix).
  for (let i = 0; i < 4; i++) rng();
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);
  const randInt = (a, b) => a + Math.floor(rng() * (b - a + 1));

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  // Hue sets per palette, chosen so vivid colours share a similar natural luma.
  const palettes = {
    aurora: [[140, 90], [190, 88], [230, 82], [280, 78], [320, 70]],
    ember:  [[10, 95], [345, 90], [320, 82], [355, 95], [300, 80]],
    ocean:  [[185, 92], [205, 90], [225, 85], [250, 75], [270, 68]],
    neon:   [[0, 95], [165, 88], [144, 88], [216, 92], [288, 94]],
    sunset: [[10, 95], [330, 88], [280, 75], [355, 90], [190, 70]],
    ice:    [[185, 88], [205, 84], [225, 80], [250, 76], [270, 72]],
    gold:   [[20, 92], [350, 85], [300, 80], [160, 85], [240, 85]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out.map((c) => [c[0], c[1]]) : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const HUES = parseColors() || palettes[resolvePalette()];

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }
  function lumaOf(h, s, l) {
    const [r, g, b] = hslToRgb(h, s, l);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function lightnessForLuma(h, s, target) {
    let lo = 10, hi = 95;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2;
      if (lumaOf(h, s, mid) < target) lo = mid; else hi = mid;
    }
    return Math.max(15, Math.min(90, (lo + hi) / 2));
  }

  // ---- Lattice and stitch topology, built once per video ----
  const C = 16, R = 9;                     // visible cells across / down
  const CW = W / C, CH = H / R;            // cell size in px
  // Extended index ranges: vertices i in [-1, C+1], j in [-1, R+1], so the
  // displaced lattice always covers the frame.
  const NX = C + 3, NY = R + 3;            // vertex counts per axis
  const SW = 0.18 * Math.min(CW, CH);      // stitch thread width (px)

  // One bit per row and per column of the lattice (the hitomezashi bits).
  const hb = [], vb = [];
  for (let j = 0; j < NY; j++) hb.push(randInt(0, 1));
  for (let i = 0; i < NX; i++) vb.push(randInt(0, 1));

  // Horizontal stitch from vertex (i,j) to (i+1,j): on row j, every other unit
  // segment is stitched, offset by the row bit.
  function hStitch(i, j) { return ((i + hb[j + 1]) & 1) === 0; }
  // Vertical stitch from vertex (i,j) to (i,j+1): on column i, every other unit
  // segment is stitched, offset by the column bit.
  function vStitch(i, j) { return ((j + vb[i + 1]) & 1) === 0; }

  // Cells are indexed by their lower-left vertex (ci, cj), ci in [-1, C],
  // cj in [-1, R]. A breadth-first walk flips the colour across every stitch
  // and keeps it across every open edge, giving a two-colour region map.
  const CNX = NX - 1, CNY = NY - 1;        // cell counts per axis
  const tone = new Int8Array(CNX * CNY).fill(-1);
  const cidx = (ci, cj) => (ci + 1) * CNY + (cj + 1);
  {
    const q = [[0, 0]];
    tone[cidx(0, 0)] = 0;
    while (q.length) {
      const [ci, cj] = q.shift();
      const t = tone[cidx(ci, cj)];
      // Neighbour right across vertical edge at column ci+1, segment cj.
      const nb = [
        [ci + 1, cj, vStitch(ci + 1, cj)],
        [ci - 1, cj, vStitch(ci, cj)],
        [ci, cj + 1, hStitch(ci, cj + 1)],
        [ci, cj - 1, hStitch(ci, cj)],
      ];
      for (const [ni, nj, st] of nb) {
        if (ni < -1 || ni > C || nj < -1 || nj > R) continue;
        const k = cidx(ni, nj);
        const want = st ? 1 - t : t;
        if (tone[k] === -1) { tone[k] = want; q.push([ni, nj]); }
      }
    }
  }
  for (let k = 0; k < tone.length; k++) if (tone[k] === -1) tone[k] = 0;

  // Luma-equal tone colours (lightness bisected per hue).
  const TONE_LUMA = 122;
  const toneHues = [HUES[0], HUES[Math.min(2, HUES.length - 1)]];
  const toneCol = toneHues.map(([h, s]) => {
    const sat = Math.max(84, Math.min(96, s));
    const light = lightnessForLuma(h, sat, TONE_LUMA);
    return `hsl(${h}, ${sat}%, ${light.toFixed(2)}%)`;
  });
  const STITCH_COL = '#07060d';

  const stitchCells = { h: [], v: [] };
  for (let i = -1; i <= C; i++) for (let j = -1; j <= R + 1; j++) if (hStitch(i, j)) stitchCells.h.push([i, j]);
  for (let i = -1; i <= C + 1; i++) for (let j = -1; j <= R; j++) if (vStitch(i, j)) stitchCells.v.push([i, j]);

  // ---- Motion: two plane waves over the lattice ----
  // Integer-period plane waves: the displacement summed over all NX*NY
  // vertices is exactly zero at every instant.
  const KX1 = randInt(1, 2), KY1 = randInt(1, 2);
  const KX2 = randInt(1, 2), KY2 = randInt(1, 2);
  const PH1 = rng() * 2 * Math.PI, PH2 = rng() * 2 * Math.PI;
  const AMPX = 0.2 * CW, AMPY = 0.2 * CH;  // displacement in px (0.2 cell)
  let rate1 = sgn() * rand(1.6, 2.4) * SPEED;
  let rate2 = sgn() * rand(1.6, 2.4) * SPEED;
  let p1 = 0, p2 = 0;
  const cycleFrames = Math.max(1, Math.round(CYCLE_SEC * FPS));
  let cycleFrame = 0;

  function reconfigure() {
    // Rates only (phases keep accumulating), so nothing pops at the boundary.
    rate1 = sgn() * rand(1.6, 2.4) * SPEED;
    rate2 = sgn() * rand(1.6, 2.4) * SPEED;
  }

  const VX = new Float64Array(NX * NY), VY = new Float64Array(NX * NY);
  const vIdx = (i, j) => (i + 1) * NY + (j + 1);

  function computeVertices() {
    for (let ii = 0; ii < NX; ii++) {
      for (let jj = 0; jj < NY; jj++) {
        const i = ii - 1, j = jj - 1;
        const k = ii * NY + jj;
        const a = 2 * Math.PI * (KX1 * ii / NX + KY1 * jj / NY);
        const b = 2 * Math.PI * (KX2 * ii / NX + KY2 * jj / NY);
        VX[k] = i * CW + AMPX * Math.sin(a + PH1 + p1);
        VY[k] = j * CH + AMPY * Math.sin(b + PH2 + p2);
      }
    }
  }
  const vAt = (i, j) => vIdx(i, j);

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  // Stitch threads are coloured by the parity tone of the cell they border, so
  // each thread takes one of the two colours. The composition is threads on
  // black, not filled regions.
  function drawFrame() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = SW;
    ctx.lineCap = 'butt';
    for (const t of [0, 1]) {
      ctx.strokeStyle = toneCol[t];
      ctx.beginPath();
      for (const [i, j] of stitchCells.h) {
        const cj = Math.min(j, R);
        if (tone[cidx(i, cj)] !== t) continue;
        const a = vAt(i, j), b = vAt(i + 1, j);
        ctx.moveTo(VX[a], VY[a]);
        ctx.lineTo(VX[b], VY[b]);
      }
      for (const [i, j] of stitchCells.v) {
        if (tone[cidx(i - 1, j)] !== t) continue;
        const a = vAt(i, j), b = vAt(i, j + 1);
        ctx.moveTo(VX[a], VY[a]);
        ctx.lineTo(VX[b], VY[b]);
      }
      ctx.stroke();
    }
  }

  function renderFrame() {
    cycleFrame++;
    p1 += rate1 * dt;
    p2 += rate2 * dt;
    if (cycleFrame >= cycleFrames) { cycleFrame = 0; reconfigure(); }
    computeVertices();
    drawFrame();
    window.currentFrame++;
  }

  window.advanceFrame = function () { renderFrame(); };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) renderFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
