<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Liesegang Rings — headless engine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Curated GEOMETRIC engine, inspired by a genuinely random web find (today's
// creative-research routine, category "obscure mathematical object / crystal
// system / physical phenomenon" -- under-used recently alongside textile
// traditions, per the herringbone.html precedent of varying categories
// rather than defaulting to a heavily-used one). An open WebSearch surfaced
// the LIESEGANG PHENOMENON (Raphael Liesegang, 1896): when a diffusing
// "outer" electrolyte reacts with an "inner" electrolyte pre-dispersed in a
// gel, the precipitate does NOT form a uniform blob -- it self-organises
// into discrete, sharply separated concentric rings (or parallel bands from
// a line source), each ring's formation locally depleting the reagent so
// the NEXT ring nucleates further out. The ring spacing is not arbitrary:
// it follows the empirically- and theoretically-grounded Jablczynski
// spacing law, a GEOMETRIC PROGRESSION x_n = a * k^n (k roughly 1.1-1.5 in
// real experiments) -- gaps between rings visibly WIDEN outward, a
// distinctive rhythm unlike a simple evenly-spaced ring set. Sources:
// https://www.insilico.hu/liesegang/history/history.html,
// https://pubs.acs.org/doi/10.1021/acs.langmuir.9b03018 (Langmuir, "Pattern
// Formation in Precipitation Reactions: The Liesegang Phenomenon"),
// https://www.mdpi.com/1996-1944/14/6/1526 (MDPI, "Regular-Type Liesegang
// Pattern of AgCl in a 1D System").
//
// A genuinely different construction PRINCIPLE from every other radial/ring
// engine in the pool: `ziggurat.html`/`arcrings.html`/`doylespiral.html` are
// all a FIXED deterministic geometric rule stepped through uniformly (equal
// angular steps, a conformal map) -- Liesegang's defining trait is a ring
// position that is the OUTCOME of a nucleation/depletion competition, which
// this engine renders via the actual empirical GEOMETRIC-PROGRESSION
// spacing law (`x_n = a*k^n`) rather than any uniform or golden-angle
// increment. `chladni.html`/`phasespikes.html`/`moire.html` are continuous
// wave-interference fields (zero-crossings, ranked maxima, beat occlusion)
// -- Liesegang has no wave at all, it's a one-directional depletion-front
// process. `primespiral.html` is the pool's only other "arithmetic rule ->
// discrete marks" engine, but a sieve has no growing-gap spacing law.
// Rendered with SEVERAL independent nucleation centres scattered across the
// frame (not one dominant centred mandala, avoiding the "Archetype
// clustering" over-concentration this file documents) whose ring systems
// overlap and additively blend -- a real multi-droplet Liesegang
// experiment shows exactly this kind of ring-system interference, and it
// reads compositionally distinct from every single-centre radial engine.
//
// Headless contract (see src/render.js):
//   URL params : seed, palette, colors, width, height, fps, duration, speed, density, cycleSec
//   window     : READY, TOTAL_FRAMES, currentFrame, advanceFrame(), advanceFrames(n)
// Deterministic Mulberry32, no rAF. Every centre's position, growth
// constant k, spacing constant a, and every individual ring's fixed
// position/width/hue are computed ONCE per video in initSystems() --
// structurally whiteout-proof (the canvas clears to solid black every
// frame, additive blending only ever composites WITHIN one frame, never
// across frames) and coverage-stable by construction. No whole-field
// rotation is used at all (per truchet.html's lesson that a reflexive
// whole-field rotation only dilutes the mandatory unit-motion signal by
// dominating the rigid-fit unless fastMotion genuinely needs it -- a ring
// is rotationally symmetric about its own centre anyway, so rotating it
// would be invisible motion, the same degeneracy torusrings3d.html/
// doylespiral.html already had to design around).
(() => {
  const params = new URLSearchParams(location.search);
  const intP = (k, d) => { const v = parseInt(params.get(k), 10); return Number.isFinite(v) ? v : d; };
  const fltP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

  const W = intP('width', 1920);
  const H = intP('height', 1080);
  const FPS = Math.max(1, intP('fps', 24));
  const DURATION = Math.max(1, fltP('duration', 3600));
  const SEED = intP('seed', 1);
  const SPEED = fltP('speed', 1);
  const DENSITY = fltP('density', 1);
  const CYCLE_SEC = fltP('cycleSec', 34);

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  let rsx = (SEED >>> 0) || 1;
  function rng() {
    rsx |= 0; rsx = (rsx + 0x6D2B79F5) | 0;
    let t = Math.imul(rsx ^ (rsx >>> 15), 1 | rsx);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + rng() * (b - a);
  const sgn = () => (rng() < 0.5 ? -1 : 1);

  const paletteNames = ['aurora', 'ember', 'ocean', 'neon', 'sunset', 'ice', 'gold'];
  const palettes = {
    aurora: [[140, 90, 58], [190, 88, 60], [230, 82, 62], [280, 78, 64], [320, 70, 58]],
    ember:  [[10, 95, 58], [345, 90, 58], [320, 82, 55], [30, 95, 60], [50, 90, 62]],
    ocean:  [[185, 92, 60], [205, 90, 62], [225, 85, 64], [250, 75, 64], [270, 68, 62]],
    neon:   [[0, 95, 62], [72, 90, 60], [144, 88, 60], [216, 92, 64], [288, 94, 64]],
    sunset: [[10, 95, 60], [330, 88, 62], [280, 75, 60], [40, 95, 64], [190, 70, 60]],
    ice:    [[185, 88, 58], [205, 84, 60], [225, 80, 60], [250, 76, 58], [270, 72, 56]],
    gold:   [[35, 95, 62], [15, 92, 58], [55, 90, 66], [350, 85, 58], [70, 85, 62]],
  };
  function parseColors() {
    const raw = params.get('colors');
    if (!raw) return null;
    const out = raw.split(';').map((t) => t.split(',').map(Number)).filter((a) => a.length === 3 && a.every(Number.isFinite));
    return out.length >= 2 ? out : null;
  }
  function resolvePalette() {
    const raw = params.get('palette');
    if (raw && palettes[raw]) return raw;
    if (raw !== null && raw !== '') { const i = parseInt(raw, 10); if (Number.isFinite(i)) return paletteNames[((i % 7) + 7) % 7]; }
    return paletteNames[SEED % paletteNames.length];
  }
  const PAL = parseColors() || palettes[resolvePalette()];

  const dt = 1 / FPS;
  const halfDiag = Math.sqrt((W / 2) ** 2 + (H / 2) ** 2);

  const MIN_GAP_PX = 7; // rings tighter than this near the centre are culled (too fine to read as "bold")

  let systems, allRings, ringCount;
  function initSystems() {
    const N = Math.max(3, Math.min(6, Math.round(4 * Math.max(0.6, Math.min(1.6, DENSITY)))));
    systems = [];
    // Scatter centres with jitter around a coarse grid so systems spread
    // across the frame without a perfectly regular lattice (real multiple-
    // droplet experiments land irregularly) -- deliberately NOT the
    // "several small self-contained instances in a near-regular grid"
    // composition several prior engines (hilbertweave/dendrite/voronoimosaic
    // design 3) already occupy, since here systems OVERLAP and blend rather
    // than sitting in separate cells.
    const cols = N <= 3 ? N : Math.ceil(Math.sqrt(N));
    for (let i = 0; i < N; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const rows = Math.ceil(N / cols);
      const cx = W * ((col + 0.5) / cols) + rand(-W * 0.14, W * 0.14);
      const cy = H * ((row + 0.5) / rows) + rand(-H * 0.14, H * 0.14);
      const k = rand(1.16, 1.36);
      const bandFrac = rand(0.30, 0.42);
      const hue0 = rng() * 360;
      // Reach far enough that ring systems from off-centre positions still
      // extend past the canvas edge -- a full multi-system field, not
      // several small isolated blobs.
      const reach = halfDiag * rand(0.85, 1.15);
      // Choose `a` (first-ring radius) via the MIN_GAP_PX cutoff: the
      // Jablczynski law's very first gaps are always too fine to read as
      // "bold" (see the offline sweep in this file's own verification --
      // gaps as small as 1-3px near the centre), so start generation from
      // the smallest radius whose gap already clears MIN_GAP_PX rather
      // than rendering an indistinct blurred disc at the centre.
      let a = 6;
      while (a * (k - 1) < MIN_GAP_PX) a *= k;
      const radii = [];
      let x = a;
      while (x < reach) { radii.push(x); x *= k; }
      const rings = radii.map((r, idx) => {
        const prev = idx === 0 ? r / k : radii[idx - 1];
        const gap = r - prev;
        const width = Math.max(1.5, gap * bandFrac * rand(0.85, 1.15));
        const hue = ((hue0 + rand(-14, 14) + idx * rand(-1.5, 1.5)) % 360 + 360) % 360;
        const alpha = rand(0.38, 0.55);
        // Each ring gets its own independent wobble phase/rate -- a bounded
        // RADIAL position wobble (not a width pulse) is the primary motion
        // source, deliberately replacing a first design's width-only pulse
        // (an area-fraction-weighted travelling wave, the same construction
        // doylespiral.html uses): shifting a thin
        // annulus's CENTRE radius by a small amount leaves its own area
        // almost unchanged (area ~ r*width, and the wobble amplitude below
        // is bounded to a small fraction of the local gap, itself much
        // smaller than r), so this is naturally far closer to brightness-
        // neutral than pulsing width -- and unlike a width pulse, a real
        // radial shift visibly redistributes the rotation-invariant radial
        // mass profile `compositionDrift` measures, which a first design's
        // pure width-pulse (even area-fraction-weighted for zero-sum) two
        // real bugs proved insufficient for: 8/11 seeds failed
        // compositionDrift on thin margins (0.0115-0.0148 vs the 0.015
        // floor) and multi-system ADDITIVE overlap turned out to violate
        // the width-pulse's linear zero-sum assumption once pixels near
        // saturation (near-white clipping is not linear in ring width), a
        // real (not aliased) brightness-trend failure on 2/11 seeds.
        const wobbleAmp = gap * rand(0.12, 0.22);
        const wobbleRate = sgn() * rand(0.35, 0.65) * SPEED;
        const wobblePhase = rand(0, Math.PI * 2);
        return { cx, cy, r, width, hue, alpha, wobbleAmp, wobbleRate, wobblePhase };
      });
      systems.push({ cx, cy, k, hue0 });
      allRings = allRings ? allRings.concat(rings) : rings.slice();
    }

    ringCount = allRings.length;
  }

  let clk = 0;

  initSystems();

  window.READY = false;
  window.TOTAL_FRAMES = Math.max(1, Math.round(DURATION * FPS));
  window.currentFrame = 0;

  function renderFrame() {
    clk += dt;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const paletteBase = PAL[0];
    const sat = paletteBase[1];
    const lightBase = paletteBase[2];

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'butt';
    for (const rg of allRings) {
      const r = rg.r + rg.wobbleAmp * Math.sin(rg.wobblePhase + clk * rg.wobbleRate);
      ctx.strokeStyle = `hsla(${rg.hue}, ${sat}%, ${lightBase}%, ${rg.alpha})`;
      ctx.lineWidth = rg.width;
      ctx.beginPath();
      ctx.arc(rg.cx, rg.cy, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  window.advanceFrame = function () { renderFrame(); window.currentFrame++; };
  window.advanceFrames = function (n) { for (let i = 0; i < n; i++) window.advanceFrame(); };
  window.READY = true;
})();
</script>
</body>
</html>
