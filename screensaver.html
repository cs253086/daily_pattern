<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Additive Bloom</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; top: 20px; left: 20px;
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 18px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    transition: opacity 0.6s ease;
    z-index: 10;
    min-width: 260px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui h1 { margin: 0 0 14px 0; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.95; }
  .row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .row label { width: 72px; opacity: 0.7; font-size: 12px; }
  .val { width: 32px; opacity: 0.5; font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1; accent-color: #8b7cff; }
  select {
    flex: 1;
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .buttons { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s;
    flex: 1;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button.primary { background: rgba(139, 124, 255, 0.25); border-color: rgba(139, 124, 255, 0.5); }
  button.primary:hover { background: rgba(139, 124, 255, 0.4); }
  .hint { font-size: 10.5px; opacity: 0.4; margin-top: 12px; line-height: 1.5; letter-spacing: 0.3px; }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,14,0.85); backdrop-filter: blur(10px);
    padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>◇ Additive Bloom</h1>
  <div class="row"><label>Speed</label><input type="range" id="speed" min="0.2" max="3" step="0.1" value="1"><span class="val" id="speedVal">1.0</span></div>
  <div class="row"><label>Density</label><input type="range" id="density" min="0.5" max="3" step="0.1" value="1"><span class="val" id="densityVal">1.0</span></div>
  <div class="row"><label>Cycle (s)</label><input type="range" id="cycle" min="30" max="300" step="10" value="120"><span class="val" id="cycleVal">120</span></div>
  <div class="row"><label>Palette</label>
    <select id="palette">
      <option value="neon">Neon</option>
      <option value="ember">Ember</option>
      <option value="ocean">Ocean</option>
      <option value="forest">Forest</option>
      <option value="aurora">Aurora</option>
      <option value="mono">Monochrome</option>
      <option value="sunset">Sunset</option>
    </select>
  </div>
  <div class="buttons">
    <button id="newBtn" class="primary">New Pattern</button>
    <button id="pauseBtn">Pause</button>
    <button id="fsBtn">Fullscreen</button>
  </div>
  <div class="hint">H — hide UI · F — fullscreen · N — new pattern · Space — pause<br>Tip: hide UI before recording for a clean capture.</div>
</div>

<div id="toast"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(window.innerWidth * DPR);
    H = canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // Palettes (HSL triples)
  const palettes = {
    neon:    [[285, 85, 60], [180, 90, 58], [325, 85, 62], [220, 85, 62]],
    ember:   [[18, 92, 56],  [355, 85, 56], [42, 95, 60],  [330, 70, 50]],
    ocean:   [[200, 85, 55], [220, 80, 60], [170, 75, 55], [240, 60, 60]],
    forest:  [[110, 65, 50], [150, 70, 50], [70, 80, 55],  [40, 75, 55]],
    aurora:  [[155, 80, 55], [195, 85, 60], [275, 75, 60], [115, 70, 55]],
    mono:    [[0, 0, 90],    [0, 0, 70],    [0, 0, 50],    [0, 0, 80]],
    sunset:  [[15, 90, 60],  [340, 80, 60], [285, 70, 55], [45, 90, 60]]
  };

  const state = {
    palette: 'neon',
    speed: 1,
    density: 1,
    cycleSeconds: 120,
    agents: [],
    frame: 0,
    cycleFrame: 0,
    paused: false
  };

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  function makeAgents() {
    const n = randInt(5, 8);
    const types = ['lissajous', 'rose', 'spiro', 'orbit', 'lissajous', 'rose'];
    const agents = [];
    const sharedSides = randInt(3, 9); // family resemblance
    for (let i = 0; i < n; i++) {
      const type = types[randInt(0, types.length - 1)];
      agents.push({
        type,
        a: randInt(1, 7),
        b: randInt(1, 7),
        k: randInt(2, 7),
        phase: Math.random() * Math.PI * 2,
        sides: Math.random() < 0.6 ? sharedSides : randInt(3, 9),
        rot: Math.random() * Math.PI * 2,
        rotSpeed: rand(-0.025, 0.025),
        stampSize: rand(7, 22),
        pathScale: rand(0.18, 0.36),
        pathDrift: rand(-0.0003, 0.0003),
        speed: rand(0.0025, 0.006),
        hueShift: i * 25 + rand(-10, 10),
        t: Math.random() * Math.PI * 2,
        colorIdx: i % 4
      });
    }
    return agents;
  }

  function path(agent) {
    const t = agent.t;
    const s = Math.min(W, H) * agent.pathScale * (1 + Math.sin(t * 0.07) * 0.08);
    let x, y;
    switch (agent.type) {
      case 'lissajous':
        x = Math.sin(agent.a * t + agent.phase) * s;
        y = Math.sin(agent.b * t) * s;
        break;
      case 'rose': {
        const r = Math.cos(agent.k * t) * s;
        x = r * Math.cos(t);
        y = r * Math.sin(t);
        break;
      }
      case 'spiro': {
        const R = s, rr = s * 0.32;
        const ratio = (R - rr) / rr;
        x = (R - rr) * Math.cos(t) + rr * Math.cos(ratio * t + agent.phase);
        y = (R - rr) * Math.sin(t) - rr * Math.sin(ratio * t + agent.phase);
        break;
      }
      case 'orbit':
        x = Math.cos(agent.a * t + agent.phase) * s;
        y = Math.sin(agent.b * t + agent.phase) * s * 0.75;
        break;
    }
    return [W / 2 + x, H / 2 + y];
  }

  function drawPolygon(x, y, size, sides, rot, hsl, alpha) {
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a = rot + (i / sides) * Math.PI * 2;
      const px = x + Math.cos(a) * size;
      const py = y + Math.sin(a) * size;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `hsla(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%, ${alpha})`;
    ctx.lineWidth = 1 * DPR;
    ctx.stroke();
  }

  function fullFade(amount) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(0, 0, 0, ${amount})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
  }

  state.agents = makeAgents();
  ctx.globalCompositeOperation = 'lighter';

  function tick() {
    if (!state.paused) {
      state.frame++;
      state.cycleFrame++;

      const cycleFrames = state.cycleSeconds * 60;
      const progress = state.cycleFrame / cycleFrames;

      // Phase 3: fade out
      if (progress > 0.88) {
        const fade = (progress - 0.88) / 0.12;
        fullFade(0.015 + fade * fade * 0.08);
      }

      // Restart cycle
      if (state.cycleFrame >= cycleFrames) {
        state.cycleFrame = 0;
        fullFade(1); // hard clear
        state.agents = makeAgents();
      }

      const palette = palettes[state.palette];
      const stepsPerFrame = Math.max(1, Math.round(2 * state.density));

      ctx.globalCompositeOperation = 'lighter';

      for (const agent of state.agents) {
        for (let step = 0; step < stepsPerFrame; step++) {
          agent.t += agent.speed * state.speed;
          agent.rot += agent.rotSpeed * state.speed;
          agent.pathScale += agent.pathDrift * state.speed;
          if (agent.pathScale < 0.12) agent.pathDrift = Math.abs(agent.pathDrift);
          if (agent.pathScale > 0.4)  agent.pathDrift = -Math.abs(agent.pathDrift);

          const [x, y] = path(agent);
          const base = palette[agent.colorIdx % palette.length];
          const huePulse = Math.sin(agent.t * 0.25) * 18;
          const sizePulse = 1 + Math.sin(agent.t * 0.4 + agent.phase) * 0.25;

          drawPolygon(
            x, y,
            agent.stampSize * sizePulse * DPR,
            agent.sides,
            agent.rot,
            [base[0] + huePulse + agent.hueShift * 0.2, base[1], base[2]],
            0.085
          );
        }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();

  // ===== UI =====
  const ui = document.getElementById('ui');
  const toast = document.getElementById('toast');
  let hideTimer;
  function showUI() {
    ui.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => ui.classList.add('hidden'), 3500);
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }
  document.addEventListener('mousemove', showUI);
  showUI();

  const bind = (id, fn) => document.getElementById(id).addEventListener('input', fn);
  bind('speed', e => { state.speed = +e.target.value; document.getElementById('speedVal').textContent = state.speed.toFixed(1); });
  bind('density', e => { state.density = +e.target.value; document.getElementById('densityVal').textContent = state.density.toFixed(1); });
  bind('cycle', e => { state.cycleSeconds = +e.target.value; document.getElementById('cycleVal').textContent = state.cycleSeconds; });
  document.getElementById('palette').addEventListener('change', e => { state.palette = e.target.value; });

  function newPattern() {
    state.agents = makeAgents();
    state.cycleFrame = 0;
    fullFade(1);
    showToast('New pattern');
  }
  document.getElementById('newBtn').addEventListener('click', newPattern);

  document.getElementById('pauseBtn').addEventListener('click', () => {
    state.paused = !state.paused;
    document.getElementById('pauseBtn').textContent = state.paused ? 'Play' : 'Pause';
  });

  document.getElementById('fsBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'h') { ui.classList.toggle('hidden'); clearTimeout(hideTimer); }
    else if (k === 'f') { document.getElementById('fsBtn').click(); }
    else if (k === 'n') { newPattern(); }
    else if (k === ' ') { document.getElementById('pauseBtn').click(); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
